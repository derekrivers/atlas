# ATLAS-3: tests, lint, type-check on every PR (Phase 0).
#
# Job names are a repo-owned contract, not cosmetic: the evidence
# pipeline (docs/atlas/evidence-pipeline.md, "Job-name convention") types
# CI evidence by job-name prefix — test* -> TEST_RESULT,
# lint* -> LINT_RESULT. Rename jobs only with a matching doc change.
name: CI

on:
  pull_request:
    # `edited` is required so fixing a title re-runs the gate without a push;
    # the gate job guards itself to pull_request so it never runs on push.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The requires-python floor from pyproject.toml, so CI catches use of
  # features newer than the version the package claims to support.
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  lint-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run mypy atlas tests

  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run python -m atlas.tools.doc_linter

  # Architecture-fitness sensor: enforces the layer spine contract in
  # pyproject [tool.importlinter] (ATLAS-114). lint* job name types this as
  # LINT_RESULT evidence per the job-name convention.
  lint-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run lint-imports

  # PR-title provenance gate: the title must resolve a real (ATLAS-NN) ticket
  # key via the verification mapper, so PR->ticket provenance holds by
  # construction, or carry a FRESH ATLAS-00xM meta label (records PRs;
  # ATLAS-160 — a label reused from merged subject history fails naming the
  # collision and the next free label). The `lint` job-name prefix types this
  # as LINT_RESULT evidence per the job-name convention above. pull_request
  # only — a push has no PR title to check.
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the meta-label check reads main's merged squash
          # subjects via git log (the cheapest honest source — no network,
          # no token; ATLAS-160).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: PR title must carry a ticket key
        # The title is attacker-controlled; it reaches the script through an
        # env var and is never interpolated into the run body (D6).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git log --format=%s origin/main > merged-titles.txt
          uv run python scripts/check_pr_title.py "$PR_TITLE" --history merged-titles.txt
