repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run mypy through uv so it sees the project's real environment
      # (dependencies and their type stubs) instead of an isolated one.
      - id: mypy
        name: mypy
        entry: uv run mypy atlas tests
        language: system
        types: [python]
        pass_filenames: false
      # Doc-set consistency is repo-global (MANIFEST completeness is
      # cross-file), so the linter always runs rather than filtering on
      # changed files.
      - id: doc-linter
        name: doc-linter
        entry: uv run python -m atlas.tools.doc_linter
        language: system
        pass_filenames: false
        always_run: true
      # The import graph is repo-global (a layer violation can live in any
      # module), so like doc-linter the contract always runs rather than
      # filtering on changed files. Enforces the layer spine in pyproject
      # [tool.importlinter] (ATLAS-114).
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
