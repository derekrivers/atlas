  key: ATLAS-1
  title: Create repository skeleton per bootstrap guide
  objective: Establish the canonical directory structure for the Atlas repository so that all subsequent phases have a consistent, agreed-upon layout to build into.
  context: 'The bootstrap guide specifies the exact folder structure required before any code is written. This is the first physical act of creating the Atlas harness: the directories, the root README, and the initial git history. Nothing else in Phase 0 can proceed until the skeleton exists.'
  status: done
  ticket_type: infrastructure
  risk_level: low
  priority: 100
  relevant_docs:
  - docs/atlas/bootstrap-guide.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - 'Top-level directories exist: docs/atlas, docs/architecture, docs/decisions, docs/planning, docs/product, docs/runbooks, docs/tech-debt, atlas/, tests/.'
  - A root README.md is present (content may be minimal).
  - A .gitignore appropriate for Python projects is present.
  - The repository has at least one commit containing the skeleton.
  - No application code, CI config, or pyproject.toml is added in this ticket.
  non_goals:
  - Python project initialisation (pyproject.toml, uv) — that is a separate ticket.
  - CI pipeline configuration.
  - Placing any Atlas documents into the directories.
  - Creating apps/, workers/, or infra/ directories (deferred to the phases that need them).
  implementation_notes:
  - Follow the folder snapshot in bootstrap-guide.md §18 exactly.
  - Do not create apps/, workers/, or infra/ — those arrive with the phases that need them.
  - The docs/planning/ directory should be created but left empty; it is the render target for atlas apply.
  test_requirements:
  - A shell script or pytest fixture asserts that every required directory path exists in the repository tree.
  - Verify .gitignore excludes __pycache__, *.pyc, .env, and uv.lock is NOT ignored (it must be committed).
  documentation_requirements:
  - Root README.md must exist with at minimum the project name and a one-line description.
  definition_of_done:
  - All required directories exist and are tracked by git (use .gitkeep where needed).
  - CI (once added) can check out the repo and find the expected structure.
  - No extraneous top-level directories are present.
  estimated_effort: null
