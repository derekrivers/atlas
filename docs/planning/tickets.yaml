  key: ATLAS-14
  title: 'Storage layer: SQLAlchemy ORM tables and Alembic migrations'
  objective: Implement the SQLAlchemy ORM table definitions and initial Alembic migration for all atlas.core entities, providing a SQLite-backed (PostgreSQL-compatible) storage layer that is the source of truth for operational state per ADR-0006.
  context: ADR-0006 establishes the Atlas database as the source of truth for operational state. ADR-0002 specifies SQLite locally behind the same SQLAlchemy layer as PostgreSQL. Every entity defined in atlas.core (Product, ADR, Epic, Ticket, TicketDependency, Lesson, Evidence, PlanRun, ContextPack, AgentRun) needs a corresponding ORM table. The storage layer lives in atlas.storage and imports from atlas.core; it must never be imported by atlas.core (layer spine rule). The initial Alembic migration creates all tables from scratch.
  status: done
  ticket_type: infrastructure
  risk_level: high
  priority: 70
  relevant_docs:
  - docs/decisions/0002-use-postgresql-as-source-of-truth.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - ARCHITECTURE.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - 'SQLAlchemy ORM table definitions exist in atlas/storage/tables.py for all entities: products, adrs, epics, tickets, ticket_dependencies, lessons, evidence, plan_runs, generation_stages, context_packs, agent_runs, and a key_counters table.'
  - An Alembic migration (initial migration) creates all tables from scratch on a fresh database.
  - The storage layer uses SQLite by default (connection string from config/env) and is PostgreSQL-compatible (no SQLite-specific types used for shared columns).
  - A database session factory (atlas/storage/database.py) provides a context-manager-based session with proper commit/rollback semantics.
  - 'The Evidence table enforces append-only semantics at the ORM level: no update method is exposed on the EvidenceRepository; the ORM mapper has no update path for evidence rows.'
  - 'The key_counters table exists with columns: counter_name (str, primary key), current_value (int); used by the key authority (Phase 2).'
  non_goals:
  - Do not implement repository classes (query methods) in this ticket — those are the next ticket.
  - Do not implement any CLI commands.
  - Do not implement PostgreSQL-specific features (JSONB, etc.) — use JSON type that works on both.
  - Do not implement multi-database routing or connection pooling beyond SQLAlchemy defaults.
  implementation_notes:
  - Use SQLAlchemy 2.x declarative base with mapped_column and Mapped type annotations.
  - Use JSON type (sqlalchemy.types.JSON) for dict fields — compatible with both SQLite and PostgreSQL.
  - Alembic env.py should import the ORM Base metadata for autogenerate support.
  - The key_counters table is the foundation for the key authority (ATLAS-25 in Phase 2); initialise it with rows for 'ticket' and 'epic' counters at value 0.
  - Place ORM definitions in atlas/storage/tables.py; session factory in atlas/storage/database.py; Alembic config in alembic/.
  test_requirements:
  - 'Integration test: run the Alembic migration against an in-memory SQLite database and assert all expected tables exist.'
  - 'Integration test: insert a row into each table and assert it can be retrieved.'
  - 'Unit test: confirm the database session factory provides a working session with rollback on exception.'
  - 'Test: confirm no atlas.core module is imported from atlas.storage (import-linter or manual check).'
  documentation_requirements: []
  definition_of_done:
  - All ORM table definitions implemented in atlas.storage.
  - Initial Alembic migration created and tested against SQLite.
  - All integration tests pass under pytest.
  - ruff and mypy pass with no errors.
  - atlas.storage does not import from any layer above atlas.storage in the spine.
  estimated_effort: null
