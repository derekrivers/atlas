  context: 'Blocker analysis answers: what is blocking a given ticket, what tickets are blocked, what does completing a ticket unlock, and which blocking tickets carry high/critical risk. `blocked(graph, key)` returns the set of unfinished depends_on targets of a ticket. `unlocks(graph, key)` returns the tickets that become ready if the given ticket completes. The high-risk blocker report surfaces any blocking ticket with risk_level in {high, critical} that a non-terminal ticket depends on — advisory only, never gates readiness or dispatch. All functions read graph attributes only, never storage.'
