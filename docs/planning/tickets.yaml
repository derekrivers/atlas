  key: ATLAS-93
  title: Context pack embedding in Linear issue descriptions
  objective: When the PM Engine promotes a ticket to Ready for Agent, embed the rendered context pack into the Linear issue description so Symphony's agent prompt receives the full ATLAS CONTEXT PACK v1 block without requiring Atlas API access from the workspace.
  context: 'Symphony renders issue.description into the agent prompt via WORKFLOW.md. The context pack must therefore be embedded directly in the Linear description at promotion time. The PM Engine writes the description as: human-readable summary, then a separator, then the ATLAS CONTEXT PACK v1 header with pack_id and rendered_at, then the rendered_markdown. The description is frozen once the ticket moves to In Progress. If the pack exceeds the Linear description size limit, the PM Engine falls back to embedding only objective/constraints/criteria sections and committing the full pack to docs/planning/packs/<ticket-key>.md. The roadmap seeds this as ATLAS-82.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 90
  relevant_docs:
  - docs/atlas/symphony-integration.md
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/context-renderer.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - When the PM Engine promotes a ticket to Ready for Agent, the Linear issue description is updated to contain the ATLAS CONTEXT PACK v1 block with pack_id, rendered_at timestamp, and the full rendered_markdown from the ContextPack.
  - 'The description format is: human-readable summary, then ---, then ATLAS CONTEXT PACK v1 | pack_id: <uuid> | rendered_at: <ts>, then the rendered_markdown.'
  - The pack is refreshed on every sync tick while the ticket is in Ready for Agent; once the ticket moves to In Progress the description is frozen and no further updates are made.
  - If the rendered pack exceeds the Linear description character limit, the fallback embeds only objective, constraints, and acceptance criteria sections, and writes the full pack to docs/planning/packs/<ticket-key>.md.
  - AgentRun records created from observation carry input_context_pack_id referencing the pack embedded at dispatch time.
  - 'Unit tests cover: normal embed, frozen-after-in-progress, and size-limit fallback paths.'
  non_goals:
  - Do not implement context pack rendering itself (delivered in Phase 5).
  - Do not implement AgentRun creation from PR observation (that is a separate ticket).
  - Do not implement multi-product description rendering.
  - Do not add a separate Atlas API endpoint for pack retrieval from workspaces.
  implementation_notes:
  - The Linear description size limit must be measured empirically; symphony-integration.md open items lists this as a pre-Phase-8 resolution item.
  - The embed logic lives in atlas/pm/promotion.py alongside the existing promote_ready function.
  - The frozen-description rule is enforced by checking the ticket's current status before writing; the allow-list in atlas/linear/ already prevents status from crossing Atlas→Linear, so only the description field is gated here.
  - pack_id and rendered_at are read from the ContextPack model fields.
  test_requirements:
  - 'Unit test: promote_ready embeds the pack in the Linear description in the correct format.'
  - 'Unit test: a second sync tick while the ticket is in Ready for Agent refreshes the embedded pack.'
  - 'Unit test: a sync tick while the ticket is In Progress does not update the description.'
  - 'Unit test: a pack exceeding the size limit triggers the fallback path and writes docs/planning/packs/<key>.md.'
  - 'Integration test (operator-run): a real ticket promoted to Ready for Agent in Linear shows the ATLAS CONTEXT PACK v1 block in its description.'
  documentation_requirements:
  - Update docs/atlas/symphony-integration.md to mark the context-pack-delivery open item (Linear description size limit) as resolved with the measured limit.
  definition_of_done:
  - A ticket promoted to Ready for Agent has its Linear description updated with the full ATLAS CONTEXT PACK v1 block.
  - The description is frozen once the ticket enters In Progress.
  - The fallback path is implemented and tested.
  - All unit and integration tests pass.
  - CI is green.
