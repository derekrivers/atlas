  key: ATLAS-82
  title: Tests, lint, build, and coverage check evaluators
  objective: Implement the per-check evaluators for TESTS, LINT, BUILD, and COVERAGE check types that query the evidence store for the latest system-tier evidence pinned to the PR head commit and return a typed evaluation result.
  context: For machine-checkable checks (tests, lint, build, coverage), the Verification Engine must find the latest system-tier evidence record of the matching type with commit_sha equal to the PR head commit. Agent-tier evidence is ignored entirely for these checks. A new push resets these checks to PENDING. This implements the core 'no evidence = no completion' rule for CI-produced evidence.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 90
  relevant_docs:
  - docs/atlas/verification-engine.md
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - Each evaluator (tests, lint, build, coverage) queries EvidenceRepo for the latest system-tier record (created_by_type == system) of the matching evidence_type with commit_sha == head_commit.
  - If no system-tier record exists for the head commit, the evaluator returns PENDING regardless of any agent-tier records.
  - If the latest system-tier record has status PASSED, the evaluator returns PASSED; FAILED returns FAILED; other statuses map to their EvidenceStatus equivalents.
  - Agent-tier evidence records are never consulted for these four check types.
  - Each evaluator returns a typed CheckEvaluation carrying check_type, status, reason string, and the evidence_id(s) consulted.
  - Unit tests use fixture evidence records to verify PASSED, FAILED, PENDING, and the agent-tier-ignored cases.
  non_goals:
  - Implementing the documentation, acceptance_criteria, scope, or human_approval evaluators.
  - Persisting VerificationCheck records — that is the aggregation/CLI ticket.
  - Coverage threshold enforcement — v1 only requires that coverage evidence exists.
  implementation_notes:
  - Implement in atlas/verification/evaluators/ci.py with one function per check type or a single parametrised evaluator.
  - The evaluator is a pure function over evidence records — it takes a list of Evidence objects (pre-filtered by the caller) and the head_commit SHA, returning CheckEvaluation.
  - Reuse EvidenceRepo query methods from Phase 6; do not duplicate query logic.
  test_requirements:
  - 'Unit test: system-tier PASSED evidence at head commit → evaluator returns PASSED.'
  - 'Unit test: system-tier FAILED evidence at head commit → evaluator returns FAILED.'
  - 'Unit test: no system-tier evidence at head commit (only agent-tier) → evaluator returns PENDING.'
  - 'Unit test: system-tier evidence exists but for a different commit → evaluator returns PENDING.'
  - 'Unit test: multiple system-tier records for same check and commit → latest by (created_at, id) is used.'
  documentation_requirements: []
  definition_of_done:
  - Evaluators for TESTS, LINT, BUILD, COVERAGE implemented and type-annotated.
  - All unit tests pass in CI.
