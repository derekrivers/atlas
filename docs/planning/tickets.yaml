  context: 'The planning engine specification §2.1 defines the full atlas plan flow. The command must: collect inputs and record SHAs, load the current backlog, render the prompt, call the configured model, parse the proposal (tolerating fences), run all seven gates, run the reconciler, persist a PlanRun at status:proposed, and print the diff. It must never write to docs/planning/. Failures before raw output exists exit with a typed message and no PlanRun; failures after raw output produce a failed PlanRun with machine-readable failure_reason.'
