  key: ATLAS-77
  title: Evidence tier and pinning enforcement (EvidenceRepo guard)
  objective: 'Implement the blanket repository-layer guard in EvidenceRepo that enforces trust-tier rules across all evidence types: system-tier records must carry all three required fields; agent-tier records are capped at PENDING; the guard is unconditional and not limited to specific evidence types.'
  context: 'evidence-pipeline.md specifies: ''The repository guard is blanket on the system tier: EvidenceRepo.add rejects any system-tier record missing any of the three regardless of evidence_type — there is no CI-evidence-type allowlist. Agent-submitted records remain capped at PENDING by the knowledge-core repository rule.'' This ticket ensures the guard is implemented as a single enforcement point in EvidenceRepo.add, covering all evidence types uniformly, and that the capping and rejection rules are tested exhaustively across all evidence types.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 95
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - EvidenceRepo.add raises a typed MissingEvidenceFieldError for any system-tier record missing commit_sha, external_run_id, or payload_hash, regardless of evidence_type.
  - EvidenceRepo.add caps any agent-tier record's status at PENDING regardless of the submitted status value and regardless of evidence_type.
  - The guard is implemented as a single code path in EvidenceRepo.add, not as per-evidence-type checks scattered across callers.
  - Human-tier records (created_by_type=human) are not subject to the PENDING cap and may carry any status.
  - Unit tests cover the guard for each of the four evidence types (TEST_RESULT, LINT_RESULT, BUILD_RESULT, COVERAGE_REPORT, PR_REVIEW, DOCUMENTATION_UPDATE) for both the system-tier rejection and agent-tier capping cases.
  - A test confirms that a human-tier PASSED record is stored as PASSED without capping.
  non_goals:
  - Implementing the normaliser functions that call EvidenceRepo.add — those are the mapper tickets.
  - Implementing Verification Engine rules that read evidence — that is Phase 7.
  - Adding per-evidence-type allowlists — the guard is explicitly blanket per the design doc.
  implementation_notes:
  - This ticket may overlap with the schema ticket (ATLAS-61 equivalent); if the schema ticket already implements a partial guard, this ticket completes and hardens it to be blanket and type-agnostic.
  - MissingEvidenceFieldError should be a typed exception in atlas.evidence.errors, not a ValueError.
  - The capping logic should log the original submitted status before overwriting it, for auditability.
  test_requirements:
  - Parametrised unit tests covering all evidence types for system-tier rejection and agent-tier capping.
  - Test confirming human-tier records bypass the PENDING cap.
  - Test confirming the guard raises a typed error (not a generic exception) on missing required fields.
  documentation_requirements:
  - Docstring on EvidenceRepo.add documenting the blanket guard, the three required fields for system-tier, and the PENDING cap for agent-tier.
  definition_of_done:
  - All parametrised unit tests pass in CI.
  - Guard is a single code path in EvidenceRepo.add.
  - Typed error raised on missing required fields confirmed by test.
  estimated_effort: null
