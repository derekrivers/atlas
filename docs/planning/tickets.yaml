  objective: Move the duplicated natural-key sort helper into a single canonical location in atlas.core and eliminate the import inversion where atlas.dependencies imports from atlas.planning, so the layer spine is clean before import-linter enforcement is installed.
  context: 'The Phase 3 closure report (referenced in the roadmap Phase 3.5 section) identified two architectural problems: (1) the natural-key sort helper is duplicated across modules rather than living in a single core primitive, and (2) atlas.dependencies imports from atlas.planning, which is an inverted edge in the canonical layer spine (atlas.planning sits above atlas.dependencies). ARCHITECTURE.md defines the layer spine with atlas.planning above atlas.dependencies, meaning atlas.dependencies must never import from atlas.planning. This ticket resolves both issues as a prerequisite to installing import-linter enforcement.'
  status: done
  ticket_type: tech_debt
  risk_level: medium
  priority: 10
  relevant_docs:
  - ARCHITECTURE.md
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/dependency-engine.md
  acceptance_criteria:
