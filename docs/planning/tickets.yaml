  title: End-to-end delivery automation test
  objective: 'Implement and pass the Phase 8 milestone acceptance test: a ready, context-rich fixture ticket flows from context pack through Symphony dispatch to PR, evidence ingestion, and verification without manual steps beyond the defined human gates.'
  context: 'The Phase 8 milestone test requires the full delivery loop to operate end-to-end: a fixture ticket in Ready for Agent state (with an embedded context pack) is dispatched by Symphony, the agent opens a PR, CI produces system-tier evidence, the Verification Engine evaluates the evidence, and the PM Engine transitions the ticket to Done (or surfaces it for human approval). This test exercises the integration of all Phase 8 components: WORKFLOW.md, context pack embedding, AgentRun reconstruction, handoff-state handling, and failure analysis. The roadmap seeds this as ATLAS-90.'
  status: needs_human_decision
  ticket_type: infrastructure
  risk_level: high
  priority: 40
  relevant_docs:
  - docs/atlas/symphony-integration.md
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/verification-engine.md
  - docs/atlas/evidence-pipeline.md
  - docs/planning/inbox/smoke-b-fixture.md
  acceptance_criteria:
  - A fixture ticket (the Smoke B fixture from docs/planning/inbox/smoke-b-fixture.md or equivalent) is placed in Ready for Agent with an embedded ATLAS CONTEXT PACK v1 block in its Linear description.
  - Symphony dispatches the ticket automatically (no manual trigger beyond placing it in Ready for Agent).
  - The agent opens a PR referencing the ticket key and moves the ticket to PR Open, then Review Required when CI is green.
  - The evidence poller ingests at least one system-tier CI evidence record (TEST_RESULT or BUILD_RESULT) pinned to the PR head commit.
  - The Verification Engine produces a verdict for the ticket; the PM Engine transitions the ticket to Done on a PASSED verdict (or surfaces it for human approval if human_approval is required).
  - An AgentRun record exists for the dispatch session with pr_number and head_commit_sha populated.
  - The test is documented as an operator-run live gate in a runbook; CI green is necessary but not sufficient (ADR-0008).
  non_goals:
  - Do not automate the human approval gate — the operator performs that step.
  - Do not test failure paths (cycle detection, dwell breach) in this end-to-end test; those are covered by unit tests in their respective tickets.
  - Do not test multi-ticket PRs; the fixture closes exactly one ticket.
  - Do not implement a fully automated CI-only version of this test; it requires a live Symphony instance and Linear workspace.
  implementation_notes:
  - 'Use the Smoke B fixture (docs/planning/inbox/smoke-b-fixture.md) as the test ticket: a docs-only change with falsifiable acceptance criteria, sized so the interesting part is the machinery around it.'
