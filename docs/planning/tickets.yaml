  title: Per-stage truncation handling and batch sizing for staged generation
  objective: 'Implement per-stage truncation detection (stop_reason: max_tokens) that fails honestly naming the stage, and a batch-sizing heuristic that keeps each stage-2 call well inside the 64K output ceiling.'
  context: Planning-large-corpora.md §5.4 and §7 require truncation detection per stage and a batch-sizing mechanism. ATLAS-101's stop_reason==max_tokens detection applies per stage. Per-epic ticket batching keeps each call far inside 64K; a pathologically large epic that still exceeds the bound fails honestly naming the stage. The batch-sizing heuristic is the lever that prevents truncation in normal operation.
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 40
  relevant_docs:
  - docs/atlas/planning-large-corpora.md
  - docs/decisions/0010-multi-call-generation-with-single-proposal-reconciliation.md
  acceptance_criteria:
  - Each stage call checks stop_reason; a max_tokens stop_reason raises a typed StageTruncationError naming the stage index and stage type.
  - A StageTruncationError causes the PlanRun to be recorded as failed with a failure_reason that names the stage.
  - 'The batch-sizing heuristic estimates the output token budget for a stage-2 call and refuses to dispatch a call estimated to exceed a configurable ceiling (default: 50K tokens).'
  - The token estimator uses chars/4 (consistent with the context renderer's estimator).
  - 'Unit tests cover: truncation detection for each stage type, batch-size refusal when estimated tokens exceed ceiling.'
  non_goals:
  - Do not implement automatic epic splitting when a batch is too large (that is a follow-up).
  - Do not implement dynamic ceiling adjustment.
  - Do not implement truncation recovery (a truncated stage fails the run).
  implementation_notes:
  - StageTruncationError should carry stage_index, stage_type, and the raw partial output for provenance.
  - The batch-size estimator should estimate the expected output size based on the number of tickets in the epic and a per-ticket token estimate derived from the prompt template.
  - The ceiling is a module constant with a config override.
  test_requirements:
  - Unit test that a stage-1 response with stop_reason:max_tokens raises StageTruncationError naming stage 1.
  - Unit test that a stage-2 response with stop_reason:max_tokens raises StageTruncationError naming the epic batch.
  - Unit test that a batch estimated above the ceiling is refused before the model call.
  documentation_requirements:
  - Docstring on the truncation detection function describing the failure contract.
  definition_of_done:
  - All unit tests pass in CI.
  - A fixture run with a simulated max_tokens response produces a failed PlanRun with the correct failure_reason.
  - The batch-size refusal is exercised by a unit test.
