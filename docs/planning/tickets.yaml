  - '`ReadinessResult` carries a list of `NotReadyReason` objects each with a `NotReadyCode`; `ready` is derived from the list (empty reasons → ready=True).'
  - 'The five `NotReadyCode` values cover: wrong status, depends_on ticket not done, depends_on ADR not accepted, no acceptance criteria, dangling target.'
  - '`ready_tickets(graph)` returns the set of ticket keys for which `is_ready` returns ready=True.'
