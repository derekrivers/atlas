  key: ATLAS-67
  title: Token budget and compression ladder
  objective: 'Implement the token budget estimator and compression ladder for the context renderer: estimate token count (chars/4), apply the four-rung compression sequence when over budget, and fail rendering if still over budget after all rungs.'
  context: 'The context renderer (context-renderer.md §Token budget and compression ladder) specifies a default budget of 12,000 tokens, estimated as chars/4. When over budget, compression is applied in order: (1) drop lesson bodies to titles; (2) drop related-ticket objectives to key+title; (3) trim doc sections to first paragraph plus command code blocks; (4) drop ADR consequences. If still over budget after all four rungs, rendering fails with a typed error (oversized ticket planning smell). This ticket implements the estimator and the compression ladder.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 43
  relevant_docs:
  - docs/atlas/context-renderer.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - estimate_tokens(text) returns len(text) // 4 as an integer; this value is recorded as token_estimate on the pack.
  - compress(pack_sections, budget) applies the four rungs in order until under budget or all rungs exhausted.
  - If still over budget after rung 4, a typed ContextPackOverBudgetError is raised (not silent truncation).
  - The budget is configurable (default 12000); the estimator is monotonic (more text → higher estimate).
  - 'Unit tests cover: under-budget pack (no compression), each rung applied individually, all-rungs-exhausted failure.'
  non_goals:
  - LLM-assisted summarisation — deferred per context-renderer.md open items.
  - Context pack assembly — this ticket delivers the estimator and compression functions only.
  - Changing the chars/4 estimator formula — precision is not required, monotonicity is.
  implementation_notes:
  - Compression rungs are applied sequentially; stop as soon as under budget.
  - 'Rung 3 (trim doc sections): keep the first paragraph (up to the first blank line) plus any fenced code blocks containing shell commands.'
  - ContextPackOverBudgetError should carry the estimated token count and the budget for diagnostics.
  test_requirements:
  - 'Unit test: pack under budget → returned unchanged, token_estimate correct.'
  - 'Unit test: pack over budget by lesson bodies → rung 1 applied, now under budget.'
  - 'Unit test: pack requiring all four rungs → still over budget → ContextPackOverBudgetError raised.'
  - 'Unit test: estimate_tokens is monotonic (longer text → higher estimate).'
  documentation_requirements: []
  definition_of_done:
  - estimate_tokens and compress implemented in atlas.context; all unit tests pass; CI green.
  estimated_effort: null
