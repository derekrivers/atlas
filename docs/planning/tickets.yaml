  key: ATLAS-18
  title: Versioned planner prompt renderer with Jinja2 and prompt-hash recording
  objective: Implement the versioned prompt template system that renders the planner prompt from a Jinja2 template with StrictUndefined, validates front-matter variables, and records the prompt hash for PlanRun provenance.
  context: ADR-0007 requires that prompt templates are versioned artifacts referenced by PlanRun. The planning engine specification §2.1 requires the planner prompt to contain the documents, the current backlog, and the output schema. The prompt hash must be recorded so the chain input_doc_shas → prompt_hash → raw_output_hash → proposal → renders is legible. Templates live in atlas/planning/prompts/ and the renderer must default to the current release version.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 90
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  - docs/decisions/0010-multi-call-generation-with-single-proposal-reconciliation.md
  acceptance_criteria:
  - Templates are stored under atlas/planning/prompts/ with a version identifier in the filename or front matter.
  - The renderer uses Jinja2 with StrictUndefined so any missing variable raises an error rather than rendering empty.
  - Front-matter variable validation runs before rendering and raises a typed error on missing required variables.
  - The rendered prompt string is hashed (SHA-256) and the hash is returned alongside the rendered text.
  - The renderer accepts a version parameter and defaults to the current release version.
  - 'Unit tests cover: StrictUndefined raising on missing variable, front-matter validation failure, hash stability for identical inputs.'
  non_goals:
