- id: 615db218-f458-4b5f-bbf5-fd3f650b78c8
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 5a486514-1761-45a8-8094-9a0e8282c3d4
  key: ATLAS-101
  title: Lesson retrieval integration with Context Renderer (ACTIVE only)
  objective: Wire the lesson retrieval step into the Context Renderer so that only ACTIVE lessons are included in context packs, matched by tag and ticket_type intersection, ranked by confidence then recency, capped at 3.
  context: 'The Context Renderer (Phase 5, context-renderer.md) specifies lesson retrieval as retrieval rule 4: `status: ACTIVE` only (ADR-0009), matched by tag intersection with the ticket''s tags and ticket_type, ranked by confidence then recency, cap 3. The compression ladder also specifies that lesson bodies are dropped to titles before other compression steps. This ticket implements the retrieval query and its integration into the pack assembly, ensuring the DRAFT gate is enforced at the retrieval layer and that no DRAFT lesson ever appears in a rendered pack.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 98
  relevant_docs:
  - docs/atlas/learning-system.md
  - docs/atlas/context-renderer.md
  - docs/decisions/0009-single-operator-governance.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - 'The lesson retrieval query filters strictly on `status: ACTIVE`; DRAFT and ARCHIVED lessons are never returned.'
  - Lessons are matched by tag intersection with the ticket's tags and ticket_type; a lesson with no overlapping tags is not returned.
  - Results are ranked by confidence (descending) then recency (descending); ties broken by recency.
  - At most 3 lessons are included in any context pack.
  - When a ticket whose pack included lesson L completes successfully, L's `related_ticket_ids` gains the ticket key (citation feedback).
  - The context pack validation (`atlas context validate <KEY>`) rejects any pack containing a DRAFT lesson.
  - The compression ladder drops lesson bodies to titles before other compression steps when the pack is over budget.
  non_goals:
  - Embedding-based or vector-search lesson retrieval — deferred per learning-system.md open items.
  - Component-tag taxonomy formalisation — seed manually, revisit after Phase 9 produces enough lessons.
  - Automatic confidence decay.
  - Lesson promotion (separate ticket).
  - Lesson extraction (separate ticket).
  implementation_notes:
  - The retrieval function lives in `atlas/context/` (below `atlas.planning` in the layer spine); it must not import from `atlas.planning`.
  - Tag intersection is a set operation on the ticket's tags list and the lesson's tags list.
  - Citation feedback is triggered by the PM Engine's status-transition path when a ticket moves to `done` and its last rendered pack is known.
  - The compression ladder step (drop lesson bodies to titles) is implemented in the existing compression module.
  test_requirements:
  - 'Unit test: retrieval query returns only ACTIVE lessons for a fixture ticket with matching tags.'
  - 'Unit test: DRAFT and ARCHIVED lessons are excluded even when tags match.'
  - 'Unit test: ranking is by confidence descending then recency descending.'
  - 'Unit test: cap of 3 is enforced; a fixture with 5 matching ACTIVE lessons returns exactly 3.'
  - 'Unit test: citation feedback — completing a ticket updates related_ticket_ids on the included lessons.'
  - 'Integration test: a rendered pack for a fixture ticket with ACTIVE lessons includes them; a pack for a ticket with only DRAFT lessons includes none.'
  - 'Integration test: `atlas context validate <KEY>` fails on a pack that somehow contains a DRAFT lesson.'
  documentation_requirements:
  - Docstrings on the lesson retrieval function.
  - Update context-renderer.md retrieval rules section if implementation differs from the design.
  definition_of_done:
  - Retrieval query enforces ACTIVE-only filter, tag matching, ranking, and cap in all tests.
  - Citation feedback is recorded on successful ticket completion.
  - Pack validation rejects DRAFT lessons.
  - All tests pass in CI.
  estimated_effort: null
