- id: 8b5da8c0-11ce-4613-b973-9d757d6d918e
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 5bd967eb-98c0-42a6-bec3-042a34145078
  key: ATLAS-20
  title: 'Deterministic reconciler: key/anchor/similarity matching and diff generation'
  objective: Implement the pure deterministic reconciler that matches a validated proposal against the current backlog using key, anchor, and similarity passes, and produces a typed Plan Diff with ADD, MODIFY, PROPOSE_ARCHIVE, and CONFLICT entries.
  context: 'ADR-0007 and planning engine specification §4 define the reconciler. Matching passes in order: (1) key match, (2) anchor match (1:1 unambiguous), (3) similarity match using Sørensen–Dice ≥ DEFAULT_SIMILARITY_THRESHOLD=0.85 over casefold token sets of title+objective. Unmatched proposal items become ADD; unmatched existing items become PROPOSE_ARCHIVE. Duplicate echoed keys are CONFLICT. Tickets with status in_progress, pr_open, review_required, changes_requested, done, or rejected are frozen; any MODIFY or PROPOSE_ARCHIVE touching them becomes CONFLICT. Dependency edges reconcile by resolved (source, target) identity. The reconciler is pure code with no model calls.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 80
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  acceptance_criteria:
  - Key match pass correctly identifies proposal items echoing existing backlog keys.
  - Anchor match pass correctly identifies unambiguous 1:1 (anchor, entity_type) pairs; ambiguous groups fall through to similarity.
  - Similarity match uses Sørensen–Dice over casefold token sets; two empty sets score 1.0; threshold is a per-run parameter defaulting to 0.85.
  - Unmatched proposal items produce ADD entries; unmatched existing items produce PROPOSE_ARCHIVE entries.
  - Duplicate echoed keys produce CONFLICT entries naming every claimant.
  - Any MODIFY or PROPOSE_ARCHIVE touching a frozen ticket (in_progress, pr_open, review_required, changes_requested, done, rejected) produces a CONFLICT entry.
  - Dependency edges reconcile by resolved (source, target) identity with ADD/MODIFY/PROPOSE_ARCHIVE/CONFLICT entries following the same immutability rule.
  non_goals:
  - Do not implement key assignment (that is the key authority ticket).
  - Do not implement PlanRun persistence.
  - Do not implement the diff presentation/display (that is the atlas plan CLI ticket).
  - Do not implement similarity matching for dependency edges (edges reconcile by identity only).
  implementation_notes:
  - The Sørensen–Dice implementation must be the single implementation reused by AT-7 content coverage (ATLAS-123/124).
  - 'Normalisation: casefold, replace non-alphanumeric with space, whitespace-split into token set.'
  - Greedy similarity assignment by descending score under a total deterministic order; exact score ties competing for the same item are CONFLICT.
  - The reconciler takes the current backlog as a list of existing entities and the validated Proposal as inputs; it has no I/O.
  test_requirements:
  - 'Unit test for each matching pass with fixtures covering: exact key match, anchor match, similarity match above and below threshold.'
  - Unit test that a frozen ticket touched by MODIFY produces CONFLICT.
  - Unit test that duplicate echoed keys produce CONFLICT naming all claimants.
  - Unit test that the similarity threshold parameter is respected.
  - Unit test for dependency edge reconciliation including frozen-source CONFLICT.
  documentation_requirements:
  - Docstring on the reconcile() function describing the matching pass order, threshold semantics, and immutability rule.
  definition_of_done:
  - All unit tests pass in CI.
  - A fixture reconciliation with known matches and conflicts produces the expected typed diff.
  - The similarity function is importable as a standalone utility.
  estimated_effort: null
