  objective: Implement `atlas lessons playbook <tag>` that drafts a playbook from ACTIVE lessons under a tag into `docs/atlas/playbooks/<tag>.md` as a PR branch for operator review and merge.
  context: 'learning-system.md specifies: `atlas lessons playbook <tag>` drafts a playbook from the ACTIVE lessons under a tag into `docs/atlas/playbooks/<tag>.md` as a PR branch, which the operator reviews and merges. Merged playbooks are canonical docs: the planner and context renderer pick them up through normal doc ingestion, closing the loop Docs → Delivery → Lessons → Docs. ADR-0006 requires that knowledge reaching canonical documents does so only via PR — never direct writes. The playbook is generated by an LLM call over the ACTIVE lessons for the tag; the operator reviews and merges.'
  status: done
  ticket_type: feature
  risk_level: medium
