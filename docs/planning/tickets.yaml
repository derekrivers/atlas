  - Unit test confirms Lesson.for_agent() sets created_by_type=agent and status=draft.
  - Unit test confirms confidence=None is valid, confidence=0.5 is valid, confidence=1.1 raises ValidationError.
  - Unit test confirms the model is importable from atlas.core without importing higher-layer modules.
