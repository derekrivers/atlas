  - The preflight check (C6) is documented in bootstrap-guide.md#codex-model-requirement-preflight-c6; implement atlas preflight --check-model if not already present.
  - The prompt body template uses Jinja2 variables (issue.identifier, issue.title, issue.state, attempt, issue.description); verify these are correct against the Symphony spec.
  test_requirements:
  - 'Unit test: WORKFLOW.md YAML parses without error and required front-matter keys (tracker.kind, tracker.project_slug, active_states, terminal_states, codex.command) are present.'
  - 'Unit test: active_states and terminal_states contain exactly the values specified in symphony-integration.md state-mapping table.'
