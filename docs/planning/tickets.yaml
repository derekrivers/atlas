  context: 'The Phase 3 milestone test is: readiness, blockers, and critical path computed correctly on fixture graphs including cycle and dangling-target failures. These tests exercise the full stack from graph build through validation through analysis, using fixture data that covers the key correctness properties. They are the falsifiable acceptance gate for the Dependency Graph epic and must pass in CI.'
