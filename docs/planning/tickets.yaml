  key: ATLAS-88
  title: PR-level verification aggregation
  objective: Implement verify(PR) that aggregates per-ticket verdicts for all tickets a PR closes, returning PASSED only when every closed ticket is PASSED, with the same fold rule as ticket-level verdict composition.
  context: 'A PR may close multiple tickets. PR completion is verified by composing the per-ticket verdicts: PASSED only when every closed ticket is PASSED, FAILED if any closed ticket is FAILED, otherwise PENDING. An empty close-set is PENDING (never a vacuous PASS). Each closed ticket is evaluated independently at the PR head commit. The set of closed tickets is an input (resolved by the CLI from the PR title/body), not something the aggregator resolves.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 65
  relevant_docs:
  - docs/atlas/verification-engine.md
  acceptance_criteria:
  - evaluate_pr(tickets, head_commit, evidence_by_ticket) calls verify(ticket) for each ticket in the closed set and folds the results using the same FAILED > PENDING > PASSED precedence.
  - An empty tickets list returns PENDING (never PASSED).
  - Each ticket is evaluated independently — evidence scoped to one ticket does not satisfy another.
  - The PRVerification result carries the overall verdict and a per-ticket breakdown.
  - 'Unit tests cover: all tickets PASSED, one ticket FAILED, mixed PENDING/PASSED, empty ticket set.'
  non_goals:
  - Resolving which tickets a PR closes from GitHub — that is the CLI's responsibility.
  - Persisting VerificationCheck records.
  - Making GitHub API calls inside the aggregator.
  implementation_notes:
  - Implement in atlas/verification/verdict.py alongside the ticket-level function.
  - PRVerification is a Pydantic model carrying pr_verdict (EvidenceStatus), ticket_verdicts (list of TicketVerification), and head_commit.
  test_requirements:
  - 'Unit test: single ticket PASSED → PR PASSED.'
  - 'Unit test: one of two tickets FAILED → PR FAILED.'
  - 'Unit test: one ticket PENDING, one PASSED → PR PENDING.'
  - 'Unit test: empty ticket list → PR PENDING.'
  - 'Unit test: evidence for ticket A does not satisfy ticket B''s checks.'
  documentation_requirements: []
  definition_of_done:
  - evaluate_pr implemented and type-annotated.
  - Empty-set PENDING behaviour verified in tests.
  - All unit tests pass in CI.
  estimated_effort: null
