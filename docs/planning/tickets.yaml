  acceptance_criteria:
  - WORKFLOW.md front matter contains correct tracker.project_slug, active_states ([Ready for Agent, In Progress, PR Open, Changes Requested]), and terminal_states ([Done, Canceled, Duplicate]).
  - 'The codex.command in WORKFLOW.md pins model=gpt-5.5 and sets approval_policy: never and thread_sandbox: workspace-write.'
  - The prompt body instructs the agent to read the ATLAS CONTEXT PACK v1 block from the issue description and treat it as binding.
  - 'The prompt body specifies the correct state-transition sequence: Ready for Agent → In Progress → PR Open → Review Required, with Changes Requested resuming in the same workspace.'
  - 'The prompt body includes the hard limits: never mark own work Done, move to Needs Human on blockers, never author tickets directly.'
