  key: ATLAS-91
  title: 'Phase 7 milestone test: no system-tier evidence blocks completion'
  objective: Implement the Phase 7 milestone acceptance test verifying that a ticket with passing agent-claimed evidence but no system-tier evidence cannot reach done, and that the same ticket completes once CI evidence lands for the head commit.
  context: 'The roadmap milestone test for Phase 7 is: ''a ticket with passing agent-claimed evidence but no system-tier evidence cannot reach done; the same ticket completes once CI evidence lands for the head commit.'' This test must be automated and run in CI to prove the ''no evidence = no completion'' rule is enforced end-to-end by the Verification Engine.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 50
  relevant_docs:
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/verification-engine.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A test fixture creates a ticket with agent-tier PASSED evidence for TESTS, LINT, and BUILD check types at a given head commit.
  - Running verify(ticket, head_commit, evidence) with only agent-tier evidence returns a verdict that is not PASSED (PENDING or FAILED) for the machine checks.
  - Adding system-tier PASSED evidence for the same checks at the same head commit causes verify(ticket, head_commit, evidence) to return PASSED for those checks.
  - The test is automated and runs in CI without network access (all evidence is fixture data).
  - The test is named and documented as the Phase 7 milestone test.
  non_goals:
  - Testing the CLI end-to-end with a real GitHub PR — the milestone test uses fixture data.
  - Testing every evaluator in detail — those are covered by the individual evaluator tickets.
  - Testing the PM Engine's response to the verdict.
  implementation_notes:
  - Use a fixture ticket of type 'bug' (requires tests, lint, acceptance_criteria, scope) to keep the required check set small.
  - Satisfy acceptance_criteria and scope checks with appropriate fixture evidence so the milestone test isolates the system-tier vs agent-tier distinction.
  - The test must not make network calls.
  test_requirements:
  - 'Test: agent-tier PASSED evidence only → machine checks return PENDING, overall verdict not PASSED.'
  - 'Test: system-tier PASSED evidence added → machine checks return PASSED, overall verdict PASSED (assuming other required checks are satisfied or not required for the fixture ticket type).'
  - Test is in tests/verification/test_milestone.py or equivalent, clearly labelled.
  documentation_requirements:
  - A comment in the test file explaining it is the Phase 7 milestone acceptance test and what it proves.
  definition_of_done:
  - Milestone test implemented and passing in CI.
  - Test clearly demonstrates agent-tier evidence alone is insufficient.
  - Test clearly demonstrates system-tier evidence satisfies the machine checks.
  - No network calls in the test.
