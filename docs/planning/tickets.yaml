  key: ATLAS-81
  title: Verification rules and required-check matrix
  objective: Define and implement the required-check matrix that maps ticket_type to the set of VerificationCheckTypes that must pass, and provide the rule resolver that returns the required checks for a given ticket.
  context: The Verification Engine's first responsibility is knowing which checks are required for each ticket type. The required-check matrix (feature, bug, tech_debt, infrastructure, documentation, spike/research) is defined in verification-engine.md and must be implemented as configuration (YAML in repo) plus a Python resolver. The SECURITY check is surfaced as non-gating (required=False) for critical risk tickets. This is the foundation all evaluators depend on.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 100
  relevant_docs:
  - docs/atlas/verification-engine.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - A YAML configuration file in the repository defines the required-check matrix matching the table in verification-engine.md (feature, bug, tech_debt, infrastructure, documentation, spike/research rows; tests, lint, acceptance_criteria, documentation, scope, human_approval columns).
  - A Python resolver function `required_checks(ticket_type, risk_level, has_documentation_requirements) -> list[VerificationCheckType]` returns the correct required checks for each combination, including the documentation_requirements conditional.
  - The SECURITY check is returned as a non-gating entry (required=False) for any ticket with risk_level == critical.
