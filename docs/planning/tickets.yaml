- id: 36dece7d-d533-42ae-85ec-ef1cf940aa40
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-51
  title: Out-of-ownership transition logging (ATLAS-118)
  objective: 'Implement the out-of-ownership transition logging pass woven into sync_tick''s pull step: when status_from_issue returns None (an unmapped Linear state), append one OUT_OF_OWNERSHIP_TRANSITION DebtItem per transition, deduped by Ticket.last_observed_linear_state_id so a persistent unmapped state logs one row, not one per tick.'
  context: 'Step 1 of the sync loop logs anomalies when a Linear state does not follow the ownership table (status_from_issue returns None). The dedup key is Ticket.last_observed_linear_state_id: the row fires only when the observed state id changes into an out-of-ownership state. A re-occurrence (unmapped→mapped→unmapped) is a genuine new transition and logs again. This is the first writer of the DebtItem model. It never changes ticket state.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 80
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/decisions/0011-debtitem-denotes-delivery-anomalies.md
  acceptance_criteria:
  - When status_from_issue returns None for a ticket, one OUT_OF_OWNERSHIP_TRANSITION DebtItem is appended if the observed Linear state id differs from Ticket.last_observed_linear_state_id.
  - Ticket.last_observed_linear_state_id is updated to the current state id after the dedup check, regardless of whether a row was appended.
  - A persistent unmapped state across multiple ticks produces exactly one DebtItem row (dedup by state id change).
  - A re-occurrence (unmapped→mapped→unmapped) produces a second DebtItem row (genuine new transition).
  - The logging pass never calls set_state or changes any ticket status.
  - The anomaly count is included in SyncResult.
  non_goals:
  - Automatically routing tickets with out-of-ownership transitions to a different status.
  - Recurrence-based escalation (recurrence is a query-time predicate in DebtItemRepo, not a creation gate).
  - Dwell or review-cycle anomaly logging (separate tickets).
  implementation_notes:
  - last_observed_linear_state_id is a new nullable string column on the Ticket model; add via Alembic migration.
  - The dedup check and the update of last_observed_linear_state_id must be in the same transaction as the DebtItem insert.
  - Woven into sync_tick's pull step, not a separate pass.
  test_requirements:
  - 'Unit test: an unmapped state id on first observation appends one OUT_OF_OWNERSHIP_TRANSITION row and updates last_observed_linear_state_id.'
  - 'Unit test: the same unmapped state id on a second tick produces no additional row.'
  - 'Unit test: unmapped→mapped→unmapped produces two rows total.'
  - 'Unit test: the logging pass makes no set_state calls.'
  - 'Unit test: SyncResult anomaly count reflects the number of rows appended this tick.'
  documentation_requirements:
  - Docstring on the logging logic documenting the dedup mechanism and the last_observed_linear_state_id field.
  definition_of_done:
  - Alembic migration for last_observed_linear_state_id applies and rolls back cleanly.
  - All unit tests pass in CI.
  - No set_state call reachable from the logging pass.
  estimated_effort: null
