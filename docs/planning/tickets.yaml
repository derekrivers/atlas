  - Normalise paths by stripping leading slash and lowercasing before comparison.
  - The evaluator receives the PR file list, the ticket model, and the relevant evidence records as inputs — no GitHub API calls inside the evaluator.
  test_requirements:
  - 'Unit test: all changed files in scope → PASSED.'
  - 'Unit test: out-of-scope file with waive decision → PASSED.'
  - 'Unit test: out-of-scope file with fail decision → FAILED.'
  - 'Unit test: out-of-scope file with no decision → PENDING.'
  - 'Unit test: multiple decisions for same file → latest by (created_at, id) wins.'
  - 'Unit test: non-human MANUAL_APPROVAL with scope_decision_path → ignored.'
  documentation_requirements: []
  definition_of_done:
  - Scope evaluator implemented and type-annotated.
  - In-scope derivation from relevant_docs and source_anchor path verified in tests.
  - All unit tests pass in CI.
  - PASSED, FAILED, and PENDING cases all covered.
