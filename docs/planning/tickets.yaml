  key: ATLAS-108
  title: Evidence CLI cold-database precondition handling (ATLAS-130)
  objective: Ensure that atlas evidence pull, list, and show all map a missing-schema OperationalError to EXIT_PRECONDITION with a human-readable message and no traceback, so the CLI operates cleanly against a cold or never-migrated database.
  context: 'The Phase 6 closure report identified ATLAS-130 as a live-discovered fix: the evidence CLI was tracebacking on a cold database instead of exiting cleanly. This ticket encodes that fix as a discrete deliverable. It is closely related to ATLAS-80 (the CLI implementation) but is called out separately in the roadmap as a named fix, ensuring it is not lost in the broader CLI ticket.'
  status: rejected
  ticket_type: bug
  risk_level: low
  priority: 35
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - '''atlas evidence pull'' on a cold database exits with a non-zero EXIT_PRECONDITION code and prints a human-readable message naming the missing schema.'
  - '''atlas evidence list KEY'' on a cold database exits with EXIT_PRECONDITION and no traceback.'
  - '''atlas evidence show ID'' on a cold database exits with EXIT_PRECONDITION and no traceback.'
  - The exit code for EXIT_PRECONDITION is distinct from a runtime error exit code.
  - Unit tests for each of the three subcommands confirm the cold-database path.
