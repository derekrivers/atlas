  key: ATLAS-53
  title: Review-cycling detection and Needs Human routing (ATLAS-120)
  objective: 'Implement the review-cycling detection pass (step 5 of the sync loop): when a ticket''s review_cycle_count exceeds 3 while in changes_requested or pr_open, route it to needs_human_decision via LinearClient.set_state and append one REVIEW_CYCLE DebtItem, deduped per pr_open episode.'
  context: Review cycling is the one anomaly that changes ticket state. The round-trip count is tracked on Ticket.review_cycle_count, incremented by apply_linear_status only on changes_requested→pr_open transitions. The routing uses the same sanctioned set_state path as readiness promotion, resolved via state_id_for(needs_human_decision). The REVIEW_CYCLE DebtItem is a deterministic failure-analysis summary (no model call, no Linear comment). Dedup is per pr_open episode via status_entered_at. The write is Linear-only; the next pull reconciles Atlas status.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 72
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/symphony-integration.md
  acceptance_criteria:
  - _detect_review_cycle routes a ticket to needs_human_decision via set_state when review_cycle_count > 3 and the ticket is in changes_requested or pr_open.
  - One REVIEW_CYCLE DebtItem is appended per pr_open episode (deduped by status_entered_at boundary).
  - The routing uses state_id_for(needs_human_decision), validated at load (exactly one state must map to needs_human_decision).
  - The write is Linear-only; Atlas status is reconciled by the next pull tick.
  - 'The write is idempotent: a ticket already routed to needs_human_decision is not re-routed.'
  - review_cycle_count is monotonic in v1 (no reset on human intervention).
  non_goals:
  - Resetting review_cycle_count on human intervention (monotonic in v1).
  - LLM-generated failure analysis or Linear comments (the DebtItem is the deterministic summary).
  - Dwell or out-of-ownership anomaly logging (separate tickets).
  - Intra-ticket retry orchestration (Symphony's responsibility).
  implementation_notes:
  - state_id_for(needs_human_decision) uses the same inverted status map as state_id_for(ready_for_agent); validate both at scheduler startup.
  - The REVIEW_CYCLE DebtItem detail field carries a human-readable summary of the cycle count and ticket key.
  - The route runs first, then the DebtItem is appended (so the row is written even if set_state fails, for observability).
  test_requirements:
  - 'Unit test: a ticket with review_cycle_count=4 in pr_open triggers set_state to needs_human_decision and appends one REVIEW_CYCLE DebtItem.'
  - 'Unit test: a ticket with review_cycle_count=3 (not exceeding threshold) is not routed.'
  - 'Unit test: calling _detect_review_cycle twice in the same pr_open episode produces exactly one DebtItem.'
  - 'Unit test: a ticket already in needs_human_decision is not re-routed (idempotency).'
  - 'Unit test: load-time validation raises if zero or multiple states map to needs_human_decision.'
  documentation_requirements:
  - Docstring on _detect_review_cycle documenting that it is the one anomaly that changes ticket state.
  definition_of_done:
  - All unit tests pass in CI.
  - Load-time validation of needs_human_decision state is tested.
  - REVIEW_CYCLE items visible in atlas pm report output.
