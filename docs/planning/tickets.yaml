  key: ATLAS-43
  title: Install import-linter layers contract enforcing the atlas layer spine
  objective: Add an import-linter `layers` contract to `pyproject.toml` that mechanically enforces the canonical layer spine defined in ARCHITECTURE.md, wire it into pre-commit and CI, and confirm it catches a known inverted edge so architectural regressions are detected automatically on every PR.
  context: ARCHITECTURE.md defines a canonical layer spine for the `atlas` package (cli → planning → pm → context → dependencies → evidence → storage → linear → github → core). The architecture document explicitly states that an import-linter `layers` contract in `pyproject.toml` enforces this in pre-commit and CI. Without this enforcement, inverted edges (such as the dependencies→planning inversion fixed in the preceding ticket) can silently re-appear. This ticket installs the first architecture-fitness sensor for the atlas package, implementing Phase 3.5's mechanical guard.
  status: done
  ticket_type: infrastructure
  risk_level: medium
  priority: 9
  relevant_docs:
  - ARCHITECTURE.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - '`import-linter` is added as a dev dependency (`uv add --dev import-linter`) and appears in `pyproject.toml` and `uv.lock`.'
  - A `[tool.importlinter]` section in `pyproject.toml` defines a `layers` contract listing the canonical layer order from ARCHITECTURE.md (cli, planning, pm, context, dependencies, evidence, storage, linear, github, core), with `atlas.tools` and `atlas.__main__` excluded as unconstrained consumers.
  - Running `lint-imports` (or `uv run lint-imports`) on the clean codebase exits 0.
  - A test or CI step demonstrates that introducing a synthetic inverted import (e.g. a temporary `from atlas.planning import ...` inside `atlas/dependencies/`) causes `lint-imports` to exit non-zero.
  - The `lint-imports` check is added to the CI workflow (`.github/workflows/ci.yml`) so it runs on every PR.
  - The `lint-imports` check is added to `.pre-commit-config.yaml` so it runs locally before commit.
