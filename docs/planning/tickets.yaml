  key: ATLAS-152
  title: 'Retire-on-reject scope: a rejected apply must not retire hand-authored inbox stubs'
  objective: Narrow the inbox stub retirement trigger so that a rejected apply leaves the inbox exactly as it found it; only an applied run retires the stubs that fed it.
  context: 'ATLAS-122 (D2) retires inbox stubs to processed/ on both the applied and the rejected outcome. The 2026-07-08 double-emission created a second decline reason: a diff declined for duplicate ADDs whose stub content is still wanted. Under the current scope, that decline retires every hand-authored stub that fed the run, forcing a manual restore before the re-roll. A reject is a verdict on the diff, not on the stubs: an operator who genuinely declines a stub''s content deletes the stub (a git-visible act) rather than having apply infer it. This is a bug fix in atlas apply''s retirement logic.'
  status: needs_human_decision
  ticket_type: bug
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/planning/inbox/inbox-stub-retire-on-reject-scope.md
  acceptance_criteria:
  - 'A rejected apply run moves no inbox stub: fixture with committed stubs, confirm callback returning REJECTED — every stub is still at its original inbox/ path afterwards.'
  - 'The applied outcome is byte-identical to today: stubs retire to processed/ exactly as ATLAS-122 specified, idempotence preserved (missing source or existing target is a skip, not an error).'
  - The rejected PlanRun itself is otherwise unchanged (status, provenance, renders untouched) — the fix narrows the retirement trigger only.
  - The planning spec's apply-lifecycle text and the _retire_inbox_stubs docstring both state the new rule and its rationale in the same change.
  non_goals:
  - No change to applied-path retirement, the processed/ namespace, or idempotence semantics.
  - No un-retire tooling or recovery path for past runs.
  - No new stub lifecycle states.
  implementation_notes:
  - 'The fix is a one-line condition change in _retire_inbox_stubs: call it only when the PlanRun outcome is applied, not rejected.'
  - The planning spec's §2.2 apply-lifecycle section must document the narrowed rule in the same change.
  test_requirements:
  - Apply-level unit tests over tmp-path repo fixtures with a scripted confirm callback (no planner calls, ATLAS_LIVE_TESTS=0).
  - The rejected-outcome fixture is the named regression test.
  - Test that the applied-outcome fixture still retires stubs to processed/ (no regression).
  documentation_requirements:
  - Update planning-engine-specification.md §2.2 to state that stub retirement occurs only on the applied outcome, with the rationale (reject judges the diff, deleting a stub judges its content).
  definition_of_done:
  - All acceptance criteria evidenced by named tests.
  - Full CI gate sweep green.
  - The planning spec's apply section documents the narrowed retirement rule.
  estimated_effort: null
