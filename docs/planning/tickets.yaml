  - 'LessonStatus enum exists in atlas.core.enums with values: draft, active, archived.'
  - The Lesson model's default status is draft.
  - A class method or factory Lesson.for_agent(...) creates a Lesson with created_by_type=agent and status=draft, making the DRAFT default explicit for the agent-authored path.
  - confidence field validates that when not None, the value is in [0.0, 1.0].
  - Lesson model is importable from atlas.core with no circular imports.
