  - 'Integration test: `atlas lessons playbook <tag>` against fixture lessons produces a Markdown file on a new branch.'
  - Test that the provenance section lists the contributing lesson IDs.
  documentation_requirements:
  - CLI help text for `atlas lessons playbook`.
  - Update learning-system.md playbooks section if implementation differs.
  definition_of_done:
