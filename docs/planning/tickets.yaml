  - 'Unit test: blanket MANUAL_APPROVAL (no criterion hash) present → still PENDING for unconfirmed criteria.'
  - 'Unit test: confirmation exists for a different commit → not counted.'
  - 'Unit test: criterion text rewording changes hash → old confirmation no longer matches.'
