  key: ATLAS-73
  title: Test evidence mapping (CI job-name-driven evidence typing)
  objective: Implement the normaliser that maps GitHub workflow-run and check-run payloads to TEST_RESULT Evidence records, driven by the job-name prefix convention, and writes them as system-tier append-only records pinned to the PR head commit SHA.
  context: 'evidence-pipeline.md specifies that evidence typing is driven by CI job names: jobs prefixed ''test'' map to TEST_RESULT, ''lint'' to LINT_RESULT, ''build'' to BUILD_RESULT, ''coverage'' to COVERAGE_REPORT. Unrecognised jobs are ingested as BUILD_RESULT with a warning. This ticket covers the test prefix mapping and the shared normalisation infrastructure (status normalisation table, payload_hash computation, dedup key logic) that the build/lint/coverage mapper ticket will reuse. The normaliser sits in atlas.evidence and calls EvidenceRepo.add.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 80
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A normalise_workflow_run(payload, ticket_key) function in atlas/evidence/normaliser.py maps a workflow-run DTO to an Evidence record with evidence_type=TEST_RESULT when the job name starts with 'test' (case-insensitive prefix match).
  - 'GitHub conclusion values are mapped to EvidenceStatus per the table in evidence-pipeline.md: success→PASSED, failure→FAILED, cancelled/stale→WARNING, timed_out→FAILED, skipped/neutral→NOT_APPLICABLE, in-progress→PENDING.'
  - payload_hash is computed as SHA-256 of the canonical JSON serialisation of the raw payload dict; commit_sha is taken from the workflow run's head_sha field; external_run_id is the workflow run's id as a string.
  - 'Dedup logic: if a record with the same (external_run_id, payload_hash) already exists in EvidenceRepo, the normaliser skips insertion and returns None rather than raising.'
  - Unrecognised job name prefixes are ingested as BUILD_RESULT with a structured warning logged (not raised) and the original job name preserved in raw_payload.
  - 'Unit tests cover: test-prefixed job → TEST_RESULT; each GitHub conclusion → correct EvidenceStatus; dedup skip on identical (external_run_id, payload_hash); unrecognised prefix → BUILD_RESULT with warning.'
  non_goals:
  - Mapping lint, build, or coverage job prefixes — those are covered in the next ticket.
  - Implementing the polling scheduler or CLI — those are separate tickets.
  - PR review evidence ingestion — that is a separate ticket.
  - Documentation evidence ingestion — that is a separate ticket.
  implementation_notes:
  - The status normalisation table should be a module-level dict in atlas/evidence/normaliser.py so it is the single implementation reused by all mapper functions.
  - payload_hash must be computed before any field is stripped or transformed, over the raw payload as received from the GitHub client.
  - The normaliser must not import from atlas.github directly; it receives DTOs or dicts as arguments, keeping the dependency direction correct.
  test_requirements:
  - Unit tests for normalise_workflow_run covering all conclusion values and job-name prefix cases.
  - 'Integration test: normaliser called with a fake EvidenceRepo confirms a new record is inserted on first call and skipped on second call with identical payload.'
  documentation_requirements:
  - Docstring on normalise_workflow_run documenting the job-name prefix convention and the status mapping table.
  definition_of_done:
  - All unit and integration tests pass in CI.
  - Status normalisation table matches evidence-pipeline.md exactly.
  - Dedup logic confirmed by test.
  estimated_effort: null
