  key: ATLAS-151
  title: 'Promotion dedup: collapse model re-emission of committed inbox stubs (F-4)'
  objective: During reconciliation, collapse a model-emitted proposal ticket whose source_anchor matches a promotion-injected ticket's anchor into the promotion ticket, so one stub always yields exactly one ticket ADD regardless of what the model re-emits.
  context: 'Two live reproductions confirmed the root cause: promote_inbox_stubs injects a ticket per stub while the model, seeing the stubs in its corpus, independently emits tickets for the same work; the reconciler treats them as distinct ADDs. The 2026-07-08 double-emission (E6/E8 pairs) and the applied duplicate mints ATLAS-149/150 (exact-title copies of 147/148, cancelled same day) are the named fixtures. The stub''s source_anchor is the identity key. Dependency edges the model attached to its duplicate must be re-pointed to the surviving promotion ticket. This is a bug fix in the reconciler.'
  status: needs_human_decision
  ticket_type: bug
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/planning/inbox/inbox-stub-f4-promotion-dedup.md
  acceptance_criteria:
  - During reconciliation, a model-emitted proposal ticket whose source_anchor matches a promotion-injected ticket's anchor is collapsed into the promotion ticket (deterministic content wins); the diff records one line noting the collapse and which model ticket was absorbed.
  - 'Seeded regression (the 149/150 shape): a fixture with two committed stubs and a model proposal re-emitting both yields a diff with exactly two ticket ADDs; pre-fix this fixture yields four.'
  - 'The edgeless case is covered: re-emitted duplicates in the fixture carry no dependency edges and are still collapsed.'
  - 'Negative: model tickets citing distinct anchors (or no stub anchor) are not collapsed.'
  - Dependency edges the model attached to its duplicate are re-pointed to the surviving promotion ticket, deduplicated against existing edges.
  non_goals:
  - No dedup of model-vs-model duplicates with no stub anchor (title-similarity heuristics).
  - No change to promotion content derivation or add-only semantics.
  - No change to the inbox producer (ATLAS-45) or consumer (ATLAS-122).
  implementation_notes:
  - 'The collapse runs after promotion injection and before the three-pass matching: scan the model-emitted tickets for any whose source_anchor matches a promotion-injected ticket''s anchor; remove the model ticket from the proposal and re-point its edges.'
  - The planning spec's reconciliation section must document the collapse rule in the same change.
  - Use assert 1 == 2 (ruff B011) in test stubs as the inbox stub specifies.
  test_requirements:
  - Reconciler-level unit tests with fixture proposals (no planner calls, ATLAS_LIVE_TESTS=0).
  - The two reproduction shapes (E6/E8 double-emission and 149/150 exact-title copies) are the named fixtures.
  - 'Test the edgeless case explicitly: duplicates with no dependency edges are still collapsed.'
  documentation_requirements:
  - Update the reconciliation section of planning-engine-specification.md §4 to document the collapse rule and its rationale.
  definition_of_done:
  - All acceptance criteria evidenced by named tests.
  - Full CI gate sweep green.
  - The planning spec's reconciliation section documents the collapse rule.
  estimated_effort: null
