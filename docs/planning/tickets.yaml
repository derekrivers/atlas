- id: 416acf30-0fc0-426c-b96f-ea58fff5e5f2
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: aa0a9535-cf03-4a01-a6d3-313520606d0d
  key: ATLAS-4
  title: 'Implement doc linter v1: ADR model validation, MANIFEST cross-links, legacy name ban, and planning-file guard'
  objective: Build a doc linter that mechanically enforces internal consistency of the Atlas document set, so that documentation drift is caught before it misleads agents or breaks anchoring.
  context: 'ADR-0003 requires a doc linter as the enforcement mechanism for the single-repository principle. ADR-0006 requires the linter to flag hand-edits to docs/planning/ outside atlas apply. The implementation roadmap (ATLAS-4) specifies four checks: ADR model validation, MANIFEST cross-links and intra-doc links, legacy v1/v2/v3 name ban, and the planning-file hand-edit guard. The Phase 0 milestone test requires the linter to pass on the whole repository and fail on a seeded bad fixture.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/bootstrap-guide.md
  - docs/atlas/implementation-roadmap.md
  - docs/decisions/0003-use-single-repository-for-harness-docs.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - 'The linter validates ADR files: each must have Status, Context, Decision, Rationale, and Consequences sections; a missing section is a linter error.'
  - 'The linter checks docs/MANIFEST.md cross-links: every file listed in MANIFEST.md exists on disk, and every broken link is reported.'
  - The linter bans legacy document names containing 'v1', 'v2', or 'v3' in active (non-archive) doc paths.
  - The linter flags any file under docs/planning/ whose git status shows it was modified outside an atlas apply run (i.e. modified but not by the apply command).
  - '`uv run python -m atlas.tools.doc_linter` exits 0 on the current repository.'
  - Running the linter against a seeded fixture with a missing ADR section exits non-zero and names the violation.
  - Running the linter against a seeded fixture with a hand-edited planning file exits non-zero and names the file.
  non_goals:
  - JSON Schema validation of doc examples against Pydantic models — that is doc linter v2 in Phase 1 (ATLAS-16).
  - Checking workflow job names against the evidence-pipeline convention — that is Phase 6.
  - Fixing the documentation drift it finds — that is a separate ticket (ATLAS-5).
  - Linting non-markdown files.
  implementation_notes:
  - Implement as atlas/tools/doc_linter.py, runnable as `python -m atlas.tools.doc_linter`.
  - The planning-file guard should compare the git index state of docs/planning/ — files modified outside atlas apply will appear as dirty in git status.
  - Keep each check as a separate function so they can be tested and extended independently.
  - The linter must be wired into CI and pre-commit in this ticket.
  test_requirements:
  - Unit tests for each check function with passing and failing fixtures.
  - A seeded bad ADR fixture (missing Rationale section) causes the linter to exit non-zero.
  - A seeded hand-edited planning file causes the linter to exit non-zero.
  - A seeded MANIFEST.md with a broken link causes the linter to exit non-zero.
  - The linter passes on the real repository in CI.
  documentation_requirements:
  - A brief docstring on the module explaining the four checks and how to run the linter.
  definition_of_done:
  - All four checks are implemented and tested.
  - The linter is wired into CI (the CI workflow runs it and fails on linter errors).
  - The linter is wired into pre-commit.
  - The linter passes on the current repository and fails on each seeded bad fixture.
  estimated_effort: null
