- id: 880da2b6-7dea-420f-b291-cb29a358afdf
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 5a486514-1761-45a8-8094-9a0e8282c3d4
  key: ATLAS-100
  title: Lesson promotion CLI with DRAFT/ACTIVE/ARCHIVED lifecycle
  objective: Implement the operator-facing `atlas lessons review` and promotion commands that move lessons through the DRAFT → ACTIVE → ARCHIVED lifecycle, enforcing the ADR-0009 gate between agent-authored lessons and context-pack retrieval.
  context: 'ADR-0009 establishes the lesson promotion gate as the single most important governance mechanism in the Learning System: agent-authored lessons must not enter context packs until the operator promotes them. The learning-system.md promotion workflow specifies: `atlas lessons review` lists DRAFTs; per lesson the operator can promote (sets ACTIVE, operator assigns confidence 0–1), edit then promote, reject (ARCHIVED), or merge into an existing lesson. Confidence is an operator judgement, not a model output. The Lesson model already carries a status field (ATLAS-13). This ticket implements the CLI surface and the state-machine transitions.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 99
  relevant_docs:
  - docs/atlas/learning-system.md
  - docs/decisions/0009-single-operator-governance.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - '`atlas lessons review` lists all DRAFT lessons with their title, source ticket, and creation timestamp.'
  - '`atlas lessons review --stale` lists ACTIVE lessons included in ≥10 context packs with zero subsequent operator re-confirmation.'
  - The operator can promote a DRAFT lesson to ACTIVE, supplying a confidence value between 0.0 and 1.0; the transition is persisted.
  - The operator can reject a DRAFT lesson, setting it to ARCHIVED; the lesson is retained for pattern detection but excluded from retrieval.
  - The operator can merge a DRAFT lesson into an existing ACTIVE lesson (the DRAFT is ARCHIVED; the target lesson's related_ticket_ids is updated).
  - Promoting a lesson to ACTIVE with a confidence outside [0.0, 1.0] is rejected with a clear error message.
  - Only ACTIVE lessons are returned by the lesson retrieval query used by the Context Renderer.
  non_goals:
  - Automatic confidence decay — explicitly deferred per learning-system.md open items.
  - Multi-user approval routing — single operator only per ADR-0009.
  - LLM-assisted lesson editing — the operator edits manually.
  - Lesson extraction (separate ticket).
  - Pattern detection (separate ticket).
  implementation_notes:
  - CLI commands live in `atlas/cli.py` under an `atlas lessons` group.
  - State transitions are enforced in a `LessonRepo` method; the CLI calls the repo, never writes the DB directly.
  - The stale-lesson query counts `related_ticket_ids` additions since last operator action as a proxy for re-confirmation; the exact staleness predicate must be documented in code.
  - Confidence is stored as a float column on the Lesson model; null until promotion.
  test_requirements:
  - 'Unit tests for each lifecycle transition: DRAFT→ACTIVE, DRAFT→ARCHIVED, ACTIVE→ARCHIVED.'
  - 'Unit test: promoting with confidence outside [0.0, 1.0] raises a typed validation error.'
  - 'Unit test: merge sets the DRAFT to ARCHIVED and updates the target lesson''s related_ticket_ids.'
  - 'Integration test: `atlas lessons review` lists only DRAFT lessons.'
  - 'Integration test: after promotion, the lesson appears in the retrieval query result; before promotion it does not.'
  - 'Integration test: `atlas lessons review --stale` returns lessons meeting the ≥10 packs / zero re-confirmation criterion.'
  documentation_requirements:
  - CLI help text for all `atlas lessons` subcommands.
  - Update learning-system.md promotion workflow section if implementation differs.
  definition_of_done:
  - All lifecycle transitions work correctly via CLI and are covered by tests.
  - Only ACTIVE lessons are retrievable by the Context Renderer (verified by retrieval unit test).
  - All tests pass in CI.
  - CLI help text is accurate and complete.
  estimated_effort: null
