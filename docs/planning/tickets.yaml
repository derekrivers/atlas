  key: ATLAS-94
  title: PR ingestion and AgentRun reconstruction from observation
  objective: Create AgentRun records by observing Linear activity, PR metadata, and CI evidence rather than by agent self-report, so every dispatched agent session is attributable to an exact context pack and commit.
  context: Per symphony-integration.md, AgentRun records are created by Atlas from observation — not by the agent reporting on itself — consistent with the evidence trust model (ADR-0008). When a ticket transitions from Ready for Agent to In Progress, Atlas infers an agent session has started. When a PR is opened, Atlas links the PR to the ticket and records the head commit. The AgentRun model (data-model §3.9) carries input_context_pack_id, pr_number, head_commit_sha, and outcome fields. The roadmap seeds this as ATLAS-84.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 80
  relevant_docs:
  - docs/atlas/symphony-integration.md
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/evidence-pipeline.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - When the PM Engine observes a ticket transition from Ready for Agent to In Progress, it creates an AgentRun record with status=started, input_context_pack_id set to the pack embedded at promotion, and started_at timestamp.
  - When the PM Engine observes a PR linked to the ticket (pr_open state), it updates the AgentRun with pr_number and head_commit_sha from the GitHub PR metadata.
  - AgentRun records are never created by agent self-report; all fields are populated from Linear state observations and GitHub PR API responses.
  - A ticket that cycles through Changes Requested back to In Progress creates a new AgentRun record (a new attempt), not an update to the prior one.
  - 'Unit tests cover: initial AgentRun creation on in_progress transition, PR linkage on pr_open transition, and new-attempt creation on changes_requested→in_progress.'
  non_goals:
  - Do not implement ticket-level failure analysis (cycle/dwell detection) — that is a separate ticket.
  - Do not implement agent metrics reporting — that is a separate ticket.
  - Do not have the agent write AgentRun records directly.
  - Do not implement AgentRun outcome finalisation here; that is driven by verification verdicts.
  implementation_notes:
  - The AgentRun model is defined in data-model §3.9 and should already exist from Phase 1 (ATLAS-15); this ticket wires the creation logic into the sync loop.
  - PR metadata (pr_number, head_commit_sha) is fetched from the GitHub API using the existing evidence poller client.
  - The attempt counter increments on each changes_requested→in_progress transition, tracked on the Ticket model or derived from the count of AgentRun records for the ticket.
  - The sync loop step that creates AgentRuns runs after the status pull (step 1) and before anomaly detection (step 5).
  test_requirements:
  - 'Unit test: sync_tick creates an AgentRun when a ticket transitions to in_progress.'
  - 'Unit test: sync_tick updates the AgentRun with pr_number and head_commit_sha when the ticket transitions to pr_open.'
  - 'Unit test: a changes_requested→in_progress transition creates a second AgentRun with attempt=2.'
  - 'Unit test: AgentRun.input_context_pack_id matches the pack_id embedded in the Linear description at promotion time.'
  documentation_requirements: []
  definition_of_done:
  - Every dispatched agent session has a corresponding AgentRun record created from observation.
  - AgentRun records carry input_context_pack_id, pr_number (once PR is opened), and head_commit_sha.
  - All unit tests pass in CI.
  - No agent self-report path exists.
