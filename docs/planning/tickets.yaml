- id: 4c2979aa-5add-400e-a638-cccd2f6d8e4e
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-56
  title: 'PM scheduler: recurring sync_tick loop with create-on-crash'
  objective: 'Implement the PM scheduler in atlas/pm/scheduler.py: a plain loop that calls sync_tick on a configurable cadence, records a TickFailure on crash and continues, supports --once for a single tick, and shuts down gracefully on SIGTERM/SIGINT after the in-flight tick completes.'
  context: 'ATLAS-50 in the roadmap. The scheduler is the recurring driver of the sync loop. It is a plain loop with an interruptible sleep between ticks (default 60s, --interval). --once runs exactly one tick and exits. Graceful shutdown: SIGTERM/SIGINT sets a shutdown flag consulted only after the in-flight tick returns. Create-on-crash: when sync_tick raises, the scheduler calls TickFailureRepo.add (if recorded_since returns False for the signature within the CRASH_DEDUP_WINDOW of 1 hour) and continues. The scheduler is exposed via atlas pm sync CLI command.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 78
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - The scheduler loop calls sync_tick on a configurable interval (default 60s, --interval flag).
  - --once runs exactly one tick and exits cleanly.
  - SIGTERM/SIGINT sets a shutdown flag; the loop exits only after the in-flight tick completes (never mid-write).
  - When sync_tick raises, the scheduler records one TickFailure (if recorded_since returns False for the signature within CRASH_DEDUP_WINDOW=1h) and continues to the next tick.
  - The scheduler is exposed as atlas pm sync [--once] [--interval N] CLI command.
  - CRASH_DEDUP_WINDOW is a module constant (default 1 hour); two distinct exception types produce separate TickFailure rows.
  non_goals:
  - Distributed job scheduling or cron integration.
  - Restarting agent sessions (Symphony's responsibility).
  - The sync_tick implementation itself (separate ticket).
  - The TickFailure model (separate ticket).
  implementation_notes:
  - Use signal.signal(SIGTERM, ...) and signal.signal(SIGINT, ...) to set the shutdown flag.
  - The interruptible sleep should use a short-poll or threading.Event.wait so SIGINT is responsive.
  - CRASH_DEDUP_WINDOW = datetime.timedelta(hours=1) as a module-level constant.
  - failure_signature = type(exc).__module__ + '.' + type(exc).__qualname__.
  test_requirements:
  - 'Unit test: --once calls sync_tick exactly once and exits.'
  - 'Unit test: a crashing sync_tick causes one TickFailure to be recorded (when not within dedup window) and the loop continues.'
  - 'Unit test: a second crash with the same signature within CRASH_DEDUP_WINDOW produces no additional TickFailure row.'
  - 'Unit test: SIGTERM after tick start does not interrupt the in-flight tick; the loop exits after it completes.'
  - 'Unit test: the --interval flag is respected (mock sleep).'
  documentation_requirements:
  - Docstring on the scheduler loop documenting graceful shutdown and create-on-crash behaviour.
  - CLI help text for atlas pm sync documenting --once and --interval.
  definition_of_done:
  - All unit tests pass in CI.
  - atlas pm sync --once runs a single tick and exits with code 0 on success.
  - Graceful shutdown tested (SIGTERM after tick start).
  estimated_effort: null
