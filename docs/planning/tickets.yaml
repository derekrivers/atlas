  key: ATLAS-21
  title: 'Key authority: monotonic key counter and assignment on apply only'
  objective: Implement the key authority that assigns monotonic ATLAS-n keys to tickets and ATLAS-En keys to epics on apply, using a persisted counter that never reuses keys including archived ones.
  context: ADR-0007 requires that the model never mints ticket keys; keys are assigned by the reconciler/apply step only. The planning engine specification §2.2 specifies that ADD items receive monotonic ATLAS-n keys from a persisted counter on apply. Tickets take ATLAS-<n> and epics ATLAS-E<n>, each from its own monotonic counter. The counter lives in the key_counters table (knowledge-core.md). The counter must never reuse a key, including for archived items.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 75
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  acceptance_criteria:
  - A key_counters table exists in the database with separate counters for ticket keys and epic keys.
  - assign_keys(diff) increments the counter and assigns ATLAS-<n> to each ADD ticket and ATLAS-E<n> to each ADD epic in the diff.
  - The counter is incremented atomically within the apply transaction so concurrent calls cannot produce duplicate keys.
  - 'Archived tickets'' keys are never reused: the counter only increments, never resets.'
  - Unit tests verify monotonicity across multiple assign_keys calls including after a simulated archive.
  - The key assignment is the only place new ATLAS-<n> keys are created; no other code path mints keys.
  non_goals:
  - Do not implement the full atlas apply command (that is a separate ticket).
  - Do not implement Linear key sync.
  - Do not implement key validation beyond the counter (gate 6 in the parser handles that).
  implementation_notes:
  - Use a SELECT FOR UPDATE or equivalent SQLAlchemy pattern to ensure atomic counter increment.
  - The key_counters table should have rows keyed by counter_name ('ticket', 'epic') with a current_value integer.
  - Return a mapping from new:<n> placeholder to assigned key for use by the apply step.
  test_requirements:
  - Unit test that two sequential assign_keys calls produce non-overlapping key sets.
  - Unit test that the counter persists across process restarts (using a test database).
  - Unit test that archived keys are not reused after the counter advances past them.
  documentation_requirements:
  - Docstring on assign_keys describing the atomicity guarantee and the no-reuse invariant.
  definition_of_done:
  - All unit tests pass in CI.
  - The key_counters table migration is applied and the counter increments correctly in a test database.
  - No other code path in the codebase mints ATLAS-<n> keys.
  estimated_effort: null
