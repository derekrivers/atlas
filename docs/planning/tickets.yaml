  key: ATLAS-75
  title: PR review evidence ingestion
  objective: Implement ingestion of GitHub PR review events as PR_REVIEW Evidence records, mapping review states (APPROVED, CHANGES_REQUESTED, COMMENTED) to EvidenceStatus values and recording the reviewer identity in raw_payload.
  context: 'evidence-pipeline.md specifies that PR reviews are ingested as PR_REVIEW evidence: APPROVED→PASSED, CHANGES_REQUESTED→FAILED, COMMENTED→WARNING. The reviewer is recorded in raw_payload. This ingestion is triggered by the poller fetching PR reviews via GitHubPRClient.fetch_pr_reviews. The resulting records are system-tier (created_by_type=system) and must carry commit_sha (the PR head SHA at review time), external_run_id (the review ID), and payload_hash.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A normalise_pr_review(review_payload, head_sha, ticket_key) function maps GitHub review state APPROVED→PASSED, CHANGES_REQUESTED→FAILED, COMMENTED→WARNING as PR_REVIEW evidence.
  - The reviewer's login is recorded in raw_payload under a 'reviewer' key.
  - commit_sha is set to the head_sha argument (the PR head at the time of the review fetch); external_run_id is the review's GitHub id as a string; payload_hash is SHA-256 of the canonical raw payload.
  - 'Dedup logic: a review with the same (external_run_id, payload_hash) is skipped on re-poll.'
  - Unknown review states are ingested as WARNING with the raw state preserved in raw_payload and a structured warning logged.
  - 'Unit tests cover: APPROVED→PASSED; CHANGES_REQUESTED→FAILED; COMMENTED→WARNING; unknown state→WARNING; dedup skip.'
  non_goals:
  - Fetching PR reviews from GitHub — that is the polling client ticket.
  - Documentation evidence ingestion — that is a separate ticket.
  - Using PR review evidence in the Verification Engine — that is Phase 7.
  - Recording reviewer identity beyond the login field in raw_payload.
  implementation_notes:
  - The PR review state mapping should be a module-level dict alongside the workflow-run status table.
  - head_sha must be passed explicitly by the caller (the poller), not inferred from the review payload, because GitHub review payloads do not always carry the head SHA directly.
  test_requirements:
  - Unit tests for normalise_pr_review covering all review states and the dedup case.
  - 'Integration test: normaliser called twice with the same review payload confirms only one Evidence row is created.'
  documentation_requirements:
  - Docstring on normalise_pr_review documenting the state mapping and the reviewer field in raw_payload.
  definition_of_done:
  - All unit and integration tests pass in CI.
  - PR review state mapping matches evidence-pipeline.md exactly.
  - Dedup confirmed by test.
  estimated_effort: null
