- id: 6a07b007-2b3a-43df-ade7-88e8b8cc1b90
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 5a486514-1761-45a8-8094-9a0e8282c3d4
  key: ATLAS-99
  title: Lesson extraction on ticket completion and failure events
  objective: Implement the lesson extractor that fires on ticket completion (done) and failure events (rejected, PM failure-analysis), producing schema-valid DRAFT lessons via an LLM call over a bounded evidence bundle.
  context: 'The Learning System is the final phase of the Atlas harness. Per learning-system.md, lesson extraction fires on three triggers: ticket reaching done (success-pattern candidate), ticket reaching rejected or a PM failure-analysis event (failure-pattern candidate), and operator request. The extractor makes an LLM call over a bounded evidence bundle (ticket, agent runs, PR review history, verification verdicts) and produces a Lesson with status DRAFT, confidence null, and related_ticket_ids populated. ADR-0009 mandates that all agent-authored lessons start as DRAFT and are excluded from context-pack retrieval until operator promotion. ADR-0005 requires that the LLM interprets; deterministic code assembles the evidence bundle and validates the output schema.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 100
  relevant_docs:
  - docs/atlas/learning-system.md
  - docs/decisions/0009-single-operator-governance.md
  - docs/decisions/0005-code-calculates-agents-interpret.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - A lesson-extraction run is triggered automatically when a ticket transitions to `done` and the delivery was notable (first-attempt verification pass after prior failures of the same ticket_type/tag, or unusually fast cycle time).
  - A lesson-extraction run is triggered automatically when a ticket transitions to `rejected` or a PM failure-analysis event fires (review-cycle breach, dwell breach).
  - '`atlas lessons extract <KEY>` triggers extraction on demand for any ticket key.'
  - The extractor assembles a bounded evidence bundle (ticket record, agent runs, PR review history, verification verdicts) and calls the LLM; raw diffs beyond a configurable size cap are excluded.
  - The LLM output is parsed and validated against the Lesson schema; extraction failures are logged and never retried into noise.
  - 'Every extracted lesson is persisted with `status: DRAFT`, `confidence: null`, and `related_ticket_ids` populated from the source ticket.'
  - No extracted lesson is retrievable by the Context Renderer until promoted to ACTIVE.
  non_goals:
  - Operator promotion workflow (covered by the promotion CLI ticket).
  - Pattern detection over accumulated lessons (separate ticket).
  - Playbook generation (separate ticket).
  - Confidence scoring by the model — confidence is null at extraction and set by the operator at promotion.
  - Embedding-based or vector-search retrieval of lessons.
  implementation_notes:
  - Implement in `atlas/learning/extractor.py`; the trigger hooks live in the PM Engine's status-transition path.
  - The notability predicate for `done` tickets (first-attempt pass after prior failures, or fast cycle) must be deterministic code, not LLM judgement (ADR-0005).
  - Use the existing Lesson model (ATLAS-13) with status field; DRAFT is the default for agent-authored lessons per ADR-0009.
  - The LLM prompt must be a versioned Jinja2 template following the same conventions as the planner prompts.
  - Extraction failures are logged to the standard logger at WARNING level with the ticket key and exception type; no retry.
  test_requirements:
  - 'Unit tests for the evidence bundle assembler: correct fields included, size cap enforced, raw diffs excluded beyond cap.'
  - 'Unit test: extraction on a `done` ticket with no prior failures of the same type produces no lesson (not notable).'
  - 'Unit test: extraction on a `done` ticket with prior failures of the same ticket_type produces a DRAFT lesson.'
  - 'Unit test: extraction on a `rejected` ticket produces a DRAFT lesson.'
  - 'Integration test: `atlas lessons extract <KEY>` against a fixture ticket produces a persisted DRAFT lesson with confidence null.'
  - Test that a failed LLM call logs the failure and does not persist a partial lesson.
  documentation_requirements:
  - Docstrings on the extractor module and public functions.
  - Update learning-system.md if any extraction trigger semantics differ from the design.
  definition_of_done:
  - Extraction triggers fire correctly on done, rejected, and PM failure-analysis events in integration tests.
  - '`atlas lessons extract <KEY>` works end-to-end against a fixture ticket.'
  - All unit and integration tests pass in CI.
  - No extracted lesson is retrievable before promotion (verified by context renderer test).
  estimated_effort: null
