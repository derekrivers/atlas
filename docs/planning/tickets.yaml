  key: ATLAS-96
  title: 'Ticket-level failure analysis: cycle and dwell detection with DRAFT lesson creation'
  objective: Implement Atlas-owned ticket-level failure analysis that detects review cycling and dwell breaches after Symphony handoff, files failure-analysis notes, proposes ticket splits for oversized work, and creates DRAFT lessons from repeated failure patterns.
  context: 'Per symphony-integration.md retry-and-failure-seam, Atlas owns ticket-level outcomes while Symphony owns intra-ticket execution reliability. The PM Engine watches for: tickets cycling changes_requested ↔ pr_open more than N times (default 3); tickets dwelling in active states beyond configurable horizons; and verification failures after handoff. Its responses are planning-level: file a failure-analysis note, propose a ticket split, or route to Needs Human. Repeated failure patterns become DRAFT lessons (ADR-0009). The roadmap seeds this as ATLAS-86. Note: cycle detection (ATLAS-120) and dwell detection (ATLAS-119) are already delivered in Phase 4; this ticket wires the lesson-creation and split-proposal responses specific to Phase 8.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 60
  relevant_docs:
  - docs/atlas/symphony-integration.md
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/learning-system.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - When a ticket exceeds the review-cycle threshold (>3 changes_requested→pr_open round trips), the PM Engine creates a DRAFT Lesson with ticket_type/tag context and a failure-analysis summary, in addition to routing the ticket to Needs Human.
  - When a ticket has accumulated more than one dwell breach of the same type, the PM Engine creates a DRAFT Lesson capturing the dwell pattern.
  - 'The failure-analysis note posted to the ticket (as a Linear comment or DebtItem detail) includes: the anomaly type, the count, the ticket key, and a suggested remediation (split the ticket if acceptance_criteria count > 5).'
  - DRAFT lessons are created with status=DRAFT and are not retrievable into context packs until operator promotion (ADR-0009).
  - 'Unit tests cover: lesson creation on cycle threshold breach, lesson creation on repeated dwell breach, and the split-proposal trigger condition.'
  non_goals:
  - Do not implement lesson promotion (that is the operator's gate, delivered in Phase 9).
  - Do not implement the full learning system extraction pipeline (Phase 9).
  - Do not re-implement cycle or dwell detection — those are already in Phase 4 (ATLAS-119, ATLAS-120); this ticket adds the lesson-creation response.
  - Do not automatically split tickets; only propose the split as a planning input.
  implementation_notes:
  - Lesson creation calls the same Lesson model and repository used by Phase 9; this ticket is the first writer of failure-pattern lessons from the PM Engine.
  - The split proposal is written as an atlas:proposed-follow-up comment on the Linear issue, feeding the existing follow-up ingestion pipeline (ATLAS-45/122).
  - The lesson body is deterministically constructed from the anomaly record fields — no LLM call; ADR-0005 applies (code calculates, agents interpret).
  test_requirements:
  - 'Unit test: a ticket with review_cycle_count > 3 triggers DRAFT lesson creation with correct fields.'
  - 'Unit test: a ticket with two or more DWELL_BREACH DebtItems of the same type triggers DRAFT lesson creation.'
  - 'Unit test: the failure-analysis note includes the split suggestion when acceptance_criteria_count > 5.'
  - 'Unit test: created lessons have status=DRAFT and are excluded from context-pack retrieval.'
  documentation_requirements:
  - Add a note to docs/atlas/symphony-integration.md retry-and-failure-seam section documenting the lesson-creation trigger conditions.
  definition_of_done:
  - DRAFT lessons are created automatically on cycle and repeated dwell breaches.
  - Failure-analysis notes include split suggestions for oversized tickets.
  - Lessons are not retrievable until operator promotion.
  - All unit tests pass in CI.
