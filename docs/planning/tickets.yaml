  key: ATLAS-24
  title: PlanRun persistence and provenance recording
  objective: 'Implement the PlanRun model, database table, and repository that records full provenance for each planning run: input doc SHAs, model/provider, prompt version and hash, raw output hash, diff summary, approver, and status lifecycle.'
  context: ADR-0007 requires a PlanRun entity to record provenance. The planning engine specification §6 defines the PlanRun schema (deferred to data-model-and-schemas.md §3.10). A PlanRun row is inserted at status:proposed; exactly one finalising transition to applied, rejected, or failed is permitted. All other fields are immutable after insert; rows are never deleted. The PlanRun must record input_doc_shas, model, provider, prompt_version, prompt_hash, raw_output_hash, diff_summary, approved_by, applied_at, and failure_reason.
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 60
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - 'The PlanRun SQLAlchemy model and Alembic migration exist with all required fields: id, status, input_doc_shas (JSON), model, provider, prompt_version, prompt_hash, raw_output_hash, diff_summary, approved_by, applied_at, failure_reason, created_at.'
  - PlanRunRepo.insert() creates a row at status:proposed and returns the PlanRun id.
  - PlanRunRepo.finalise() transitions status to applied, rejected, or failed; a second call raises a typed error (immutable after finalisation).
  - PlanRunRepo.latest_proposed() returns the most recent proposed PlanRun or None.
  - Rows are never deleted; the repository has no delete method.
  - 'Unit tests cover: insert, finalise to each terminal status, double-finalise rejection, latest_proposed with zero and multiple rows.'
  non_goals:
  - Do not implement the generation_stages field for multi-call provenance (that is ATLAS-105, a separate ticket).
  - Do not implement PlanRun querying beyond latest_proposed.
  - Do not implement a PlanRun CLI command.
  implementation_notes:
  - input_doc_shas should be stored as a JSON column mapping doc_path to blob_sha.
  - diff_summary stores the counts per diff entry type (ADD, MODIFY, PROPOSE_ARCHIVE, CONFLICT) as a JSON object.
  - Use SQLAlchemy mapped_column with server_default for created_at.
  test_requirements:
  - Unit test that insert() creates a row at status:proposed.
  - Unit test that finalise() to applied sets approved_by and applied_at.
  - Unit test that a second finalise() call raises a typed ImmutablePlanRunError.
  - Unit test that latest_proposed() returns None when no proposed runs exist.
  - Unit test that rows survive a process restart (using a test SQLite database).
  documentation_requirements:
  - Docstrings on PlanRunRepo methods describing the immutability contract and the finalising transition rules.
  definition_of_done:
  - All unit tests pass in CI.
  - The Alembic migration applies cleanly to a fresh database.
  - A PlanRun row inserted and finalised in a test database round-trips correctly through the repository.
