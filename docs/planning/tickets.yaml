  key: ATLAS-84
  title: Acceptance criteria check evaluator (operator confirmation)
  objective: Implement the ACCEPTANCE_CRITERIA check evaluator that requires a human-tier MANUAL_APPROVAL evidence record per criterion, identified by the SHA-256 hash of the criterion text, pinned to the PR head commit.
  context: In v1, acceptance criteria verification is operator-confirmed. atlas verify presents each criterion as a checklist; the operator's confirmations are stored as human-tier MANUAL_APPROVAL evidence records carrying raw_payload['acceptance_criterion_hash'] — the SHA-256 hex digest of the criterion text after strip(). The check passes only when every criterion has such a confirmation at the head commit. Rewording a criterion changes its hash, requiring re-confirmation.
