  key: ATLAS-44
  title: 'Roadmap-coverage sensor: every ticket referenced in a closure report must appear in the implementation roadmap'
  objective: Implement a lightweight sensor that verifies every ticket key cited in a Phase closure report document exists in `docs/atlas/implementation-roadmap.md`, so omissions from the roadmap are caught mechanically rather than discovered in review.
  context: 'The Phase 3.5 roadmap entry (ATLAS-115) calls for a roadmap-coverage sensor: every ticket referenced in a closure report must appear in the roadmap. Closure reports are the canonical record of what was built in a phase; if a ticket key appears in a closure report but not in the roadmap, the roadmap has drifted from reality. This sensor closes that gap by making the check mechanical and wiring it into CI, consistent with the doc-linter philosophy established in Phase 0 (ATLAS-4) and the architecture-fitness sensor pattern introduced by the import-linter ticket.'
  status: needs_human_decision
  ticket_type: infrastructure
  risk_level: low
  priority: 8
  relevant_docs:
  - docs/atlas/implementation-roadmap.md
  - ARCHITECTURE.md
  acceptance_criteria:
  - 'A sensor script or doc-linter rule exists (e.g. in `atlas/tools/doc_linter.py` or a dedicated `atlas/tools/roadmap_coverage.py`) that: (a) scans all closure report documents under `docs/` for `ATLAS-<n>` key references, and (b) checks each referenced key against the set of keys present in `docs/atlas/implementation-roadmap.md`.'
  - The sensor exits non-zero and prints a clear error listing the missing keys when any referenced key is absent from the roadmap.
  - The sensor exits 0 when all referenced keys are present in the roadmap.
  - The sensor is wired into the CI workflow so it runs on every PR.
  - A seeded fixture test demonstrates the sensor fails on a closure report referencing a key not in the roadmap, and passes when the key is present.
  non_goals:
  - Do not validate the reverse direction (roadmap keys that have no closure report) — that is a separate concern.
  - Do not parse or validate the content of closure reports beyond extracting `ATLAS-<n>` key references.
  - Do not integrate with the database or operational state — this is a pure document scan.
  - Do not add this check to pre-commit (CI is sufficient for this sensor; pre-commit is reserved for fast local checks).
  implementation_notes:
  - Closure reports are likely Markdown files under `docs/` whose names contain 'closure' or are in a `docs/atlas/` subdirectory — the sensor should scan a configurable glob, defaulting to `docs/**/*closure*.md`.
  - 'Key extraction: a simple regex `ATLAS-\d+` over the file content is sufficient; avoid false positives from code blocks by optionally stripping fenced blocks first (reuse the heading-scan exclusion logic from the doc linter if available).'
  - 'Roadmap key extraction: scan `docs/atlas/implementation-roadmap.md` for the same pattern.'
  - The sensor can be a standalone CLI entry point (`uv run python -m atlas.tools.roadmap_coverage`) or integrated into the existing doc-linter runner.
  - Keep the implementation simple — this is a text scan, not a semantic analysis.
  test_requirements:
  - Unit test with a fixture closure report containing a key present in a fixture roadmap — sensor exits 0.
  - Unit test with a fixture closure report containing a key absent from a fixture roadmap — sensor exits non-zero and names the missing key.
  - CI step running the sensor against the real `docs/` tree exits 0 after this ticket lands.
  documentation_requirements:
  - Add a brief comment in the CI workflow step explaining what the roadmap-coverage sensor checks and why.
  definition_of_done:
  - Sensor implemented and exits 0 on the current `docs/` tree.
  - Fixture tests pass (present key → 0, absent key → non-zero).
  - CI step added and green.
  - PR reviewed and merged.
