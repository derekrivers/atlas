  key: ATLAS-95
  title: 'Handoff-state handling: Review Required and Needs Human stop work without workspace cleanup'
  objective: Ensure the PM Engine and Symphony configuration correctly handle Review Required and Needs Human as handoff states that terminate the agent session while preserving the workspace for potential resumption.
  context: Per symphony-integration.md state-mapping, Review Required and Needs Human are neither active nor terminal in Symphony's classification. This causes Symphony to terminate the worker while preserving the workspace — correct for states where a human verdict may send the ticket back to Changes Requested and the agent resumes in the same workspace. The PM Engine must not attempt to re-dispatch tickets in these states, and the WORKFLOW.md must not list them as active or terminal. The roadmap seeds this as ATLAS-85.
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/symphony-integration.md
  - WORKFLOW.md
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - WORKFLOW.md active_states does not include Review Required or Needs Human; terminal_states does not include them either.
  - The PM Engine's promote_ready function never moves a ticket from Review Required or Needs Human to Ready for Agent.
  - The PM Engine's sync loop does not push definition updates to tickets in Review Required or Needs Human (description is frozen per context-pack-delivery rules).
  - When the operator relays a Changes Requested verdict (review_required → changes_requested), the PM Engine writes this transition to Linear and the ticket re-enters the active dispatch cycle.
  - Unit tests assert that tickets in review_required and needs_human_decision are skipped by promote_ready and definition-push logic.
  non_goals:
  - Do not implement the verification engine's verdict-to-state routing (that is Phase 7 work already delivered).
  - Do not implement workspace cleanup or teardown logic — Symphony owns that.
  - Do not implement the operator UI for reviewing PRs — the operator acts directly in Linear/GitHub.
  implementation_notes:
  - The state-mapping table in symphony-integration.md is the authoritative reference; the PM Engine's status handling must match it exactly.
  - The PM Engine already owns the review_required → done and review_required → changes_requested transitions per the one-writer-per-state-edge rule; this ticket ensures those paths are correctly wired.
  - Workspace preservation is Symphony's responsibility; Atlas only needs to ensure it does not send conflicting state signals.
  test_requirements:
  - 'Unit test: promote_ready skips tickets in review_required and needs_human_decision.'
  - 'Unit test: definition-push step skips tickets in review_required and needs_human_decision.'
  - 'Unit test: a review_required → changes_requested transition written by the PM Engine results in the ticket re-entering the active states list.'
  - 'Verify WORKFLOW.md YAML: active_states and terminal_states do not contain Review Required or Needs Human.'
  documentation_requirements: []
  definition_of_done:
  - Handoff states are correctly excluded from Symphony's active and terminal state lists.
  - The PM Engine never re-dispatches or updates tickets in handoff states.
  - The Changes Requested re-dispatch path is tested and working.
  - All unit tests pass in CI.
