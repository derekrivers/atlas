  title: Staged planner prompt templates for multi-call generation (epics, tickets-per-epic, dependencies)
  objective: Implement the three versioned per-stage prompt templates (epics, tickets-per-epic, dependencies) as projections of the §3.11 proposal contract, enabling bounded multi-call generation per ADR-0010.
