- id: 0f73f53b-ba39-45d3-bee6-a0c3599b4df7
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-57
  title: Delivery metrics CLI report (atlas pm report)
  objective: 'Implement atlas pm report: a pure-reader CLI command that computes and displays throughput (tickets done/week), cycle time per state from the TicketStatusTransition log, ready-queue depth, anomaly counts by type with recurring flags, and dwell breaches — all from stored tickets and DebtItems, with no Linear calls and no writes.'
  context: 'ATLAS-47 in the roadmap. The delivery report is a pure reader: it makes no Linear calls and writes nothing, computing every metric from stored tickets and DebtItems. Throughput is bucketed by ISO week of status_entered_at for done tickets. Cycle time per state is computed from the TicketStatusTransition log (completed episodes only). Ready-queue depth is the count of tickets in ready_for_agent. Anomaly counts are grouped by AnomalyType with recurring ones called out. Dwell breaches are the DWELL_BREACH subset. Output is CLI/markdown with a --json form.'
  status: done
  ticket_type: feature
  risk_level: low
  priority: 60
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/decisions/0005-code-calculates-agents-interpret.md
  acceptance_criteria:
  - atlas pm report prints throughput (tickets done/week, bucketed by ISO week of status_entered_at; done tickets with null entry time fall in an 'unknown' bucket).
  - Cycle time per state is computed from TicketStatusTransition completed episodes (min/median/max hours and episode count per state); states with no completed episodes are omitted.
  - Ready-queue depth is the count of tickets in ready_for_agent.
  - Anomaly counts are grouped by AnomalyType; recurring anomalies (DebtItemRepo.recurring predicate) are flagged per type.
  - Dwell breaches (DWELL_BREACH DebtItems) are listed per ticket.
  - --json emits a machine-readable form of the same data.
  - The command makes no Linear API calls and writes no state.
  non_goals:
  - A dashboard or web UI (CLI/markdown only per Revision 1).
  - Historical cycle time before TicketStatusTransition rows exist (the report shows what the log contains).
  - 'LLM-generated narrative or interpretation (ADR-0005: code calculates, agents interpret).'
  - TickFailure count in the report (that is a follow-up once the scheduler lands).
  implementation_notes:
  - All metric computations are deterministic Python (ADR-0005); no LLM calls.
  - Cycle time uses datetime subtraction over ordered TicketStatusTransition rows; the current open episode (no exit) is excluded.
  - build_delivery_report is a pure function taking stored data as input, returning a typed report object; the CLI renders it.
  - Median is computed with statistics.median over episode durations in hours.
  test_requirements:
  - 'Unit test: throughput computation buckets done tickets by ISO week correctly; null entry time goes to ''unknown''.'
  - 'Unit test: cycle time computation over a fixture transition log produces correct min/median/max per state.'
  - 'Unit test: ready-queue depth counts only ready_for_agent tickets.'
  - 'Unit test: anomaly counts group correctly and recurring flag is set when DebtItemRepo.recurring returns True.'
  - 'Unit test: --json output is valid JSON matching the report schema.'
  - 'Unit test: the command makes no network calls (verified by injecting a mock that raises on any HTTP call).'
  documentation_requirements:
  - CLI help text for atlas pm report documenting each metric and the --json flag.
  - Docstring on build_delivery_report referencing ADR-0005 (code calculates).
  definition_of_done:
  - All unit tests pass in CI.
  - atlas pm report runs on a fixture database and produces correct output.
  - --json output is valid and documented.
  - No network calls made by the command.
  estimated_effort: null
