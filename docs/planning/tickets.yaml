  key: ATLAS-85
  title: Scope check evaluator (heuristic, operator waive/fail)
  objective: Implement the SCOPE check evaluator that compares the PR file list against the ticket's declared in-scope set (relevant_docs union source_anchor path), presents out-of-scope files for operator waive/fail decisions recorded as human-tier MANUAL_APPROVAL evidence, and returns a typed verdict.
  context: The scope evaluator derives the in-scope set from relevant_docs and the path part of source_anchor (no allowed_paths field in v1). Out-of-scope files require operator decisions stored as human-tier MANUAL_APPROVAL records carrying raw_payload['scope_decision_path']. PASSED = waive, FAILED = reject. The check passes when every changed file is in scope or waived; PENDING while any out-of-scope file is undecided.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 75
  relevant_docs:
  - docs/atlas/verification-engine.md
  acceptance_criteria:
  - The in-scope set is computed as the union of the ticket's relevant_docs paths and the path part of source_anchor (source_anchor.split('#', 1)[0]), using exact normalised path equality.
  - Files in the PR change list that are in the in-scope set are accepted without operator input.
  - For each out-of-scope file, the evaluator looks for a human-tier MANUAL_APPROVAL record at the head commit carrying raw_payload['scope_decision_path'] equal to the normalised file path.
  - PASSED scope decision (waive) means the file is acceptable; FAILED scope decision means the file should not be there.
  - The check returns PASSED when all changed files are in scope or waived; FAILED when any out-of-scope file's latest decision is FAILED; PENDING when any out-of-scope file has no decision.
  - For a file with multiple decisions, the latest by (created_at, id) decides.
  non_goals:
