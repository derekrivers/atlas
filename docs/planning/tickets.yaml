- id: 3e851afc-e19c-441d-a30e-121fc21f794a
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 5a486514-1761-45a8-8094-9a0e8282c3d4
  key: ATLAS-102
  title: Failure and success pattern detection over accumulated lessons
  objective: Implement deterministic heuristic pattern detection over lessons, debt items, and anomaly logs that raises pattern-candidate flags when recurring failure tags or recurring debt categories are detected, surfaced via `atlas lessons report`.
  context: 'learning-system.md specifies pattern detection as deterministic heuristics over lessons, debt items, and anomaly logs — no LLM. The rule: recurrence of the same tag across ≥3 failure-pattern lessons, or the same DebtItem category recurring across tickets, raises a pattern-candidate flag in `atlas lessons report`. ADR-0011 clarifies that pattern detection over code-quality debt must re-point at the reintroduced code-quality register (ATLAS-117), not at the delivery anomaly''s anomaly_type. ADR-0005 requires all quantitative detection to be deterministic code. Patterns are inputs to playbooks and to planning.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 97
  relevant_docs:
  - docs/atlas/learning-system.md
  - docs/decisions/0005-code-calculates-agents-interpret.md
  - docs/decisions/0011-debtitem-denotes-delivery-anomalies.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - A tag appearing across ≥3 failure-pattern DRAFT or ACTIVE lessons is flagged as a pattern candidate in `atlas lessons report`.
  - Pattern detection is purely deterministic code with no LLM calls (ADR-0005).
  - '`atlas lessons report` displays pattern candidates with the tag, count of contributing lessons, and the lesson titles.'
  - Pattern detection over code-quality debt items uses the code-quality register entity (ATLAS-117) when available, not the delivery-anomaly DebtItem's anomaly_type.
  - The pattern detection function is unit-testable in isolation with fixture lesson and debt data.
  - A tag with fewer than 3 failure-pattern lessons is not flagged.
  non_goals:
  - LLM-assisted pattern interpretation — detection is deterministic; interpretation is a future enhancement.
  - Automatic playbook generation triggered by pattern detection (separate ticket).
  - Pattern detection over delivery anomalies (DebtItem anomaly_type) — ADR-0011 explicitly separates these.
  - Embedding-based clustering of lessons.
  - Alerting or notification on pattern detection.
  implementation_notes:
  - Implement in `atlas/learning/patterns.py`; the function signature takes a list of lessons and returns a list of PatternCandidate dataclasses.
  - The threshold (≥3) is a module constant, not a config file value, to keep it auditable.
  - The code-quality register integration is conditional on ATLAS-117 being present; if the entity does not exist, that detection branch is skipped gracefully.
  - Pattern candidates are not persisted — they are computed at report time from the current lesson store.
  test_requirements:
  - 'Unit test: 3 failure-pattern lessons sharing a tag produces one pattern candidate; 2 does not.'
  - 'Unit test: success-pattern lessons do not contribute to failure-pattern detection.'
  - 'Unit test: pattern candidates are sorted by count descending.'
  - 'Unit test: the detection function returns an empty list when no patterns meet the threshold.'
  - 'Integration test: `atlas lessons report` includes the pattern candidates section with correct counts against fixture data.'
  documentation_requirements:
  - Docstrings on the pattern detection module.
  - Note in learning-system.md if the threshold or detection logic differs from the design.
  definition_of_done:
  - Pattern detection correctly identifies recurring failure tags at the ≥3 threshold in all unit tests.
  - '`atlas lessons report` displays pattern candidates.'
  - All tests pass in CI.
  - No LLM calls in the detection path.
  estimated_effort: null
