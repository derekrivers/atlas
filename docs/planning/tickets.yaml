  objective: 'Implement section-level documentation retrieval for the context renderer: extract only the anchored heading''s section plus its parent heading chain from each relevant doc, record the git blob SHA of each extracted doc, and cap at 5 doc sections.'
  context: 'The context renderer retrieves docs at section granularity (context-renderer.md §Retrieval rules v1): the ticket''s relevant_docs plus the doc containing its source_anchor, extracting only the anchored section (heading to next same-level heading) plus the parent heading chain for orientation. Each extracted doc''s SHA is recorded in input_doc_shas for staleness detection. This ticket implements that retrieval in atlas.context, depending on the relocated anchor primitive (ATLAS-129).'
