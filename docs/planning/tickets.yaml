  key: ATLAS-47
  title: 'Ready-state promotion: sole writer into Ready for Agent'
  objective: 'Implement the readiness promotion step (step 3 of the sync loop): run the dependency-engine readiness predicate each tick, and for each newly ready ticket write Ready for Agent in Linear via LinearClient.set_state, making the PM Engine the sole writer into that state.'
  context: The PM Engine is the only component permitted to move a ticket into Ready for Agent (symphony-integration.md state mapping). Promotion requires the dependency-engine readiness predicate (all depends_on tickets done, all depends_on ADRs accepted, ≥1 acceptance criterion, no dangling targets). The Linear write is the sanctioned outbound status write Atlas→Linear; Atlas's own ready_for_agent status is reconciled by the next pull (one tick of latency). The write is idempotent. The target Linear state is resolved by inverting the configured status map; exactly one state must map to ready_for_agent.
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 85
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/dependency-engine.md
  - docs/atlas/symphony-integration.md
  acceptance_criteria:
  - promote_ready runs the dependency-engine ready_tickets predicate and calls LinearClient.set_state for each newly ready ticket not already in ready_for_agent.
  - The PM Engine is the sole writer into the Ready for Agent Linear state; no other code path calls set_state with that target.
  - The target Linear state id is resolved by inverting the configured status map; load-time validation confirms exactly one state maps to ready_for_agent.
  - The write is Linear-only; Atlas status is updated by the next pull tick (not by promote_ready directly).
  - 'Promotion is idempotent: a ticket already in ready_for_agent is never re-promoted.'
  - A ticket that fails the readiness predicate (e.g. a dependency not done) is not promoted and the reason is logged.
  non_goals:
  - Context-pack rendering before promotion (deferred to Phase 5/8).
  - Embedding the pack in the Linear description (Phase 8, ATLAS-82).
  - Promoting tickets in blocked status (promote_ready touches only planned/backlog).
  - The needs_human_decision routing (that is the review-cycling anomaly ticket).
  implementation_notes:
  - Reuse the build_dependency_graph + ready_tickets functions from atlas.dependencies; do not re-implement readiness logic.
  - state_id_for(ready_for_agent) must be validated at scheduler startup, not per tick.
  - The promotion write path must not include any definition field (stateId only, consistent with the allow-list).
  test_requirements:
  - 'Unit test: a ticket satisfying all readiness conditions triggers set_state to the ready_for_agent Linear state.'
  - 'Unit test: a ticket with an unfinished dependency is not promoted.'
  - 'Unit test: a ticket already in ready_for_agent is not re-promoted (idempotency).'
  - 'Unit test: load-time validation raises if zero or multiple states map to ready_for_agent.'
  - 'Integration test: promote_ready called twice on the same ready ticket produces exactly one set_state call.'
  documentation_requirements:
  - Docstring on promote_ready documenting sole-writer contract and one-tick latency for Atlas status.
  definition_of_done:
  - All unit tests pass in CI with InMemoryLinearClient.
  - Sole-writer invariant is enforced (no other call site for set_state targeting ready_for_agent).
  - Load-time validation of the status map is tested and documented.
