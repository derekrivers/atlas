  key: ATLAS-175
  title: 'Playbooks are canon that no manifest can see: recurse the MANIFEST check and stop blocking on untracked files'
  objective: A generated playbook is registered in `docs/MANIFEST.md` like every other canonical document, the doc linter enforces that for canonical docs at any depth, and the clean-worktree guard blocks on uncommitted tracked changes rather than on harmless untracked files.
  context: 'Two live findings, 2026-07-17, from the first playbook Atlas ever generated (`docs/atlas/playbooks/linear-sync.md`, branch `playbook/linear-sync-20260717T174341Z`). FINDING 1 — the guard is over-strict: `_ensure_clean_worktree` (atlas/learning/playbook.py) runs `git status --porcelain`, whose output includes UNTRACKED files, so five operator scratch scripts in `scripts/` blocked the command entirely (`git worktree must be clean before drafting a playbook`, exit 2). The guard''s actual purpose is to stop `git switch -c` stranding uncommitted TRACKED modifications on the new branch; untracked files carry across a switch untouched and cannot cause that. The command is unusable without a stash dance in exactly the state an operator''s workspace is normally in. FINDING 2 — playbooks escape doc governance: `atlas/tools/doc_linter.py` declares `docs/atlas` a CANONICAL_DIR and its module docstring promises ''every canonical doc ... is listed'' in the MANIFEST, but the MAN005 check globs `(root / directory).glob(''*.md'')` — NON-RECURSIVE. `docs/atlas/playbooks/*.md` is therefore never seen. Verified live: a generated playbook placed at that path passes `doc-linter: clean` while unlisted. This was never a deliberate exemption — before ATLAS-103 no canonical directory had ANY subdirectory (confirmed: zero `.md` files exist at depth 2+ under docs/atlas, docs/architecture, docs/decisions, docs/runbooks), so the glob''s depth was an untested assumption that the playbook feature invalidated. Because `docs/MANIFEST.md` is the source-of-truth-hierarchy resolver (ADR-0006, and the reviewer-session protocol''s conflict rule), an unregistered canonical doc has no position in the hierarchy: if a playbook contradicts `pm-engine-and-linear-sync.md`, nothing says which wins. Phase 9 shipped a feature that mass-produces exactly that. ATLAS-103''s AC-6 (''the playbook passes the doc linter'') is technically satisfied today only because the check has a blind spot. Operator ruling OP-B(a), 2026-07-17: playbooks ARE canon; recurse the check and register them — the alternative (exempting `docs/atlas/playbooks/` as generated content) was rejected as declaring canon the hierarchy cannot see. Pre-ruled decisions: D-1 MAN005 recurses (`rglob`) over CANONICAL_DIRS; every canonical `.md` at any depth must be MANIFEST-listed. D-2 `atlas lessons playbook` writes the MANIFEST entry onto the review branch alongside the playbook file — otherwise the feature''s happy path lands a PR that fails CI, which is a feature that does not work. It still never commits (ATLAS-103 D-2 stands): the operator reviews both edits in the PR. D-3 `docs/MANIFEST.md` gains a playbooks section so generated entries have a stable, predictable home rather than being appended arbitrarily. D-4 `_ensure_clean_worktree` uses `git status --porcelain --untracked-files=no`; untracked files no longer block. D-5 an untracked file at the playbook''s OWN target path is still a hard refuse — that is the one untracked file that can genuinely collide; it fails with a message naming the path. D-6 no change to ATLAS-103''s branch naming, provenance section, ACTIVE-only selection, or never-commit contract.'
  status: done
  ticket_type: bug
  risk_level: low
  priority: 50
  relevant_docs:
  - docs/planning/inbox/processed/inbox-stub-playbook-canon.md
  acceptance_criteria:
  - 'MAN005 recurses: a fixture canonical doc at `docs/atlas/<subdir>/x.md` that is absent from the MANIFEST is flagged, and the same file listed in the MANIFEST is clean (seed the probe with `assert 1 == 2`, B011 — the current non-recursive glob must fail this test).'
  - 'Negative: every existing canonical doc still passes; the repository''s current MANIFEST is clean under the recursive check with no doc additions beyond the playbooks section.'
  - '`atlas lessons playbook <tag>` writes both the playbook file and its `docs/MANIFEST.md` entry on the review branch, commits neither, and the resulting worktree passes the doc linter.'
  - '`_ensure_clean_worktree` permits untracked files: a fixture repo with untracked files drafts successfully, while a fixture repo with a MODIFIED TRACKED file still refuses with the existing error.'
  - An untracked file already at `docs/atlas/playbooks/<tag>.md` causes a clean refusal naming that path (EXIT_PRECONDITION), not a silent overwrite.
  non_goals:
  - No exemption for docs/atlas/playbooks/. No change to ATLAS-103's branch naming, never-commit contract, provenance section, or ACTIVE-only selection. No automatic PR creation. No new linter rules beyond MAN005's depth. No changes to other CANONICAL_DIRS' contents.
  implementation_notes: []
  test_requirements:
  - Fixture-driven, `ATLAS_LIVE_TESTS=0`; seeded defects use `assert 1 == 2` (B011); enumeration pins hold; full gate sweep green including `python -m atlas.tools.doc_linter`.
  documentation_requirements: []
  definition_of_done:
  - All acceptance criteria evidenced by named tests; the doc linter's module docstring matches its actual behaviour; MANIFEST carries the playbooks section; full gate sweep green; PR title carries the minted key.
