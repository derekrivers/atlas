  objective: Ensure the canonical WORKFLOW.md and Linear tracker configuration are correct, complete, and tested so Symphony can poll and dispatch ready tickets without manual intervention.
  context: Symphony loads its behaviour from the repo-owned WORKFLOW.md. The front matter defines the tracker project slug, active/terminal states, polling interval, workspace hooks, and the Codex command. The body is the per-issue prompt template that instructs the agent how to move tickets, read the context pack, and report findings. Phase 8 requires this file to be the authoritative contract before any dispatch can occur. The roadmap seeds this as ATLAS-81.
  status: needs_human_decision
