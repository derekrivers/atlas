  title: YAML serialisation layer for docs/planning renders
  objective: Implement the YAML serialisation layer in atlas.core that converts the canonical Pydantic models into the docs/planning render format (epics.yaml, tickets.yaml, dependencies.yaml), with a fixed field order, generated header, and round-trip fidelity.
  context: The planning renders written by atlas apply must have a stable, deterministic format. The YAML serialisation layer is the single implementation that converts model instances into the render format; atlas apply calls it and nothing else writes planning YAML. The format includes a generated header (plan_run_id, prompt_version), fixed field ordering for human readability and stable diffs, and natural-key sorting. Round-trip fidelity means a YAML file can be parsed back into model instances without data loss.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 65
  relevant_docs:
  - docs/atlas/bootstrap-guide.md
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - A module atlas/core/yaml_serialiser.py (or equivalent) provides functions to serialise a list of Epic models to epics.yaml format, a list of Ticket models to tickets.yaml format, and a list of TicketDependency models to dependencies.yaml format.
  - Each serialised file includes a generated header comment with plan_run_id and prompt_version.
  - Field order in the YAML output is fixed and deterministic (not dict insertion order).
  - Entities are sorted by natural key order (ATLAS-E<n> for epics, ATLAS-<n> for tickets) within each file.
  - A corresponding deserialisation function parses each YAML file back into the appropriate model instances without data loss (round-trip test passes).
  - The serialiser raises a typed error if passed a model instance with a null key (unassigned keys must not appear in renders).
  non_goals:
  - Do not implement the atlas apply command here — that is Phase 2.
  - Do not implement Mermaid DAG rendering — that is Phase 2 (ATLAS-27).
  - Do not implement YAML parsing for the planning proposal — the proposal uses JSON, not YAML.
  - Do not implement any file I/O beyond what is needed for the serialiser functions themselves; file writing is the caller's responsibility.
  implementation_notes:
  - Use PyYAML with default_flow_style=False and explicit field ordering via a custom representer or by constructing an OrderedDict.
  - 'Natural key sorting: sort ATLAS-E1, ATLAS-E2, ..., ATLAS-E10 numerically (not lexicographically).'
  - The generated header is a YAML comment block at the top of the file.
  - Keep the serialiser as a pure function (models in, string out) with no file I/O — the caller (atlas apply) handles writing.
  test_requirements:
  - 'Unit test: serialise a fixture list of Epic models and assert the output YAML contains the expected header and fields in the correct order.'
  - 'Unit test: serialise then deserialise a fixture list of Ticket models and assert the round-trip produces identical model instances.'
  - 'Unit test: serialiser raises a typed error when passed a Ticket with key=None.'
  - 'Unit test: entities are sorted by natural key in the output.'
  documentation_requirements: []
  definition_of_done:
  - YAML serialisation and deserialisation functions implemented in atlas.core.
  - All unit tests pass under pytest.
  - ruff and mypy pass with no errors.
  - Round-trip test passes for all three render types.
  estimated_effort: null
