- id: f5e00650-d298-4017-9cf9-fa5b8a1bc663
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 01499978-f6b2-4cd9-9924-4056720e5a2d
  key: ATLAS-78
  title: Evidence retention policy (raw_payload size cap)
  objective: 'Implement the raw_payload retention policy: cap raw_payload at 64KB, storing the first 64KB for oversized payloads along with the full payload''s SHA-256 hash and a source_uri for retrieval from GitHub.'
  context: 'evidence-pipeline.md specifies: ''raw_payload is capped at 64KB; larger payloads store the first 64KB, the full payload''s hash, and source_uri for retrieval from GitHub. Evidence rows are never deleted; a retention review is a Phase 10+ concern.'' This policy must be enforced at the EvidenceRepo layer before insertion so that no oversized payload ever reaches the database. The source_uri field must be added to the Evidence model if not already present.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 60
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - EvidenceRepo.add truncates raw_payload to the first 64KB (65536 bytes of the JSON-serialised payload) when the payload exceeds this limit.
  - When truncation occurs, the full payload's SHA-256 hash is stored in a payload_full_hash field and a source_uri (the GitHub API URL for the run) is stored in a source_uri field on the Evidence record.
  - When the payload is within the 64KB limit, payload_full_hash and source_uri are null.
  - An Alembic migration adds payload_full_hash (nullable string) and source_uri (nullable string) columns to the evidence table.
  - Evidence rows are never deleted by any code path; there is no delete method on EvidenceRepo.
  - 'Unit tests cover: payload under 64KB stored in full with null payload_full_hash; payload over 64KB truncated with payload_full_hash and source_uri set.'
  non_goals:
  - Implementing automatic deletion or archival of old evidence rows — that is a Phase 10+ concern per the design doc.
  - Fetching the full payload from source_uri — that is a retrieval concern for future tooling.
  - Compressing payloads — truncation is the specified approach.
  implementation_notes:
  - The 64KB limit should be a module-level constant RAW_PAYLOAD_MAX_BYTES = 65536.
  - Truncation is applied to the JSON-serialised bytes of raw_payload, not to the dict in memory.
  - 'source_uri for a workflow run is the GitHub API URL: https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}.'
  test_requirements:
  - Unit tests for the truncation logic with payloads at, below, and above the 64KB boundary.
  - Migration smoke test confirming new columns exist.
  - Test confirming no delete method exists on EvidenceRepo (or that calling any deletion raises NotImplementedError).
  documentation_requirements:
  - Docstring on EvidenceRepo.add documenting the 64KB cap, the truncation behaviour, and the source_uri field.
  definition_of_done:
  - All unit tests pass in CI.
  - Migration applied cleanly.
  - No delete path exists in EvidenceRepo.
  estimated_effort: null
