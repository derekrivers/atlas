  - Do not implement storage table definitions or the append-only enforcement at the database level — that is the storage layer ticket.
  - Do not implement the 64KB raw_payload cap at the model level — that is a storage/repository concern.
  - Do not implement VerificationCheck model here — that is a separate ticket.
  implementation_notes:
