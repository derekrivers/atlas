- id: d3656909-ccf7-44a3-b3e6-87e3e3b6f939
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-46
  title: Ticket synchronisation sync_tick (pull status, push definitions)
  objective: 'Implement sync_tick in atlas/pm/sync.py: pull Linear status for all tracked tickets and apply mapped state changes (Atlas status written by apply_linear_status, the sole post-creation status writer); push definition updates for tickets whose Atlas updated_at is newer and are in a pre-dispatch or Ready for Agent status.'
  context: 'The sync loop is the heartbeat of the PM Engine. Steps 1 and 2 of the five-step loop: (1) fetch Linear states for tickets with an external_linear_id in a non-terminal Atlas status, apply mapped transitions via apply_linear_status, and count/log unmapped states; (2) push owned definition fields (title, description summary) for tickets whose updated_at is newer than last push. apply_linear_status is the single writer of Atlas ticket status post-creation; it also stamps status_entered_at and increments review_cycle_count on changes_requested→pr_open transitions. The sync is pull-based (ADR-0008); ticks are idempotent.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 90
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - sync_tick fetches Linear states for all tickets with external_linear_id in a non-terminal Atlas status and applies mapped transitions via apply_linear_status.
  - apply_linear_status is the sole post-creation writer of Atlas ticket status; it stamps status_entered_at on every real status change and increments review_cycle_count only on changes_requested→pr_open transitions; neither field bumps updated_at.
  - Definition push sends only OWNED_DEFINITION_FIELDS for tickets whose updated_at is newer, and only while the ticket is in a pre-dispatch status or ready_for_agent.
  - Unmapped Linear state ids are counted and logged (not applied); the count is available in the SyncResult returned by sync_tick.
  - 'sync_tick is idempotent: running it twice on unchanged state produces no additional writes.'
  - SyncResult carries counts of status_updates, definition_pushes, unmapped_states, and errors for observability.
  non_goals:
  - Readiness promotion (step 3, separate ticket).
  - Follow-up comment scanning (step 4, separate ticket).
  - Anomaly and dwell detection (step 5, separate tickets).
  - The recurring scheduler that calls sync_tick (separate ticket).
  - Out-of-ownership anomaly logging (ATLAS-118, separate ticket).
  implementation_notes:
  - apply_linear_status must be the single writer; no other code path may set ticket status after creation.
  - status_entered_at and review_cycle_count must not bump updated_at (to avoid spurious definition re-push).
  - SyncResult is a plain dataclass/Pydantic model, not persisted — it is ephemeral per tick.
  - The definition push guard checks updated_at > last_synced_at (a field on the ticket or a separate sync-state record).
  test_requirements:
  - 'Unit tests using InMemoryLinearClient: a mapped status change updates Atlas ticket status exactly once.'
  - 'Unit test: an unmapped state id increments unmapped_states count and does not change Atlas status.'
  - 'Unit test: definition push fires only when updated_at is newer and ticket is in eligible status.'
  - 'Unit test: apply_linear_status stamps status_entered_at on status change and does not bump updated_at.'
  - 'Unit test: review_cycle_count increments only on changes_requested→pr_open transition.'
  - 'Idempotency test: two consecutive sync_ticks on unchanged Linear state produce identical SyncResult with zero writes on the second call.'
  documentation_requirements:
  - Docstring on sync_tick describing the two steps and idempotency guarantee.
  - Docstring on apply_linear_status documenting sole-writer contract and fields it stamps.
  definition_of_done:
  - All unit tests pass in CI with InMemoryLinearClient (no network).
  - apply_linear_status is demonstrably the only post-creation status writer (grep/import-linter check).
  - SyncResult fields are documented and covered by tests.
  estimated_effort: null
