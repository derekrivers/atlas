  key: ATLAS-48
  title: Blocked state detection and stale-block anomaly logging
  objective: 'Implement the stale-block detection pass (step 5 of the sync loop): when a ticket is in the blocked status but its structural blockers have all cleared (blocked(graph, key) is empty), append one STALE_BLOCK DebtItem per episode and surface the candidate in the delivery report.'
  context: 'A ticket may be marked blocked while its dependency-graph blockers have resolved, leaving it stranded. The PM Engine detects this structurally (not time-based) using the same dependency graph promote_ready projects. The detection is report-only: it never changes ticket state. Per-episode dedup is enforced by Ticket.status_entered_at: one STALE_BLOCK row per episode (since the ticket entered blocked), not one per tick. A NULL status_entered_at is skipped. The graph is the one already projected this tick.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 70
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/dependency-engine.md
  acceptance_criteria:
  - _detect_stale_block iterates tickets in blocked status and appends one STALE_BLOCK DebtItem when blocked(graph, key) is empty and no STALE_BLOCK row exists for the ticket since status_entered_at.
  - 'Detection is report-only: _detect_stale_block never calls set_state or changes any ticket status.'
  - 'Per-episode dedup: a ticket stranded across multiple ticks produces exactly one STALE_BLOCK row per blocked episode.'
  - A ticket with NULL status_entered_at is skipped (never logged).
  - The graph consumed is the same one projected by promote_ready this tick (not a second projection).
  - STALE_BLOCK items appear in the delivery report output.
  non_goals:
  - Automatically routing a stale-blocked ticket to a new status (report-only by design).
  - Detecting tickets that are structurally blocked but not marked blocked (out of scope per design doc).
  - Dwell-based detection for tickets genuinely blocked (no dwell horizon for blocked status).
  implementation_notes:
  - DebtItem is append-only, system-written (created_by_type=system), one row per observation.
  - The dedup query checks for any STALE_BLOCK row with observed_at >= ticket.status_entered_at.
  - Reuse the blocked(graph, key) function from atlas.dependencies.blocker_analysis.
  test_requirements:
  - 'Unit test: a ticket in blocked with empty blocked(graph, key) and no prior STALE_BLOCK row since status_entered_at produces one DebtItem.'
  - 'Unit test: a ticket in blocked with a non-empty blocked(graph, key) produces no DebtItem.'
  - 'Unit test: calling _detect_stale_block twice in the same episode produces exactly one DebtItem (dedup).'
  - 'Unit test: a ticket with NULL status_entered_at is skipped.'
  - 'Unit test: _detect_stale_block makes no set_state calls.'
  documentation_requirements:
  - Docstring on _detect_stale_block documenting report-only contract and per-episode dedup.
  definition_of_done:
  - All unit tests pass in CI.
  - No set_state call is reachable from _detect_stale_block (verified by test and code review).
  - STALE_BLOCK items visible in atlas pm report output.
