  key: ATLAS-89
  title: VerificationCheck persistence (append-only records)
  objective: Implement the VerificationCheck storage model and repository that persists one append-only VerificationCheck record per check per verification run, never mutating prior rows, with a re-run appending a fresh set.
  context: The Verification Engine must persist its verdicts as append-only VerificationCheck records (data-model §5). Each run of atlas verify appends a fresh set of records — one per check — rather than updating existing ones. This is consistent with the append-only evidence model (ADR-0008). The VerificationCheck schema lives in data-model-and-schemas.md §5.
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 60
  relevant_docs:
  - docs/atlas/verification-engine.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A VerificationCheck SQLAlchemy model and Alembic migration exist, matching the schema in data-model-and-schemas.md §5 (ticket_id, check_type, required, status, reason, evidence_ids, head_commit, created_at).
  - VerificationCheckRepo.add(check) inserts a new row and never updates existing rows.
  - VerificationCheckRepo.latest_for_ticket(ticket_id, head_commit) returns the most recent set of checks for a ticket at a given commit.
  - Rows are never deleted or updated — the repository raises an error if an update is attempted.
  - 'Unit tests verify append-only semantics: two runs for the same ticket and commit produce two sets of rows, not one updated set.'
  - The migration applies cleanly on a fresh database and on an existing database.
  non_goals:
  - Implementing any evaluator or verdict logic.
  - Implementing the CLI — that is a separate ticket.
  - Retention or deletion policies — rows are never deleted in v1.
  implementation_notes:
  - Implement in atlas/storage/models.py (model) and atlas/storage/repositories/verification.py (repo).
  - evidence_ids stored as a JSON array column.
  - created_at is server-default now(), never client-supplied.
  test_requirements:
  - 'Unit test: add two VerificationCheck records for the same ticket and commit → two rows exist.'
  - 'Unit test: latest_for_ticket returns the most recent set by created_at.'
  - 'Unit test: migration applies on a fresh SQLite database without error.'
  - 'Unit test: attempting to update a row raises a typed error.'
  documentation_requirements: []
  definition_of_done:
  - VerificationCheck model and migration committed.
  - VerificationCheckRepo implemented with add and latest_for_ticket methods.
  - Append-only semantics verified in tests.
  - All unit tests pass in CI.
  estimated_effort: null
