  key: ATLAS-33
  title: Graph schema and build from storage
  objective: Implement the NetworkX DiGraph projection from relational storage, providing the pure `project_graph` function and the `build_dependency_graph` entry point that reads tickets, epics, ADRs, and dependency rows and returns a fully attributed DiGraph.
  context: The dependency engine requires a NetworkX DiGraph projected on demand from the relational tables (never persisted; the database is authoritative per ADR-0006). Nodes are keyed by entity key (ticket ATLAS-<n>, epic ATLAS-E<n>, ADR ADR-<nnnn>), carry typed attributes (node_type, key, entity_id, present, status, priority, risk_level, estimated_effort, ticket_type, acceptance_criteria_count, epic_key for tickets; status, priority, risk_level for epics; status, number for ADRs), and edges carry dependency_type, reason, and dependency_id. Absent targets are represented as present=False nodes rather than being dropped. The pure core `project_graph(tickets, epics, adrs, dependencies)` takes models in and returns a graph out with no I/O, enabling deterministic testing.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 100
  relevant_docs:
  - docs/atlas/dependency-engine.md
  - docs/atlas/implementation-roadmap.md
  - docs/decisions/0002-use-postgresql-as-source-of-truth.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - '`project_graph(tickets, epics, adrs, dependencies)` is a pure function (no I/O) that returns a NetworkX DiGraph; given identical inputs it returns a structurally identical graph.'
  - Every ticket node carries node_type, key, entity_id, present=True, status, priority, risk_level, estimated_effort (may be null), ticket_type, acceptance_criteria_count, and epic_key as native graph attributes.
  - Every epic node carries node_type, key, entity_id, present=True, status, priority, and risk_level.
  - Every ADR node carries node_type, key (synthesised ADR-{number:04d}), entity_id, present=True, status, and number.
  - A dependency target that resolves to no stored entity is represented as an absent node (present=False) with its edge intact; no absent node is silently dropped.
  - '`build_dependency_graph(db)` reads tickets, epics, ADRs, and TicketDependency rows from storage and delegates to `project_graph`; it never writes and never persists the graph.'
  - 'Unit tests cover: a graph with tickets, epics, and ADR nodes; a graph with an absent (dangling) target node; edge attributes (dependency_type, reason, dependency_id) are present on every edge.'
  non_goals:
  - Graph persistence — the graph is always projected on demand; never stored.
  - Graph validation (acyclicity, dangling-target detection) — that is a separate ticket.
  - Readiness, critical-path, or blocker analyses — those are separate tickets.
  - Component nodes — schema-supported but unused until Phase 5.
  implementation_notes:
  - Entry points live in `atlas/dependencies/graph.py`.
  - Node identity is the entity key string; UUID-based dependency endpoints resolve to keys once at build time.
  - Only `depends_on` is stored; `blocks` is the derived reverse view and is never stored.
  - A plain DiGraph (one edge per (source, target)) is sufficient; a same-pair collision keeps the lowest-id row deterministically.
  - The §4.1 GraphNode/GraphEdge Pydantic models are reserved for a possible future persisted graph; the current implementation uses native graph attributes.
  test_requirements:
  - Pure unit tests for `project_graph` using in-memory model fixtures (no database).
  - Integration test for `build_dependency_graph` against a seeded SQLite database.
  - Test that an absent target produces a present=False node with the edge intact.
  - Test that node and edge attributes match the specification exactly.
  documentation_requirements:
  - Docstrings on `project_graph` and `build_dependency_graph` describing parameters, return type, and the absent-node contract.
  definition_of_done:
  - All unit and integration tests pass in CI.
  - '`project_graph` and `build_dependency_graph` are importable from `atlas.dependencies.graph`.'
  - No I/O in `project_graph` (verified by test isolation — no DB fixture needed).
  - Ruff and mypy pass with no new violations.
