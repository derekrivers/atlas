  context: ADR-0008 specifies that evidence records are append-only, pinned to a commit SHA, and trust-tiered by created_by_type. System-tier records require commit_sha, external_run_id, and payload_hash; agent-submitted records are capped at PENDING. The Evidence model is the contract that the evidence pipeline (Phase 6) writes to and the Verification Engine (Phase 7) reads from. Establishing it in atlas.core in Phase 1 ensures all later phases import from a single definition.
