  context: 'ADR-0009 mandates that only ACTIVE lessons are retrievable into context packs — DRAFT lessons (agent-authored, not yet operator-promoted) must never appear. The context renderer retrieval rules (context-renderer.md §Retrieval rules v1) specify: status=ACTIVE only, matched by tag intersection with the ticket''s tags and ticket_type, ranked by confidence then recency, cap 3. This ticket implements that retrieval function in atlas.context.'
