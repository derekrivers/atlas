- id: b3b6c3ac-a583-43bf-a129-50611ada5da9
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-49
  title: 'Follow-up comment scanning: producer writing inbox stubs'
  objective: 'Implement step 4 of the sync loop: scan recent Linear issue comments for the atlas:proposed-follow-up tag and write one stub file per tagged comment to docs/planning/inbox/<ticket-key>-<n>.md, deduped by source comment id, without committing the stubs or creating any ticket or Atlas/Linear state.'
  context: 'Agents file follow-up observations as Linear comments tagged atlas:proposed-follow-up. The PM Engine reads these (read-only LinearClient.fetch_comments) and writes stub files to the working tree. The stub is self-identifying: the source comment id is written as an HTML comment on the first line for dedup. The write is atomic (temp+rename). The producer does not commit stubs, does not create tickets, and does not write Atlas or Linear state. Dedup spans both inbox/ and inbox/processed/ so indices stay monotonic after atlas apply moves stubs. The consumer (ATLAS-122) is a separate ticket.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 65
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/planning-engine-specification.md
  acceptance_criteria:
  - For each ticket with an external_linear_id in a non-terminal status, fetch_comments is called and comments containing the atlas:proposed-follow-up tag are identified.
  - One stub file is written to docs/planning/inbox/<ticket-key>-<n>.md per tagged comment; the stub carries the source comment id as an HTML comment on the first line, the verbatim comment body, and an honest source reference.
  - 'Dedup: a comment whose id already has a stub under inbox/ or inbox/processed/ is skipped; each comment is stubbed at most once.'
  - The write is atomic (write to temp file, then rename into place).
  - The producer creates no ticket, writes no Atlas database state, writes no Linear state, and does not commit the stubs.
  - <n> is the next free index for the ticket key, computed across both inbox/ and inbox/processed/.
  non_goals:
  - Committing the inbox stubs (operator's responsibility).
  - 'The consumer half: atlas plan reading the inbox and atlas apply moving stubs to processed/ (ATLAS-122).'
  - Creating tickets directly from follow-up comments.
  - Parsing or validating the follow-up content beyond tag detection.
  implementation_notes:
  - 'The HTML comment dedup key format: <!-- atlas-source-comment-id: <id> --> on the stub''s first line, separate from the verbatim body.'
  - fetch_comments is read-only; the producer never calls create_issue, update_issue, or set_state.
  - Scan only tickets with external_linear_id in a non-terminal Atlas status to bound the comment fetch volume.
  test_requirements:
  - 'Unit test: a comment containing atlas:proposed-follow-up produces one stub file with correct content and HTML comment dedup key.'
  - 'Unit test: a comment whose id already has a stub in inbox/ is skipped (no second stub written).'
  - 'Unit test: a comment whose id already has a stub in inbox/processed/ is skipped.'
  - 'Unit test: stub filename index is monotonic across inbox/ and inbox/processed/.'
  - 'Unit test: the write is atomic (temp file used, then renamed).'
  - 'Live gate (operator-run): a real atlas:proposed-follow-up comment in Linear produces one stub file.'
  documentation_requirements:
  - Docstring on the scan function documenting the producer-only contract and dedup mechanism.
  - Comment in the stub template showing the HTML comment format.
  definition_of_done:
  - All unit tests pass in CI with InMemoryLinearClient.
  - Live gate documented in the ticket and confirmed by operator before closing.
  - No Atlas or Linear state is written by the producer (verified by test).
  estimated_effort: null
