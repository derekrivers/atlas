  key: ATLAS-15
  title: Repository classes for all entities with append-only enforcement
  objective: Implement repository classes in atlas.storage for all atlas.core entities, providing the typed query and write interface used by all higher layers, with append-only enforcement for Evidence and dangling polymorphic dependency-target detection.
  context: Repository classes are the single interface through which higher layers read and write operational state. Each repository wraps a SQLAlchemy session and exposes typed methods (add, get_by_id, get_by_key, list, etc.). The EvidenceRepository must enforce append-only semantics (no update or delete methods). The TicketDependencyRepository must detect dangling polymorphic targets (a dependency pointing to a non-existent entity). The TicketRepository must expose set_estimated_effort as the single writer of that field, per the dependency-engine design.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 65
  relevant_docs:
  - docs/atlas/dependency-engine.md
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - 'Repository classes exist for: ProductRepo, ADRRepo, EpicRepo, TicketRepo, TicketDependencyRepo, LessonRepo, EvidenceRepo, PlanRunRepo, ContextPackRepo, AgentRunRepo.'
  - 'Each repository exposes at minimum: add(entity), get_by_id(id), list() returning typed results.'
  - EvidenceRepo exposes no update or delete methods; attempting to call a non-existent update method raises AttributeError (enforced by not defining it).
  - EvidenceRepo.add rejects any system-tier record missing commit_sha, external_run_id, or payload_hash with a typed EvidenceValidationError.
  - 'EvidenceRepo.add enforces the trust cap: agent-submitted records with status != PENDING are stored as PENDING.'
  - TicketRepo.set_estimated_effort(key, effort) accepts a positive integer or None, rejects <= 0 with EffortValidationError, rejects unknown keys with TicketNotFoundError, and does NOT update updated_at.
  - TicketDependencyRepo detects dangling targets (a dependency whose target UUID does not exist in any entity table) and raises DanglingTargetError.
  non_goals:
  - Do not implement graph projection or readiness detection — those are Phase 3.
  - Do not implement Linear sync or PM Engine logic.
  - Do not implement full-text search or complex query methods beyond what Phase 1 requires.
  - Do not implement the key counter increment logic — that is Phase 2 (key authority).
  implementation_notes:
  - Place repository classes in atlas/storage/repositories.py or a repositories/ subpackage.
  - Use typed exceptions defined in atlas/storage/exceptions.py.
  - Each repository takes a SQLAlchemy Session as a constructor argument for testability.
  - Tests should use an in-memory SQLite database with the Alembic migration applied.
  - The dangling-target check in TicketDependencyRepo queries the tickets, epics, and adrs tables to verify the target UUID exists.
  test_requirements:
  - 'Unit tests for each repository: add an entity, retrieve it by id, assert field values match.'
  - 'Unit test: EvidenceRepo.add with a system-tier record missing commit_sha raises EvidenceValidationError.'
  - 'Unit test: EvidenceRepo.add with an agent-tier record with status=PASSED stores the record with status=PENDING.'
  - 'Unit test: TicketRepo.set_estimated_effort with effort=0 raises EffortValidationError.'
  - 'Unit test: TicketRepo.set_estimated_effort with an unknown key raises TicketNotFoundError.'
  - 'Unit test: TicketDependencyRepo raises DanglingTargetError when adding a dependency whose target does not exist.'
  documentation_requirements: []
  definition_of_done:
  - All repository classes implemented in atlas.storage.
  - All unit tests pass under pytest.
  - ruff and mypy pass with no errors.
  - EvidenceRepo append-only and trust-cap enforcement verified by tests.
  - TicketRepo.set_estimated_effort single-writer contract verified by tests.
  estimated_effort: null
