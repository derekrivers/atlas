- id: ee47cedd-443c-4d9c-ae7a-b5737f51548a
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-50
  title: 'Delivery-anomaly model: DebtItem and recurrence predicate'
  objective: Implement the DebtItem model (append-only delivery-anomaly record), the debt_items table migration, DebtItemRepo with the add method and the recurring(ticket_id, anomaly_type, threshold) query-time predicate, and the AnomalyType enum covering OUT_OF_OWNERSHIP_TRANSITION, DWELL_BREACH, REVIEW_CYCLE, and STALE_BLOCK.
  context: 'ADR-0011 resolves that DebtItem denotes the delivery-anomaly record: one row per observation, system-written (created_by_type=system), append-only. Recurrence is a query-time predicate (DebtItemRepo.recurring), never a stored counter and never a creation gate. This is the foundational model that all anomaly-logging passes (ATLAS-118, ATLAS-119, ATLAS-120, ATLAS-44) write to. The model must be in place before any anomaly writer can land.'
  status: done
  ticket_type: infrastructure
  risk_level: high
  priority: 95
  relevant_docs:
  - docs/decisions/0011-debtitem-denotes-delivery-anomalies.md
  - docs/atlas/pm-engine-and-linear-sync.md
  acceptance_criteria:
  - 'DebtItem Pydantic model and SQLAlchemy ORM model exist with fields: id, ticket_id (nullable for tick-level records), anomaly_type (AnomalyType enum), observed_at, created_by_type (always system), detail (text), and any per-type fields required by the anomaly writers.'
  - AnomalyType enum covers OUT_OF_OWNERSHIP_TRANSITION, DWELL_BREACH, REVIEW_CYCLE, and STALE_BLOCK.
  - Alembic migration creates the debt_items table; migration is reversible.
  - DebtItemRepo.add persists a new row; it never updates or deletes existing rows (append-only enforced).
  - DebtItemRepo.recurring(ticket_id, anomaly_type, threshold=3) returns True when the count of rows for that ticket and type meets or exceeds the threshold; it is a pure query, never a creation gate.
  - JSON schema is regenerated from the updated Pydantic models.
  non_goals:
  - The code-quality debt register (a distinct future entity per ADR-0011 D2; not DebtItem, not debt_items).
  - Any mutable status lifecycle on DebtItem rows (append-only by design).
  - The anomaly-logging passes themselves (those are separate tickets that depend on this model).
  - TickFailure model (tick-level crash record, separate from DebtItem).
  implementation_notes:
  - ticket_id is nullable to support tick-level records (TickFailure is a separate model; DebtItem rows always have a ticket_id in v1 anomaly writers).
  - observed_at is set at insert time by the repository, not by the caller.
  - The recurring predicate takes a recorded_since parameter for windowed queries (used by dwell and stale-block dedup).
  test_requirements:
  - 'Unit test: DebtItemRepo.add persists a row and a second call creates a second row (append-only).'
  - 'Unit test: DebtItemRepo.recurring returns False below threshold, True at and above threshold.'
  - 'Unit test: the migration applies cleanly on a fresh database and rolls back cleanly.'
  - 'Unit test: DebtItem model round-trips through YAML and the database.'
  - Test that created_by_type is always system on rows created by DebtItemRepo.add.
  documentation_requirements:
  - Docstring on DebtItem referencing ADR-0011 and the append-only contract.
  - Docstring on DebtItemRepo.recurring clarifying it is a query-time predicate, never a creation gate.
  definition_of_done:
  - Migration applies and rolls back cleanly in CI.
  - All unit tests pass.
  - JSON schema regenerated and committed.
  - No update or delete path exists on DebtItem rows (verified by code review and test).
  estimated_effort: null
