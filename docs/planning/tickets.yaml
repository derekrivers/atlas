  key: ATLAS-68
  title: Context pack generation with input_doc_shas and staleness detection
  objective: 'Implement the full context pack generator: assemble all retrieved sections into a ContextPack with rendered_markdown in the fixed section order, record input_doc_shas, apply compression if needed, persist the pack, and detect staleness by comparing recorded SHAs against the current doc tree.'
  context: The context renderer (context-renderer.md) assembles retrieved docs, ADRs, related tickets, lessons, and verbatim ticket fields into a ContextPack with a fixed section order. Every pack records input_doc_shas for staleness detection. A pack is stale when any recorded SHA differs from the current tree. This ticket wires together the retrieval functions (ATLAS-51, ATLAS-52, ATLAS-53, ATLAS-54), the compression ladder (ATLAS-55), and the ContextPack model (ATLAS-15) into the complete generation pipeline.
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 42
  relevant_docs:
  - docs/atlas/context-renderer.md
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/symphony-integration.md
  acceptance_criteria:
  - render_context_pack(ticket_key, db, graph, budget) returns a persisted ContextPack with all required sections populated.
  - 'rendered_markdown follows the fixed section order: Objective, Constraints, Acceptance Criteria, Non-goals, Relevant Docs, ADRs, Related Tickets, Lessons, Risks, Test Commands, Definition of Done.'
  - input_doc_shas records the git blob SHA of every extracted doc at render time.
  - token_estimate is set to the chars/4 estimate of rendered_markdown.
  - is_stale(pack, current_shas) returns True when any recorded SHA differs from the current tree.
  - The pack is persisted to the database via the ContextPack repository.
  non_goals:
  - CLI surface — that is ATLAS-58.
  - Validation checks — that is ATLAS-60.
  - PM Engine integration for staleness-triggered re-render — out of scope for this ticket.
  implementation_notes:
  - Verbatim ticket fields (objective, context, constraints, acceptance_criteria, non_goals, test_requirements, definition_of_done, risks) are included directly from the Ticket model.
  - Section order is fixed and must not vary between renders — this enables prompt caching.
  - On ContextPackOverBudgetError from the compression ladder, propagate the error rather than persisting a partial pack.
  test_requirements:
  - 'Integration test: render a pack for a fixture ticket; assert all sections present in correct order.'
  - 'Unit test: is_stale returns False when SHAs match, True when any SHA differs.'
  - 'Unit test: token_estimate equals len(rendered_markdown) // 4.'
  - 'Unit test: pack is persisted and retrievable by pack_id.'
