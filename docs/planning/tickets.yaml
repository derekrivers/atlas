  key: ATLAS-17
  title: Document ingestion and heading-anchor index with git blob SHAs
  objective: Implement the document loader that reads all planning-engine input documents from HEAD, records each document's git blob SHA, and builds a heading-anchor index mapping every valid anchor slug to its document path and heading text.
  context: The planning engine specification (§2.1) requires that atlas plan collects PRODUCT.md, ARCHITECTURE.md, ROADMAP.md, WORKFLOW.md, all accepted ADRs, and all docs/atlas/ documents, recording the git blob SHA of every input. The anchor slug algorithm (§2.3) is GitHub-style and must be the single implementation reused by the doc linter and renderer. Inputs are read from HEAD only; a dirty or untracked working tree fails with a typed error. The anchor index is the foundation for gate 4 (anchor resolution) and AT-5 (provenance).
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 100
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/atlas/bootstrap-guide.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - All specified input document globs are collected and their git blob SHAs recorded.
  - 'The heading-anchor index is built using the GitHub-style slug algorithm (§2.3): lowercase, strip non-[a-z0-9 -], spaces to hyphens, duplicate headings suffixed -1/-2.'
  - Headings inside fenced code blocks are excluded from the index.
  - A dirty or untracked working tree within the input set raises a typed ingestion error and no PlanRun is created.
  - 'The anchor index is queryable: given a slug string, it returns the document path and heading text or raises a typed missing-anchor error.'
  - 'Unit tests cover: slug generation, duplicate heading suffixing, fenced-code-block exclusion, dirty-tree rejection, and SHA recording.'
  non_goals:
  - Do not implement the planner prompt renderer or LLM call.
  - Do not implement the follow-up inbox ingestion (that is a separate consumer).
  - Do not implement domain/ document discovery beyond the specified globs.
  implementation_notes:
  - Use gitpython or subprocess git cat-file to read blob SHAs from HEAD.
  - The slug function must be importable as a standalone utility so the doc linter and renderer can reuse it without importing the full ingestion module.
  - Store the anchor index as a dict[str, ResolvedAnchor] where ResolvedAnchor carries doc_path, heading_text, and blob_sha.
  test_requirements:
  - Unit tests for the slug algorithm against known inputs including duplicates and special characters.
  - Unit test that a fenced code block heading is not indexed.
  - Unit test that a dirty working tree raises the typed error.
  - Integration test that all specified document globs are collected from a fixture repo state.
  documentation_requirements:
  - Docstrings on the public slug function and AnchorIndex class describing the algorithm and error types.
  definition_of_done:
  - All unit and integration tests pass in CI.
  - The slug function is importable from atlas.planning.ingestion.
  - A fixture run against the real Atlas docs directory produces a non-empty anchor index with correct SHAs.
  estimated_effort: null
