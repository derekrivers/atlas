  key: ATLAS-80
  title: Evidence CLI (pull, list, show)
  objective: 'Implement the atlas evidence CLI subcommands: ''pull'' to manually trigger a polling tick for a ticket or all eligible tickets, ''list'' to display evidence records for a ticket filtered by type, and ''show'' to display a single evidence record by ID.'
  context: 'evidence-pipeline.md specifies the CLI surface: ''atlas evidence pull [--ticket KEY] (manual tick), atlas evidence list <KEY> [--type T], atlas evidence show <ID>.'' The pull command triggers the poller for the specified ticket (or all eligible tickets if no key is given), calling the GitHub client and normaliser pipeline. The list and show commands are pure readers over EvidenceRepo. The roadmap also notes ATLAS-130: the CLI must fail cleanly on a cold/never-migrated database, mapping a missing-schema OperationalError to EXIT_PRECONDITION across all three subcommands.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 50
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - '''atlas evidence pull'' with no arguments fetches workflow runs, check runs, and PR reviews for all tickets in pr_open, review_required, or changes_requested states and ingests them via the normaliser pipeline.'
  - '''atlas evidence pull --ticket KEY'' restricts the pull to the single specified ticket.'
  - '''atlas evidence list KEY'' prints all Evidence records for the ticket in a human-readable table; ''--type T'' filters by evidence_type.'
  - '''atlas evidence show ID'' prints all fields of a single Evidence record by its database ID.'
  - All three subcommands catch a SQLAlchemy OperationalError caused by a missing schema (cold database) and exit with EXIT_PRECONDITION and a clear message rather than a traceback.
  - 'Unit tests cover: pull with --ticket KEY calls the poller for exactly that ticket; list with --type filter returns only matching records; show with a valid ID returns the record; cold-database OperationalError exits with EXIT_PRECONDITION.'
  non_goals:
  - Implementing a recurring scheduler loop — the CLI is a manual trigger; the scheduler is a PM Engine concern.
  - Implementing a dashboard or web UI.
  - Implementing webhook ingestion.
  - Fetching evidence from sources other than GitHub.
  implementation_notes:
  - The pull command should call the same poller function used by the PM Engine scheduler, not duplicate the polling logic.
  - EXIT_PRECONDITION should be a consistent exit code (e.g. 2) used across all Atlas CLI commands for precondition failures.
  - 'The list output should include at minimum: ID, evidence_type, status, commit_sha (truncated), created_at.'
  test_requirements:
  - Unit tests using the fake GitHubClient and an in-memory SQLite database.
  - Test for cold-database EXIT_PRECONDITION behaviour across all three subcommands.
  - CLI invocation tests using Typer's test runner (CliRunner).
  documentation_requirements:
  - Help text for each subcommand explaining its arguments and the cold-database behaviour.
  definition_of_done:
  - All unit tests pass in CI.
  - Cold-database EXIT_PRECONDITION confirmed by test.
  - '''atlas evidence pull'', ''atlas evidence list'', and ''atlas evidence show'' are registered in the atlas CLI.'
