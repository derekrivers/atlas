  key: ATLAS-83
  title: Documentation check evaluator
  objective: Implement the DOCUMENTATION check evaluator that verifies a DOCUMENTATION_UPDATE evidence record exists for the PR head commit covering at least one path named in the ticket's documentation_requirements.
  context: The evidence pipeline (Phase 6) records DOCUMENTATION_UPDATE evidence when PR file changes include paths under docs/. The verification engine must check that such a record exists for the head commit and that it covers at least one path from the ticket's documentation_requirements field. Tickets with documentation requirements and no such record fail verification.
