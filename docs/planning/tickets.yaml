  key: ATLAS-153
  title: 'Stubs-only plan mode: mint committed inbox stubs without a model call'
  objective: Implement atlas plan --stubs-only, which produces an apply-ready PlanRun from committed inbox stubs alone — zero model calls, zero generation cost, no double-emission surface.
  context: 'Minting hand-authored stubs today requires a full planner draw whose only planning contribution is to echo the backlog so promotion can inject the stubs — every such run costs a full generation and re-exposes the F-4 double-emission surface. A stubs-only mode skips generation entirely: the proposal is the verbatim keyed backlog echo plus the promoted stubs, flowing through the ordinary gates → reconcile → PlanRun path. Deterministic by construction (ADR-0005: pure code, no model). Complements the F-4 reconciler dedup rather than replacing it.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 60
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/planning/inbox/inbox-stub-stubs-only-plan-mode.md
  acceptance_criteria:
  - atlas plan --stubs-only with N committed stubs yields a PlanRun whose diff is exactly N ticket ADDs (plus no-op epic re-statements); proven by a pipeline-level test whose model client is a fake asserting zero generation calls.
  - An empty inbox under --stubs-only is a clean-exit precondition failure with a message naming the empty inbox, never an empty-diff PlanRun.
  - 'PlanRun provenance records the mode: a stubs-only run is distinguishable from a generative run in the stored record (e.g. a generation_mode field or a zero-stage generation_stages list).'
  - '--stubs-only and --staged are mutually exclusive: passing both is an argparse error, exercised by a CLI test.'
  - With the flag absent, the generative path is byte-identical to today (existing pipeline tests pass unmodified).
  - atlas apply consumes a stubs-only PlanRun unchanged, including the stub retirement lifecycle.
  non_goals:
  - No dedup logic — the promotion-dedup ticket (F-4) owns reconciler-level collapse.
  - No prompt or staged-generation changes; the generative path is untouched.
  - No stub subset selection or interactive stub picking.
  implementation_notes:
  - 'The stubs-only proposal is constructed by pure code: take the current backlog (keyed items re-stated verbatim) plus the promoted stubs as ADD items; no model call.'
  - The generation_mode field (or equivalent) on PlanRun distinguishes stubs-only from generative runs; this may reuse the generation_stages field from ATLAS-27 (a zero-stage list is the stubs-only marker).
  - Update running-atlas-plan.md (ATLAS-32) to document the mode, its provenance marker, and the cost rationale.
  test_requirements:
  - Pipeline-level test with a fake model client asserting zero calls and N committed stubs → N ticket ADDs.
  - CLI test confirming --stubs-only and --staged together produce an argparse error.
  - 'Test the empty-inbox precondition failure: --stubs-only with no committed stubs → clean exit with named message.'
  documentation_requirements:
  - Update running-atlas-plan.md and planning-engine-specification.md §2.1 to document the --stubs-only flag, its precondition, and its provenance marker.
  definition_of_done:
  - All acceptance criteria evidenced by named tests.
  - Full CI gate sweep green.
  - running-atlas-plan.md and the planning spec document the mode in the same change.
