  - Confirm exit code is EXIT_PRECONDITION (e.g. 2) not 1 or 0.
  - Confirm no Python traceback appears in stderr output.
  documentation_requirements: []
  definition_of_done:
  - All three subcommands exit cleanly with EXIT_PRECONDITION on a cold database.
  - Unit tests for the cold-database path pass in CI.
