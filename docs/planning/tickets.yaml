  - '`atlas lessons playbook <tag>` retrieves all ACTIVE lessons for the given tag and generates a playbook document via an LLM call.'
  - The generated playbook is written to `docs/atlas/playbooks/<tag>.md` on a new git branch (not committed to main directly).
  - The command fails with a clear error if no ACTIVE lessons exist for the given tag.
  - The generated playbook file includes the source lesson titles and IDs as a provenance section.
  - The command prints the branch name and instructs the operator to review and merge via PR.
  - The playbook file is valid Markdown and passes the doc linter.
  non_goals:
