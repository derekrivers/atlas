  key: ATLAS-12
  title: JSON Schema generation from Pydantic models and doc-linter v2 schema validation
  objective: Generate JSON Schema from all atlas.core Pydantic models and extend the doc linter to validate JSON examples in canonical documentation against the generated schemas, so schema drift between docs and code is caught in CI.
  context: 'The roadmap specifies that JSON Schema is generated from the Pydantic models (ATLAS-16) and that doc linter v2 validates JSON examples in canonical docs against those schemas. This closes the loop between the models-as-contract principle and the documentation: any JSON example in a design doc that diverges from the actual model is caught mechanically in CI. The doc linter v1 (Phase 0) already validates ADR structure and MANIFEST links; v2 adds schema validation as an additional check.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 60
  relevant_docs:
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  acceptance_criteria:
  - A script or module atlas/tools/generate_schemas.py generates JSON Schema files for all atlas.core models into a designated output directory (e.g. docs/schemas/).
  - The generated schemas are committed to the repository and the generation script is wired into CI so a schema drift (model changed but schema not regenerated) fails CI.
  - The doc linter v2 (extending atlas/tools/doc_linter.py) scans canonical docs for fenced JSON blocks annotated with a schema reference comment and validates each block against the corresponding generated schema.
  - The doc linter v2 fails with a clear error message when a JSON example in a doc does not validate against its schema.
  - The doc linter v2 passes on the existing canonical docs (no spurious failures on valid examples).
  - A seeded bad fixture (a JSON example with a missing required field) causes the doc linter to fail — this is the milestone test.
  non_goals:
  - Do not validate YAML planning renders against schemas — that is a separate concern.
  - Do not implement automatic doc repair or schema migration.
  - Do not add schema validation to the planning proposal parser here — that is the planning engine's gate 1.
  - Do not generate OpenAPI specs — JSON Schema only.
  implementation_notes:
  - Use Pydantic v2's model_json_schema() to generate schemas.
  - 'The annotation convention for doc JSON blocks can be a comment on the line before the fence: <!-- schema: <model-name> -->.'
  - The doc linter should gracefully skip JSON blocks with no schema annotation rather than failing.
  - Schema files should be committed under docs/schemas/ and treated as generated artifacts (not hand-edited).
  test_requirements:
  - Unit test confirms the schema generation script produces valid JSON Schema for at least the Ticket and Evidence models.
  - 'Integration test: the doc linter v2 fails on a fixture doc containing a JSON block with a missing required field.'
  - 'Integration test: the doc linter v2 passes on a fixture doc containing a valid JSON block.'
  - CI step runs schema generation and diffs against committed schemas; fails if they diverge.
  documentation_requirements:
  - Add a brief note to docs/MANIFEST.md (or equivalent) listing docs/schemas/ as a generated artifact written only by the schema generation script.
  definition_of_done:
  - JSON Schema files generated and committed for all atlas.core models.
  - Doc linter v2 implemented and wired into CI.
  - Seeded bad fixture causes linter failure.
  - All tests pass under pytest.
