  - docs/decisions/0009-single-operator-governance.md
  acceptance_criteria:
  - The evaluator computes the SHA-256 hex digest of each criterion text (after .strip()) and looks for a human-tier MANUAL_APPROVAL evidence record at the head commit carrying that hash in raw_payload['acceptance_criterion_hash'].
  - The check returns PASSED only when every criterion has a matching human-tier confirmation at the head commit.
  - A blanket MANUAL_APPROVAL record (no acceptance_criterion_hash key) does not satisfy any criterion.
  - If any criterion lacks a confirmation, the evaluator returns PENDING (not FAILED — an unconfirmed criterion is unproven, not rejected).
  - The evaluator returns a typed CheckEvaluation listing which criteria are confirmed and which are pending.
  - 'Unit tests cover: all confirmed (PASSED), partial confirmation (PENDING), no confirmations (PENDING), blanket approval ignored.'
