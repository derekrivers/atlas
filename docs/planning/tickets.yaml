  key: ATLAS-76
  title: Documentation evidence ingestion
  objective: Implement ingestion of documentation change evidence by inspecting the PR file list for changes under docs/ and producing a DOCUMENTATION_UPDATE Evidence record listing the touched paths.
  context: evidence-pipeline.md specifies that Atlas inspects the PR file list; changes under docs/ produce a DOCUMENTATION_UPDATE record (PASSED) listing the touched paths. Tickets with documentation requirements and no such record will fail verification in Phase 7 — the evidence layer only records, it does not enforce. The PR file list is fetched via the GitHub client. This is a system-tier record pinned to the PR head commit SHA.
  status: done
  ticket_type: feature
  risk_level: low
  priority: 65
  relevant_docs:
  - docs/atlas/evidence-pipeline.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A normalise_pr_files(file_list, head_sha, ticket_key) function produces a DOCUMENTATION_UPDATE Evidence record with status PASSED when at least one file in file_list has a path starting with 'docs/'.
  - The raw_payload of the record contains a 'touched_docs_paths' key listing all docs/ paths found in the file list.
  - When no docs/ files are present in the file list, the function returns None and creates no record (absence of documentation evidence is not itself a FAILED record — the Verification Engine handles the absence).
  - The record is system-tier (created_by_type=system) with commit_sha=head_sha, external_run_id derived from the PR number and head_sha, and payload_hash over the canonical file list.
  - 'Dedup: if a record with the same (external_run_id, payload_hash) already exists, the function skips insertion.'
  - 'Unit tests cover: file list with docs/ files → DOCUMENTATION_UPDATE PASSED; file list with no docs/ files → None; dedup skip.'
  non_goals:
  - Fetching the PR file list from GitHub — the caller (poller/CLI) supplies it.
  - Enforcing documentation requirements or failing tickets without docs evidence — that is the Verification Engine.
  - Inspecting file content, only paths.
  - Tracking non-docs/ file changes.
  implementation_notes:
  - The docs/ prefix check should be a simple startswith('docs/') on the normalised path; no glob or regex needed for v1.
  - external_run_id for documentation evidence can be constructed as 'pr-{pr_number}-docs-{head_sha[:8]}' to be unique per PR head.
  test_requirements:
  - Unit tests for normalise_pr_files covering all cases.
  - Integration test confirming dedup behaviour.
  documentation_requirements:
  - Docstring on normalise_pr_files explaining that absence of docs/ files produces no record and that enforcement is the Verification Engine's responsibility.
  definition_of_done:
  - All unit and integration tests pass in CI.
  - No DOCUMENTATION_UPDATE record created when no docs/ files are present.
  - Dedup confirmed by test.
  estimated_effort: null
