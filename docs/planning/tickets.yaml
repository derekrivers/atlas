  key: ATLAS-72
  title: GitHub Checks/Workflow-Runs polling client
  objective: Implement a transport-agnostic GitHub polling client in atlas.github that fetches workflow runs and check runs for a PR head SHA, normalises raw API responses into a common payload shape, and handles ETags, rate-limit backoff, and deduplication.
  context: ADR-0008 mandates a pull-based transport for the MVP because a public webhook endpoint is not available. The evidence-pipeline.md design specifies that every tick the poller fetches workflow runs and check runs for tickets in pr_open, review_required, or changes_requested states, using conditional requests (ETags) to stay within rate limits and backing off on secondary-rate-limit responses. The client must be written transport-agnostic so a future HMAC-verified webhook receiver can replace polling with no schema change. This client is the boundary layer in atlas.github; the normaliser and evidence mappers are separate tickets.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 90
  relevant_docs:
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  - docs/atlas/evidence-pipeline.md
  acceptance_criteria:
  - GitHubClient in atlas/github/client.py exposes fetch_workflow_runs(repo, head_sha) and fetch_check_runs(repo, head_sha) returning typed response DTOs; a GitHubPRClient exposes fetch_pr_reviews(repo, pr_number).
  - 'Conditional GET requests use ETag headers: the client stores the last ETag per (repo, endpoint) and sends If-None-Match on subsequent calls; a 304 response returns the cached result without creating new evidence.'
  - On a secondary-rate-limit response (HTTP 429 or a Retry-After header), the client backs off for the indicated duration before retrying, up to a configurable maximum.
  - A fake/in-memory GitHubClient implementing the same protocol is provided for use in unit and integration tests, with no real network calls required.
  - The client is importable from atlas.github and does not import from atlas.evidence, atlas.planning, or any layer above atlas.github in the spine.
  - 'Unit tests cover: successful fetch returning typed DTOs; 304 returning cached result; 429 triggering backoff; network error raising a typed GitHubClientError.'
  non_goals:
  - Normalising raw API responses into Evidence records — that is the normaliser/mapper tickets.
  - Implementing the polling scheduler loop that calls the client on a cadence — that is the evidence CLI ticket.
  - Implementing webhook receiver support.
  - Fetching PR file lists — that is used by the documentation evidence ingestion ticket.
  implementation_notes:
  - Use Python stdlib urllib or httpx (already in the dependency tree if present); avoid adding a new HTTP library if one is already available.
  - ETag storage can be an in-memory dict keyed by (repo, endpoint) for the MVP; persistence across process restarts is a follow-up.
  - The DTO types should be simple dataclasses or Pydantic models in atlas.github.models.
  test_requirements:
  - Unit tests using the fake client covering all response scenarios (200, 304, 429, network error).
  - Import-linter check confirms atlas.github does not import from layers above it in the spine.
  - An opt-in live smoke test (ATLAS_LIVE_TESTS=1) exercises the real GitHub API against a known public repo and is skipped in default CI.
  documentation_requirements:
  - Module docstring in atlas/github/client.py explaining the transport-agnostic design and the ETag/backoff behaviour.
  definition_of_done:
  - All unit tests pass in CI with no real network calls.
  - Import-linter spine contract passes.
  - Fake client is usable as a drop-in for downstream tests.
  estimated_effort: null
