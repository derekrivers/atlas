  objective: Implement the Lesson Pydantic model in atlas.core with a status field defaulting to DRAFT for agent-authored lessons, enforcing the ADR-0009 lesson promotion gate so agent-written lessons are excluded from context retrieval until the operator promotes them to ACTIVE.
  context: 'ADR-0009 establishes that agent-authored lessons must be created with status DRAFT and are excluded from context-pack retrieval until the operator promotes them to ACTIVE. This is the single governance mechanism that prevents loop-poisoning: a bad agent-written lesson must not be injected into future context packs. The Lesson model is the only component that writes lessons; the Learning System (Phase 9) is the writer, but the model contract must be established here so the Context Renderer (Phase 5) can filter on status: ACTIVE without depending on Phase 9.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 80
