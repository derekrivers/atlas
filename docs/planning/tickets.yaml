  key: ATLAS-147
  title: 'Linear client hardening: error-body capture, timeout, rate-limit backoff'
  objective: Make LinearGraphQLClient failures diagnosable and rate-limited ticks back off until the window resets instead of retry-starving the budget.
  context: 'Inbox stub OP-8. The 2026-07-07 incident: the PM scheduler crash-looped for over an hour on an opaque HTTP 400. Linear returns rate-limit rejections as transport HTTP 400 with the RATELIMITED detail only in the discarded body. Each naive-interval retry burned ~110 requests before failing, pinning the budget at zero indefinitely. Two pre-existing debt-register findings land here: _execute uses urlopen with no timeout, and the error body is swallowed.'
  status: needs_human_decision
  ticket_type: tech_debt
  risk_level: high
  priority: 95
  relevant_docs:
  - docs/planning/inbox/inbox-stub-op8-linear-client-hardening.md
  - docs/atlas/pm-engine-and-linear-sync.md
  acceptance_criteria:
  - LinearAPIError raised from an HTTPError includes the HTTP status and the response body (truncated to a pinned max length) in its message; proven by a test injecting a fake HTTPError with a JSON body.
  - 'Every urlopen call in LinearGraphQLClient passes an explicit timeout from a single module-level constant; proven by a test asserting the call, and by grep: no bare urlopen(request) remains in atlas/linear/.'
  - A response whose GraphQL errors carry extensions.code == RATELIMITED raises a typed LinearRateLimitError (subclass of LinearAPIError) exposing the reset duration parsed from extensions.meta.rateLimitResult; a non-rate-limited 400 still raises plain LinearAPIError.
  - On LinearRateLimitError the scheduler waits until the parsed reset (capped by a pinned maximum) before the next tick, instead of retrying at the base interval; proven with a fake clock.
  - TickFailure recording and dedup behaviour for non-rate-limit errors is unchanged (existing tests still pass).
  non_goals:
  - No pull batching, comments-scan scoping, or per-tick request-count reduction — that is OP-9.
  - No LINEAR_STATE_MAP or workflow-state query changes.
  - No retry semantics beyond the rate-limit backoff.
  - No SDK adoption; the raw urllib client stays.
  implementation_notes:
  - The rate-limit backoff is in the scheduler (ATLAS-56), not in the client; the client raises LinearRateLimitError and the scheduler catches it.
  - The debt-register 'no timeout' finding should be updated to closed-by-this-ticket in the same change.
  test_requirements:
  - Unit tests with fake HTTP layers only (no live Linear calls; ATLAS_LIVE_TESTS=0 at CI parity).
  - At least one negative per new behaviour.
  - The rate-limit parse tested against the verbatim body captured in the 2026-07-07 incident.
  documentation_requirements:
  - Update docs/tech-debt/debt-register.md to close the 'no timeout' and 'error body swallowed' findings.
  definition_of_done:
  - All acceptance criteria evidenced by named tests.
  - Full gate sweep green.
  - Debt-register findings updated to closed in the same change.
  estimated_effort: null
