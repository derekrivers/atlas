  title: Acceptance test suite AT-1 through AT-7 against the seeded Atlas documents
  objective: Implement the full acceptance test suite AT-1..AT-7 as defined in the planning engine specification §7, running against the seeded Atlas documents in CI, covering both single-call and staged-generation paths.
  context: 'The planning engine specification §7 defines seven acceptance tests that constitute Milestone 1. AT-1: validity (all gates pass, acyclic DAG, every ticket traceable). AT-2: stability (two runs on unchanged docs yield empty or MODIFY-only diff with similarity ≥0.95). AT-3: locality (editing one section produces anchored diff). AT-4: immutability (in_progress/done ticket touched → CONFLICT, apply refuses). AT-5: provenance (PlanRun input_doc_shas match git tree; stale plan refused). AT-6: key authority (no model-minted keys; counter monotonic). AT-7: reference corpus coverage (anchor_coverage ≥ 0.50 AND unified exact∪content ≥ 0.80, containment-aware, citation excluded). AT-7 uses the implementation roadmap as the reference corpus.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
  priority: 35
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/atlas/planning-large-corpora.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  acceptance_criteria:
  - 'AT-1 passes: atlas plan on the seeded Atlas docs produces a proposal passing all seven gates with an acyclic DAG and every ticket having a valid source_anchor.'
  - 'AT-2 passes: two sequential atlas plan runs on unchanged docs produce a reconciled diff that is empty or contains only MODIFY entries with similarity ≥ 0.95 on free-text fields.'
  - 'AT-4 passes: a fixture with an in_progress ticket touched by the proposal surfaces as CONFLICT and atlas apply refuses it.'
  - 'AT-5 passes: a PlanRun''s input_doc_shas match the git tree at apply time; atlas apply refuses a plan after a doc edit.'
  - 'AT-6 passes: no key in any applied backlog originates from the model; the key counter is monotonic across archives.'
  - 'AT-7 passes: anchor_coverage ≥ ANCHOR_COVERAGE_FLOOR=0.50 AND unified (exact∪content) ≥ UNIFIED_COVERAGE_FLOOR=0.80 against the implementation roadmap, with containment-aware content coverage and citation excluded from the gate.'
  non_goals:
  - Do not implement AT-3 as an automated CI test (it requires a doc edit fixture; mark as manual or implement as a fixture-based test).
  - Do not implement AT-7 content-coverage bar pinning (ATLAS-124); report content_coverage but gate only on the exact-anchor floor and the 0.80 unified floor.
  - Do not implement the scripts/at7_miss_analysis.py offline tool in this ticket.
  implementation_notes:
  - AT-7 requires the anchor_coverage and content_coverage functions from the acceptance suite; implement them as standalone functions in atlas/planning/acceptance.py.
  - The Sørensen–Dice and containment functions must be the same implementations used by the reconciler (single implementation rule).
  - ANCHOR_COVERAGE_FLOOR=0.50 and UNIFIED_COVERAGE_FLOOR=0.80 are module constants.
  - AT-2 requires a model stub or a live model call; use a fixture stub for CI determinism.
  test_requirements:
  - 'AT-1: pytest test that runs atlas plan against fixture Atlas docs and asserts all gates pass.'
  - 'AT-2: pytest test that runs atlas plan twice and asserts the second diff is empty or MODIFY-only with similarity ≥ 0.95.'
  - 'AT-4: pytest test with a fixture backlog containing an in_progress ticket; assert CONFLICT and apply refusal.'
  - 'AT-5: pytest test that modifies a doc after plan and asserts apply refuses with stale-plan error.'
  - 'AT-6: pytest test that inspects all applied keys and asserts none were model-minted.'
  - 'AT-7: pytest test that computes anchor_coverage and unified coverage against the roadmap and asserts both floors.'
  documentation_requirements:
  - Document the AT-1..AT-7 test locations and how to run them in docs/runbooks/running-atlas-plan.md.
  definition_of_done:
  - All AT-1..AT-7 tests pass in CI against the seeded Atlas documents.
  - AT-7 reports both anchor_coverage and unified coverage with the floor constants visible in the test output.
  - The acceptance test suite is wired into the CI pipeline.
