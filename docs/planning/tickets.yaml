- id: 7814b4f1-3ee1-45fb-b7ec-447c0cc478e6
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: e0d47d14-bbd1-4d5d-96bc-f9e7adfeb3cf
  key: ATLAS-59
  title: 'Follow-up consumer: atlas plan reads inbox, atlas apply retires stubs'
  objective: 'Implement the consumer half of follow-up ingestion (ATLAS-122): atlas plan reads committed docs/planning/inbox/ stubs as a separate input source alongside the main corpus, and atlas apply moves applied or rejected stubs to docs/planning/inbox/processed/ after the plan is applied or rejected.'
  context: 'ATLAS-122 in the roadmap. The producer (ATLAS-45) writes stubs to the working tree; the operator commits them. The consumer closes the loop: atlas plan reads the committed inbox as a separate input document set (its own anchor index and input_doc_shas, distinct from the main corpus), and atlas apply retires stubs to processed/ idempotently. Follow-ups enter the backlog only through plan/apply (ADR-0007), never as direct ticket creation. An uncommitted stub is a typed dirty error (fail-closed). An empty inbox is a no-op.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 58
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/planning-engine-specification.md
  acceptance_criteria:
  - atlas plan reads committed docs/planning/inbox/ stubs (excluding processed/) as a separate input source; each stub is included in the anchor index and input_doc_shas.
  - An uncommitted stub in the inbox fails ingestion with a typed dirty error (fail-closed, consistent with the main corpus contract).
  - An empty inbox is a no-op; atlas plan proceeds normally.
  - atlas apply moves stubs that fed the applied or rejected plan to docs/planning/inbox/processed/ idempotently (the move is safe to repeat).
  - The staleness re-check in atlas apply step 2 includes inbox SHAs, so an inbox change between plan and apply reads as stale.
  - Follow-ups enter the backlog only through plan/apply; no direct ticket creation path exists.
  non_goals:
  - The producer that writes stubs (ATLAS-45, separate ticket).
  - Validating or parsing the follow-up content beyond including it as a document.
  - Automatically committing inbox stubs (operator's responsibility).
  - Any direct ticket creation from inbox stubs.
  implementation_notes:
  - The inbox glob is docs/planning/inbox/*.md (excluding processed/ subdir).
  - The move to processed/ is atomic (rename); if the destination already exists, skip (idempotent).
  - The inbox input source is distinct from the main corpus globs in the ingestion layer.
  - processed/ stubs are excluded from the inbox glob to avoid re-reading retired stubs.
  test_requirements:
  - 'Unit test: atlas plan with a committed stub includes it in input_doc_shas and the anchor index.'
  - 'Unit test: an uncommitted stub raises a typed dirty error.'
  - 'Unit test: an empty inbox produces no change to plan behaviour.'
  - 'Unit test: atlas apply moves stubs to processed/ after apply; re-running apply is idempotent.'
  - 'Unit test: a stub changed between plan and apply causes a stale-plan refusal.'
  documentation_requirements:
  - Update planning-engine-specification.md §2.1 inline reference to the inbox as a separate input source (if not already present).
  - Docstring on the inbox ingestion function documenting the fail-closed dirty-error contract.
  definition_of_done:
  - All unit tests pass in CI.
  - atlas plan with a fixture committed stub includes it in the plan run's input_doc_shas.
  - atlas apply moves the stub to processed/ and the move is idempotent.
  estimated_effort: null
