  key: ATLAS-37
  title: Critical path analysis
  objective: Implement `critical_path(graph)` in `atlas/dependencies/critical_path.py` that returns a typed `CriticalPath` of ordered `CriticalPathStep` objects representing the longest effort-weighted execution chain over non-terminal tickets.
  context: 'The critical path is computed over the subgraph of tickets not in a terminal status. Edge direction A→B means A depends_on B (B executes first), so the execution DAG reverses these edges. The longest path is weighted by `estimated_effort` (null counts as 1 at compute time only; the stored value is never mutated). Tie-breaking: greater downstream dependent count, then higher priority integer, then key order. Output is an ordered list of `CriticalPathStep` (ticket key, weighted effort, cumulative effort). An empty non-terminal subgraph returns an empty path. The result is advisory and never gates dispatch.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 80
  relevant_docs:
  - docs/atlas/dependency-engine.md
  - docs/atlas/implementation-roadmap.md
  - docs/decisions/0005-code-calculates-agents-interpret.md
  acceptance_criteria:
  - '`critical_path(graph)` returns a `CriticalPath` containing an ordered list of `CriticalPathStep` objects (key, effort_weight, cumulative_effort).'
  - The path is computed over the execution DAG (edges reversed from the depends_on direction) of non-terminal tickets only; terminal tickets are excluded.
  - null `estimated_effort` is weighted as 1 at compute time; the stored node attribute is never mutated.
  - 'Tie-breaking applies in order: greater downstream dependent count, then higher priority integer, then lexicographic key order — producing a deterministic result.'
  - An empty non-terminal subgraph returns a `CriticalPath` with an empty steps list, not an error.
  - 'Unit tests cover: a linear chain (verify execution order and cumulative effort), a branching graph (verify the longer branch is chosen), a graph with null efforts, and tie-breaking.'
