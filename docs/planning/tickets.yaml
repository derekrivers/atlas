  key: ATLAS-26
  title: 'Multi-call generation orchestration: environment-owned index assembly into one full-state proposal'
  objective: Implement the multi-call generation orchestrator that runs the three staged prompts in sequence, assembles environment-owned new_epic:<n> and new:<n> indices, and concatenates the stage outputs into one §3.11 full-state proposal for the existing parser, gates, and reconciler.
  context: ADR-0010 and planning-large-corpora.md §4/§4.1 define the orchestration. The environment assigns new_epic:<n> by stage-1 emission order and new:<n> by assembled position in stage-2. The assembled proposal is one §3.11 envelope passed unchanged to the existing parser. The orchestrator must handle per-stage truncation detection (ATLAS-101 logic per stage) and directed retry on projection-validation failure (up to 3 attempts, telling the model what it violated). The PlanRun records each stage's prompt_version, prompt_hash, and raw_output_hash in generation_stages.
  status: needs_human_decision
  ticket_type: feature
  risk_level: high
