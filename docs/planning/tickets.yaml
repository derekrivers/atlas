- id: e09e9a16-47c0-47eb-a451-3455fea651f6
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 4d034c8b-0752-4089-8ff9-2fd43f51c6f4
  key: ATLAS-176
  title: 'REJECTED is unmappable on a live Linear board: widen the accepted-type allowlist and fix the fixtures that hid it'
  objective: '`_ACCEPTED_TYPES[REJECTED]` admits every terminal-negative Linear state type the live board actually reports, so an operator can map Canceled and Duplicate; the preflight fixtures assert the live vocabulary rather than the vocabulary the code wants, so the suite can never again be green while the live board fails; and the documented known-gap paragraph is resolved in the same change.'
  context: 'Live finding, 2026-07-17, during Phase 9 closure smoke: `atlas preflight` C2 FAILED — `LINEAR_STATE_MAP maps state ''cd8e7c95-...'' (Linear type ''duplicate'') to ''rejected'', which only accepts Linear type(s) [''cancelled'']` — blocking dispatch. Root cause: `atlas/linear/ownership.py` pins `TicketStatus.REJECTED: frozenset({''cancelled''})` (British), while the live board reports `canceled` (US) for its Canceled state and `duplicate` for its Duplicate state. Consequence chain, verified at `fa97b8c`: (1) neither terminal-negative state can be mapped to `rejected`, so REJECTED is unreachable on a real board; (2) preflight C3 only demands uniqueness for `_WRITTEN_STATUSES`, which excludes REJECTED, so the ABSENCE of a rejected mapping is never flagged — only the attempt to add one is punished; (3) `sync.py` extracts lessons on DONE, and the `rejected` extraction path depends on tickets already holding `rejected` status, which a board-side cancellation can never produce — so one of the Learning System''s four extraction triggers (learning-system.md §Extraction triggers, trigger 2) is unreachable in the live environment. Why the 1885-test suite is green while the board fails: `tests/test_preflight.py` builds its fixtures as `WorkflowState(''state-canceled'', ''Canceled'', ''cancelled'')` and `WorkflowState(''state-duplicate'', ''Duplicate'', ''cancelled'')` — every terminal-negative state faked to the spelling the code demands — while `tests/test_pm_sync.py:105` uses `type=''canceled''`. Two test files disagree about the external system''s vocabulary and the preflight suite asserts the fiction. This gap was flagged during ATLAS-148 and carried; ATLAS-155 scoped the fix and was REJECTED before implementation. Its extracted lesson (af5799f7, promoted ACTIVE at confidence 1.0 on 2026-07-17) states the generalisation that came true: validation allowlists hardcoding a single spelling variant of an external system''s enum will silently diverge from the live system and block dependent workflows; known gaps flagged for follow-up but not resolved accumulate into blocking defects. Pre-ruled decisions: D-1 widen `_ACCEPTED_TYPES[REJECTED]` to `frozenset({''canceled'', ''duplicate''})` — VERIFIED against the live board on 2026-07-17 via `workflowStates { name type }`, which returns exactly `Canceled -> ''canceled''` and `Duplicate -> ''duplicate''` on every team in the workspace; the existing `''cancelled''` (British) entry is dropped, not retained: no Linear instance has ever emitted it, it is the unverified guess that caused this defect, and keeping it would preserve the fiction the ticket exists to delete (OP-x if the operator prefers retention for other trackers — the fork is recorded, the recommendation is deletion). Do not widen any other status''s row. D-2 the fixture lie is the root cause and is fixed in the same change: `tests/test_preflight.py` fixtures assert the LIVE spellings, not the convenient ones; if a fixture and the live board disagree, the fixture is wrong. D-3 the two test files share one vocabulary — reconcile `test_pm_sync.py` and `test_preflight.py` on the same type strings. D-4 `_ACCEPTED_TYPES` remains a contradiction check, not a 1:1 oracle (its existing docstring contract is unchanged); this ticket widens one row, it does not redesign the mechanism. D-5 the `Known gap, flagged for follow-up` paragraph in `pm-engine-and-linear-sync.md` is resolved in this change, documenting the admitted spellings and why. D-6 REJECTED is NOT added to `_WRITTEN_STATUSES` — Atlas never writes it (ADR-0006 status direction); C3''s scope is unchanged.'
  status: done
  ticket_type: bug
  risk_level: low
  priority: 50
  relevant_docs:
  - docs/planning/inbox/processed/inbox-stub-rejected-accepted-types.md
  acceptance_criteria:
  - '`_ACCEPTED_TYPES[REJECTED]` is exactly `frozenset({''canceled'', ''duplicate''})`, and `validate_against_states` passes for a Canceled-state entry (`type=''canceled''`) and a Duplicate-state entry (`type=''duplicate''`) mapped to `rejected`.'
  - 'Negative retained: a `completed`-type or `started`-type state mapped to `rejected` still raises `LinearStatusMapError` — the contradiction check still bites.'
  - '`tests/test_preflight.py` fixtures use the live type spellings; the fixture change alone, applied against the unfixed allowlist, makes the preflight suite FAIL (prove the fixtures were hiding the defect — seed the probe with `assert 1 == 2`, B011).'
  - '`tests/test_pm_sync.py` and `tests/test_preflight.py` use the same type strings for the same Linear state kinds; no other status row''s accepted set changes.'
  - '`pm-engine-and-linear-sync.md`''s known-gap paragraph is resolved in the same change, naming the admitted spellings and the reason.'
  non_goals:
  - No redesign of `_ACCEPTED_TYPES` or of the contradiction-check contract. No change to C3's `_WRITTEN_STATUSES` (Atlas never writes REJECTED). No change to the status direction or ADR-0006. No new preflight check. No changes to the extraction triggers themselves — trigger-2 reachability is a consequence of this fix, not scope.
  implementation_notes: []
  test_requirements:
  - Fixture-driven, `ATLAS_LIVE_TESTS=0`; seeded defects use `assert 1 == 2` (B011); enumeration pins hold; full gate sweep green.
  documentation_requirements: []
  definition_of_done:
  - All acceptance criteria evidenced by named tests; `atlas preflight` passes C2 against a live map containing the Duplicate entry (operator-verified post-merge and recorded on the ticket); full gate sweep green; PR title carries the minted key.
  estimated_effort: null
