  key: ATLAS-107
  title: Code-quality debt register entity (ATLAS-117, gated on first sensor)
  objective: Define and implement the code-quality debt register as a distinct entity (not DebtItem, not table debt_items) per ADR-0011 D2, introduced when the first debt-recording sensor ships, with its own taxonomy and storage layer.
  context: ADR-0011 D2 specifies that the code-quality technical-debt register returns as a distinct entity — not named DebtItem, not the table debt_items — when the first steal-list sensor ships (mutation/coverage, duplication or large-file, KB-freshness, or architecture fitness). The entity is a named precondition of the first such sensor. ADR-0011 also notes that learning-system.md's pattern detection over the same DebtItem category must re-point at this reintroduced register, not at the delivery anomaly's anomaly_type. The import-linter sensor (ATLAS-114) already shipped and does NOT count as it gates rather than records. This ticket defines the entity, its taxonomy, and its storage, ready for the first recording sensor to write to it.
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 80
  relevant_docs:
  - docs/decisions/0011-debtitem-denotes-delivery-anomalies.md
  - docs/atlas/learning-system.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - A new Pydantic model for the code-quality debt entity is defined in `atlas/core/models.py` (or equivalent), distinct from DebtItem and not using the `debt_items` table.
  - 'The model has its own taxonomy (e.g. `CodeQualityCategory` enum: `test_coverage`, `duplication`, `large_file`, `stale_docs`, `security`, `performance`, `architecture`, `dependency`) separate from DebtItem''s anomaly_type.'
  - A new SQLAlchemy table and Alembic migration are created for the entity.
  - A repository class provides `add` and `list` methods for the entity.
  - 'The entity is `created_by_type: system` and append-only (no update or delete).'
  - The pattern detection module in the learning system can query this entity by category for pattern detection.
  - JSON Schema is regenerated to include the new entity.
  non_goals:
  - Implementing any sensor that writes to the register — this ticket defines the entity only; sensors are separate tickets.
  - Renaming DebtItem or the debt_items table.
  - Migrating existing DebtItem rows to the new entity.
  - UI or dashboard for the register.
  implementation_notes:
  - Name the entity `CodeQualityDebtItem` and the table `code_quality_debt_items` to be unambiguous.
  - The taxonomy enum is defined in `atlas/core/enums.py` alongside other enums.
  - The Alembic migration must not touch the `debt_items` table.
  - The pattern detection module queries this entity only when it exists (graceful absence handling for environments where no sensor has written yet).
  test_requirements:
