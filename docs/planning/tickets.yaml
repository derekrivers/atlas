- id: 6537ed61-70c6-4618-972f-fefd19f91ca8
  product_id: 6363ff3f-22db-40b3-9a47-aeba5d0a7586
  epic_id: 29e04b28-877b-4112-9706-73423855c3d8
  key: ATLAS-7
  title: Shared types and enums
  objective: Define and implement all canonical enums and shared primitive types in atlas.core that every other layer imports, including ActorType, EntityStatus, RiskLevel, EvidenceStatus, TicketStatus, TicketType, and the trust-tier derivation logic per ADR-0008.
  context: The Knowledge Core epic establishes atlas.core as the single contract for all Atlas entities. Before any model can be defined, the shared enumerations and primitive types must exist. These types are referenced by every model in the system and must never be redefined in higher layers. The trust-tier derivation (system > human > agent, with agent capped at PENDING) is specified in ADR-0008 and must be implemented here as a pure function so the Evidence model and storage layer can enforce it without importing from higher layers.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 100
  relevant_docs:
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  - docs/decisions/0009-single-operator-governance.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - docs/decisions/0001-use-python-for-atlas-platform.md
  acceptance_criteria:
  - 'ActorType enum exists with values: system, human, agent.'
  - 'EntityStatus enum exists covering at minimum: draft, active, archived.'
  - 'RiskLevel enum exists with values: low, medium, high, critical.'
  - 'EvidenceStatus enum exists with values: pending, passed, failed, warning, not_applicable.'
  - TicketStatus enum exists covering all states in the state-mapping table (backlog, planned, blocked, ready_for_agent, in_progress, pr_open, review_required, changes_requested, needs_human_decision, done, rejected).
  - 'TicketType enum exists with values: feature, bug, tech_debt, spike, documentation, infrastructure, research.'
  - 'A pure function derive_trust_tier(actor_type: ActorType) -> TrustTier exists and returns the correct tier; agent-submitted evidence is capped at PENDING by a separate pure function cap_evidence_status(actor_type, requested_status) -> EvidenceStatus.'
  non_goals:
