  - The orchestrator runs stage 1 (epics), assigns new_epic:<n> indices by emission order, and passes the indexed list to stage 2.
  - The orchestrator runs stage 2 once per epic, assigns new:<n> indices by assembled position across all batches, and passes the full indexed ticket list to stage 3.
  - The orchestrator runs stage 3 (dependencies) and assembles the final §3.11 proposal envelope.
  - A stage that returns stop_reason:max_tokens is recorded as a truncation failure naming the stage; the run fails honestly.
  - 'Directed retry on projection-validation failure: up to 3 attempts per stage, the model told what it violated; truncation and json-decode errors do not retry.'
  - The assembled proposal is passed unchanged to the existing parser, gates, and reconciler.
  non_goals:
  - Do not modify the parser, gates, or reconciler.
  - Do not implement re-plan seeding with existing backlog (ATLAS-144).
  - Do not implement batch-sizing heuristics beyond one epic per stage-2 call.
  implementation_notes:
  - 'The orchestrator is a pure function: stage_outputs_in, assembled_proposal_out, no I/O beyond model calls.'
  - 'Index assignment is deterministic: new_epic:<n> by list position from stage 1, new:<n> by list position in the concatenated stage-2 batches.'
  - Each stage's (prompt_version, prompt_hash, raw_output_hash) must be returned for PlanRun generation_stages recording.
  test_requirements:
  - 'Integration test with fixture model stubs for all three stages: verify the assembled proposal has correct new_epic:<n> and new:<n> references.'
  - Unit test that a stage-1 truncation produces a typed failure naming stage 1.
  - Unit test that directed retry is attempted up to 3 times on a projection-validation failure and then fails.
  - Unit test that the assembled proposal JSON is valid §3.11 structure.
  documentation_requirements:
  - Docstring on the orchestrator function describing the index assignment rules and the assembly order.
  definition_of_done:
