  - All call sites that previously used a local or planning-module natural-key helper are updated to import from `atlas.core`.
  - No module under `atlas.dependencies` imports from `atlas.planning` — verified by a grep/import scan in the test suite.
  - All existing tests pass without modification to test logic (only import paths change).
  - A new unit test confirms the consolidated `natural_key` function produces the expected sort order for a representative set of keys (e.g. ATLAS-1, ATLAS-2, ATLAS-10, ATLAS-E1).
  non_goals:
  - Do not install or configure import-linter — that is the next ticket.
  - Do not move any other shared utilities beyond the natural-key helper.
  - Do not change the behaviour of the natural-key sort, only its location.
  - Do not refactor any other import inversions beyond the dependencies→planning cycle identified in the Phase 3 closure report.
  implementation_notes:
  - The natural-key helper likely lives in `atlas/planning/` or is duplicated between `atlas/planning/` and `atlas/dependencies/`; locate all copies before moving.
  - The canonical destination is `atlas/core/` — a new module such as `atlas/core/keys.py` is appropriate if one does not already exist.
