  objective: Implement `validate_graph(graph)` that checks the dependency DiGraph for acyclicity, self-edges, duplicate edges, dangling polymorphic targets, and terminal-to-non-terminal depends_on edges, raising typed errors on any violation.
  context: Validation must run on every graph build and on every dependency mutation. Any failure is a typed error; `atlas apply` and the PM Engine refuse to proceed on an invalid graph. Acyclicity failures must report the full cycle path. Dangling targets (present=False nodes) are a hard error that blocks readiness computation. The validation function is the gate that readiness, critical-path, and blocker analyses run after — they consume an already-validated graph. The TERMINAL_STATUSES constant defined here is the single source used by all analyses.
  status: done
