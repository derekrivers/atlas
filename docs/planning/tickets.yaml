  key: ATLAS-23
  title: '`atlas apply` CLI command: diff review, confirmation, render writes, and PlanRun finalisation'
  objective: Implement the atlas apply CLI command that loads the most recent proposed PlanRun, checks for staleness, presents the diff for operator confirmation, assigns keys to ADD items, writes planning renders, regenerates roadmap.mmd, and finalises the PlanRun to status:applied.
  context: 'The planning engine specification §2.2 defines the full atlas apply flow. Apply must: load the latest proposed PlanRun, refuse if input doc SHAs no longer match (stale plan), display the diff and require explicit confirmation (interactive y/N or --yes), assign keys atomically, write docs/planning/epics.yaml, tickets.yaml, dependencies.yaml, and roadmap.mmd, then finalise the PlanRun. The DB commit (counter increment + backlog rows + finalising transition) is the single linearisation point; renders are written to temp files and atomically moved after the commit. Milestone 1 apply materialises ADD items only; MODIFY and PROPOSE_ARCHIVE are excluded from renders; a diff containing MODIFY is refused.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 65
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  acceptance_criteria:
  - atlas apply refuses with a typed error if no proposed PlanRun exists.
  - atlas apply refuses with a typed error if fresh ingestion yields input doc SHAs that differ from the recorded input_doc_shas (stale plan).
  - atlas apply requires explicit confirmation (interactive y/N or --yes); with neither a TTY nor --yes it refuses rather than assuming consent.
  - The DB commit (key counter increment + backlog rows + PlanRun finalisation) is atomic in one transaction.
  - Renders are written to temp files and atomically moved into docs/planning/ only after the DB commit succeeds.
  - A diff containing MODIFY entries is refused (not applied with invented semantics).
  - A diff touching a frozen ticket (CONFLICT) is refused.
  non_goals:
  - Do not implement MODIFY application (deferred per §8).
  - Do not implement PROPOSE_ARCHIVE application (items are excluded from renders, not deleted).
  - Do not implement Linear writes.
  - Do not implement the follow-up inbox processed/ move (that is a separate consumer ticket).
  implementation_notes:
  - Use Python's os.replace() for atomic file moves.
  - The Mermaid DAG render (roadmap.mmd) reuses the renderer from atlas/planning/mermaid.py.
  - Rejecting a diff sets PlanRun status to rejected.
  test_requirements:
  - 'Integration test: a valid proposed PlanRun with only ADD entries is applied; renders are written; PlanRun is finalised to applied.'
  - 'Unit test: stale plan detection refuses apply when a doc SHA has changed.'
  - 'Unit test: a diff with MODIFY entries is refused.'
  - 'Unit test: a diff with CONFLICT entries is refused.'
  - 'Unit test: without --yes and without a TTY, apply refuses.'
  - 'Unit test: a crash after DB commit but before render move is repaired by re-running apply.'
  documentation_requirements:
  - Update CLI --help and docs/runbooks/ to describe atlas apply usage, the staleness check, and the atomicity guarantee.
  definition_of_done:
  - All integration and unit tests pass in CI.
  - Running atlas apply after a successful atlas plan produces correct YAML renders and a finalised PlanRun.
  - A simulated crash after DB commit is repaired by re-running apply.
  estimated_effort: null
