  key: ATLAS-58
  title: 'Historical cycle time upgrade: compute from TicketStatusTransition log'
  objective: Upgrade atlas pm report to compute true historical per-state cycle time from the TicketStatusTransition log (ATLAS-121), replacing the current-dwell proxy, by aggregating completed episodes (state entry to exit) into min/median/max hours per state across all tickets.
  context: ATLAS-126 in the roadmap. Once TicketStatusTransition rows exist (from the state-transition history ticket), the delivery report can compute true historical cycle time rather than the current-dwell proxy. A completed episode is a pair of consecutive transitions (T_i, T_{i+1}) for a ticket; the duration is T_{i+1}.transitioned_at - T_i.transitioned_at. The current open episode (no exit) is excluded. This ticket upgrades build_delivery_report to use the log; it depends on the TicketStatusTransition model being in place.
  status: needs_human_decision
  ticket_type: feature
  risk_level: low
  priority: 55
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - build_delivery_report computes per-state cycle time from TicketStatusTransition completed episodes (min/median/max hours, episode count) rather than current-dwell proxy.
  - A completed episode is a consecutive transition pair (T_i, T_{i+1}); duration = T_{i+1}.transitioned_at - T_i.transitioned_at.
  - The current open episode (last transition with no subsequent exit) is excluded from aggregation.
  - A state re-visited N times contributes N episodes to the aggregation.
  - States with no completed episodes do not appear in the output.
  - The computation is deterministic timestamp subtraction (ADR-0005); no LLM calls.
  non_goals:
  - Cycle time for the current open episode (excluded by design).
  - Percentile breakdowns beyond min/median/max (follow-up if needed).
  - Backfilling historical transitions for tickets created before the model existed.
  implementation_notes:
  - Read TicketStatusTransitionRepo.for_ticket for each ticket; pair consecutive rows to form episodes.
  - Aggregate durations per to_status (the state entered at T_i) across all tickets.
  - statistics.median over a list of float hours; handle single-episode states (median = that value).
  test_requirements:
  - 'Unit test: a fixture transition log with known durations produces correct min/median/max per state.'
  - 'Unit test: a state visited twice contributes two episodes.'
  - 'Unit test: the current open episode is excluded.'
  - 'Unit test: a state with no completed episodes is absent from the output.'
  - 'Regression test: the upgraded report produces the same throughput, ready-queue, and anomaly outputs as before.'
  documentation_requirements:
  - Update docstring on build_delivery_report to reflect the transition-log source.
  - Note in CLI help that cycle time requires TicketStatusTransition rows (populated after the state-transition model lands).
  definition_of_done:
  - All unit tests pass in CI.
  - atlas pm report on a fixture database with transition rows shows correct historical cycle time.
  - Regression tests confirm other report metrics are unchanged.
  estimated_effort: null
