  key: ATLAS-2
  title: Initialise Python project with uv, pytest, ruff, mypy, and pre-commit
  objective: Set up the Python project toolchain so that tests, linting, and type-checking can run locally and in CI from a single `uv sync` invocation.
  context: ADR-0001 mandates Python 3.11+ as the implementation language. The bootstrap guide specifies uv as the package manager, with pytest, ruff, mypy, and pre-commit as the dev toolchain. This ticket creates pyproject.toml, uv.lock, and the pre-commit configuration so the project is runnable before any application code exists.
  status: done
  ticket_type: infrastructure
  risk_level: low
  priority: 90
  relevant_docs:
  - docs/atlas/bootstrap-guide.md
  - docs/decisions/0001-use-python-for-atlas-platform.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - '`uv sync` completes without error on a fresh clone.'
  - '`uv run pytest` exits 0 (even with zero tests collected).'
  - '`uv run ruff check .` exits 0 on the initial codebase.'
  - '`uv run mypy atlas/` exits 0 (or with only missing-stub warnings, not errors).'
  - pre-commit hooks are configured and `pre-commit run --all-files` passes.
  - uv.lock is committed to the repository.
  - Python version is pinned to 3.11+ in pyproject.toml.
  non_goals:
  - Installing Typer, Rich, or any application-layer dependency — those arrive with the CLI ticket.
  - Configuring import-linter (that is Phase 3.5).
  - Writing any application code or tests beyond a placeholder.
  - CI pipeline configuration — that is a separate ticket.
  implementation_notes:
  - Use `uv init` or hand-author pyproject.toml; commit uv.lock.
  - Typer and Rich are NOT Phase 0 dependencies per the bootstrap guide.
  - Pydantic, PyYAML, NetworkX, SQLAlchemy, Alembic, and Jinja2 are the runtime stack but only need to be listed if they are needed by Phase 0 code; otherwise defer to the phase that first uses them.
  - The atlas/ package must have an __init__.py so mypy can find it.
  test_requirements:
  - A trivial test file (tests/test_smoke.py) with one passing assertion confirms pytest is wired correctly.
  - Pre-commit configuration includes ruff and mypy hooks.
  documentation_requirements: []
  definition_of_done:
  - pyproject.toml and uv.lock are committed.
  - All four tool invocations (pytest, ruff, mypy, pre-commit) pass on a clean checkout.
  - The pre-commit config is committed as .pre-commit-config.yaml.
  estimated_effort: null
