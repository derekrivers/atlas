  key: ATLAS-19
  title: Proposal parsing and validation gates 1–7
  objective: Implement the proposal parser that extracts the JSON proposal from raw model output (tolerating markdown fences and surrounding prose), and the seven validation gates that must all pass before a diff is presented.
  context: 'The planning engine specification §2.1 and §5 define the parser and gates. The parser must tolerate a surrounding markdown code fence or leading/trailing prose, extracting the embedded JSON object; raw_output_hash is over the true raw output. Gates are: (1) schema validity via Pydantic, (2) dependency DAG acyclicity, (3) all dependency targets resolve, (4) every ticket has ≥1 acceptance criterion and a source_anchor resolving to a real heading, (5) no orphan epics and no epic-less tickets unless tech_debt, (6) key integrity (no non-null keys absent from current backlog), (7) size guard (≤7 acceptance criteria, ≤10 dependencies per ticket). A gate failure records a failed PlanRun with a machine-readable failure_reason.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 85
  relevant_docs:
  - docs/atlas/planning-engine-specification.md
  - docs/decisions/0007-generative-planning-with-deterministic-reconciliation.md
  acceptance_criteria:
  - The parser extracts the JSON object from raw output that includes a surrounding markdown code fence or leading/trailing prose.
  - raw_output_hash is computed over the true raw output string before any extraction.
  - Gate 1 (schema validity) rejects a proposal that fails Pydantic validation with a typed failure reason.
  - Gate 4 rejects any ticket whose source_anchor does not resolve to a real heading in the anchor index at the recorded SHA.
  - Gate 6 rejects any proposal item carrying a non-null key that is absent from the current backlog.
  - Gate 7 rejects any ticket with more than 7 acceptance criteria or more than 10 dependencies.
  - Each gate failure produces a machine-readable failure_reason string identifying the gate number and the offending item.
  non_goals:
  - Do not implement the reconciler (that is a separate ticket).
  - Do not implement PlanRun persistence (that is a separate ticket).
  - Do not implement the LLM call or prompt rendering.
  implementation_notes:
  - Use a string/escape-aware brace-scan extractor (not regex) to find the outermost JSON object, consistent with ATLAS-108's fence-tolerant parsing requirement.
  - Gates 2 and 3 require a projected dependency graph; use NetworkX for acyclicity check.
  - Gate failures should be collected per-item where possible so the operator sees all violations, not just the first.
  test_requirements:
  - 'Unit test for each gate: a fixture proposal that violates exactly that gate fails with the correct failure_reason.'
  - Unit test that a proposal wrapped in a markdown fence is parsed correctly and raw_output_hash matches the fenced string.
  - Unit test that a proposal with all gates passing returns a validated Proposal object.
  - Unit test that gate 4 fails when an anchor is not in the index.
  documentation_requirements:
  - Docstrings on each gate function describing what it checks and what failure_reason it emits.
  definition_of_done:
  - All unit tests pass in CI.
  - A fixture proposal with a known gate violation fails at the correct gate.
  - A valid fixture proposal passes all seven gates and returns a Proposal object.
  estimated_effort: null
