  key: ATLAS-34
  title: Estimated effort population for tickets
  objective: Add `estimated_effort` to the Ticket model and implement `TicketRepo.set_estimated_effort` as the single writer of this field, with typed validation errors for invalid values and an explicit null-clear path.
  context: 'The critical-path analysis requires `estimated_effort` on tickets. This field is operator-supplied and NEVER computed. `atlas apply` inserts every ticket with the field null; the operator supplies it out-of-band through `TicketRepo.set_estimated_effort`. The setter must accept a positive integer (>= 1) or null (to clear), reject <= 0 with a typed `EffortValidationError`, and reject an unknown key with `TicketNotFoundError`. The setter deliberately does NOT bump `updated_at` to avoid triggering spurious Linear definition re-pushes in Phase 4. This per-field ownership partition is a durable invariant: `atlas apply` owns doc-sourced definition fields; the operator owns `estimated_effort`.'
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 90
  relevant_docs:
  - docs/atlas/dependency-engine.md
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/planning-engine-specification.md
  acceptance_criteria:
  - '`Ticket` model and `tickets` table carry an `estimated_effort` column (nullable integer); `atlas apply` inserts every ticket with the field null.'
  - '`TicketRepo.set_estimated_effort(key, effort)` accepts a positive integer (>= 1) and persists it; it also accepts null to clear a prior value.'
  - Calling `set_estimated_effort` with effort <= 0 raises a typed `EffortValidationError` without persisting anything.
  - Calling `set_estimated_effort` with an unknown key raises `TicketNotFoundError`.
  - '`set_estimated_effort` does NOT update the ticket''s `updated_at` timestamp.'
  - An Alembic migration adds the column to the existing `tickets` table with a null default.
  - 'Unit tests cover: set a valid effort, clear with null, reject <= 0, reject unknown key, confirm updated_at is unchanged.'
  non_goals:
  - Computing or inferring effort from acceptance-criteria count, risk, or any other heuristic.
  - Exposing effort via the CLI — that is the dependency CLI ticket.
  - Syncing estimated_effort to Linear.
  implementation_notes:
  - The setter is the SINGLE writer of this column; `atlas apply`'s materialise path must omit the field so it defaults to null on INSERT.
  - Any future MODIFY-apply path must patch only doc-sourced definition columns and leave `estimated_effort` untouched.
  - EffortValidationError and TicketNotFoundError should be typed exceptions in `atlas.storage` or `atlas.core`.
  test_requirements:
