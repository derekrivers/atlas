  context: 'A ticket is ready exactly when: (1) status is `planned` or `backlog`; (2) every depends_on ticket target has status `done`; (3) every depends_on ADR target has status `accepted`; (4) the ticket has >= 1 acceptance criterion; (5) no dependency target is missing (dangling). The function reads node attributes from the already-validated graph only — never storage. `ReadinessResult.ready` is derived from the reasons list so it can never contradict them. Each failure is a `NotReadyReason` with a machine `NotReadyCode`. Readiness does not require a rendered context pack. This predicate is consumed by the PM Engine in Phase 4.'
