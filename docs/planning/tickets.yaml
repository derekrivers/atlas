  key: ATLAS-71
  title: Evidence schema with trust fields and append-only enforcement
  objective: Extend the Evidence model with commit_sha, external_run_id, payload_hash, and created_by_type trust-tier fields, and enforce append-only semantics at the repository layer so agent-submitted records are capped at PENDING.
  context: ADR-0008 mandates that evidence records carry commit_sha, external_run_id, and payload_hash, and that the creating actor's trust tier determines the maximum status an evidence record may hold. System-tier records (CI ingestion) may carry any status; agent-tier records are capped at PENDING regardless of the submitted value. The Evidence model was introduced in Phase 1 (ATLAS-14) with basic fields; this ticket adds the trust-tier fields and enforces the append-only and capping rules at the EvidenceRepo layer. The Verification Engine (Phase 7) depends on these semantics being correct and auditable.
  status: done
  ticket_type: feature
  risk_level: high
  priority: 100
  relevant_docs:
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  - docs/atlas/evidence-pipeline.md
  acceptance_criteria:
  - Evidence model carries commit_sha (required string), external_run_id (required string), payload_hash (required string), and created_by_type (ActorType enum) fields with non-null constraints enforced at the Pydantic and SQLAlchemy layers.
  - EvidenceRepo.add rejects any system-tier record missing commit_sha, external_run_id, or payload_hash with a typed validation error.
  - EvidenceRepo.add caps any agent-tier record's status at PENDING regardless of the submitted status value, and records the original submitted value in raw_payload for auditability.
  - EvidenceRepo.add never updates or deletes existing rows; every call inserts a new row, and a uniqueness constraint on (external_run_id, payload_hash) is enforced at the DB layer to prevent exact duplicates.
  - An Alembic migration adds the new columns to the evidence table with appropriate NOT NULL constraints and defaults for existing rows.
  - 'Unit tests cover: system-tier record accepted with all required fields; system-tier record rejected when any of the three required fields is missing; agent-tier PASSED record stored as PENDING; append-only insert verified by confirming row count increases on re-insert of same logical evidence.'
  non_goals:
  - Implementing the GitHub polling client or any CI ingestion logic — that is a separate ticket.
  - Implementing the Verification Engine rules that consume evidence — that is Phase 7.
  - Adding webhook receiver support — polling is the MVP transport per ADR-0008.
  - Changing the Evidence model fields introduced in Phase 1 beyond the additions specified here.
  implementation_notes:
  - The trust-tier cap logic belongs in EvidenceRepo.add, not in the Pydantic model, so the raw submitted status is preserved in raw_payload before capping.
  - Use a DB-level unique constraint on (external_run_id, payload_hash) as the dedup guard; the application layer should catch IntegrityError and treat it as a no-op rather than an error.
  - created_by_type should reuse the existing ActorType enum from atlas.core.
  test_requirements:
  - Unit tests for EvidenceRepo.add covering all trust-tier capping and required-field rejection cases.
  - 'Migration smoke test: apply migration on a fresh SQLite DB and confirm all new columns exist with correct types.'
  - 'Round-trip test: create a system-tier evidence record, read it back, confirm all fields match.'
  documentation_requirements:
  - Docstring on EvidenceRepo.add explaining the trust-tier capping rule and the required-field enforcement for system-tier records.
  definition_of_done:
  - Migration applied cleanly on SQLite; all new fields present.
  - All unit tests pass in CI.
  - EvidenceRepo.add enforces trust-tier capping and required-field rejection as specified.
  - No existing Phase 1 evidence tests are broken.
  estimated_effort: null
