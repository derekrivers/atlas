  key: ATLAS-3
  title: 'Add CI pipeline: tests, lint, and type-check on every PR'
  objective: Configure GitHub Actions to run pytest, ruff, and mypy automatically on every pull request so that CI is the system-tier evidence producer from Phase 0 onward.
  context: 'ADR-0008 designates CI as the system-tier evidence producer; a repository must have CI configured before any ticket in it can be verified. The implementation roadmap lists this as ATLAS-3 and the Phase 0 milestone test requires CI to be green. The bootstrap guide §15 lists ''Add CI: tests, lint, type-check on every PR'' as a day-one checklist item.'
  status: done
  ticket_type: infrastructure
  risk_level: medium
  priority: 80
  relevant_docs:
  - docs/atlas/bootstrap-guide.md
  - docs/atlas/implementation-roadmap.md
  - docs/decisions/0008-ci-sourced-evidence-with-trust-tiers.md
  acceptance_criteria:
  - A GitHub Actions workflow file exists at .github/workflows/ci.yml.
  - The workflow triggers on pull_request and push to main.
  - The workflow runs `uv run pytest` and fails the build on test failure.
  - The workflow runs `uv run ruff check .` and fails the build on lint errors.
  - The workflow runs `uv run mypy atlas/` and fails the build on type errors.
  - The workflow passes on the current codebase (green on first run).
  - 'CI job names follow the evidence-pipeline job-name convention (prefix: test, lint, build) so evidence typing works in Phase 6.'
  non_goals:
  - Coverage reporting or coverage thresholds — deferred to Phase 6.
  - The doc linter CI step — that is added in the doc linter ticket.
  - Deployment or release workflows.
  - Matrix builds across multiple Python versions (single version is sufficient for Phase 0).
  - Caching uv dependencies (nice-to-have, not required for green CI).
  implementation_notes:
  - Use the official uv GitHub Action or install uv via pip in the workflow.
  - Job names must use recognised prefixes (test, lint) per evidence-pipeline.md job-name convention table so Phase 6 evidence ingestion types them correctly without heuristics.
  - Pin the Python version in the workflow to match pyproject.toml.
  test_requirements:
  - Open a test PR with a deliberate ruff violation and confirm CI fails.
  - Open a test PR with a deliberate mypy error and confirm CI fails.
  - Confirm the workflow passes on the main branch after merging the skeleton and Python setup tickets.
  documentation_requirements:
  - The workflow file is self-documenting via job names; no additional doc required at this stage.
  definition_of_done:
  - CI is green on the main branch.
  - A PR with a deliberate lint error causes CI to fail.
  - The workflow file is committed under .github/workflows/.
  estimated_effort: null
