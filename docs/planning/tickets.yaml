  title: Agent metrics CLI report
  objective: Implement atlas agent report, a CLI command that reports per-ticket agent run metrics — attempt counts, cycle times from Ready for Agent to PR Open, outcome distribution, and failure pattern summaries — computed deterministically from AgentRun records and DebtItems.
  context: 'The PM Engine accumulates AgentRun records and DebtItems across the delivery loop. A CLI report surfaces agent-level delivery health: how many attempts tickets required, how long agents took to open PRs, how often review cycling occurred, and which failure patterns are most common. Per ADR-0005, all metrics are computed by deterministic code; the report is a pure reader with no Linear calls and no writes. The roadmap seeds this as ATLAS-88.'
