  key: ATLAS-90
  title: 'Verification CLI: atlas verify command'
  objective: Implement the atlas verify --pr <N> --repo <OWNER/REPO> CLI command that resolves the PR head commit and changed files from GitHub, runs evaluate_pr, persists VerificationCheck records, and prints the per-ticket/per-check verdict report.
  context: The verification CLI is the operator-facing entry point for Phase 7. It resolves the PR head commit and file list from GitHub, resolves which tickets the PR closes (from the PR title ATLAS-NN key, with --tickets override), reads stored evidence, runs the pure evaluate_pr, persists the results as append-only VerificationCheck rows, and prints the report. Exit code is 0 for any verdict (PASSED/PENDING/FAILED) — only precondition failures are non-zero. The command is non-interactive and writes no evidence.
  status: needs_human_decision
  ticket_type: feature
  risk_level: medium
  priority: 55
  relevant_docs:
  - docs/atlas/verification-engine.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - atlas verify --pr <N> --repo <OWNER/REPO> resolves the PR head commit and changed file list from the GitHub API.
  - The command resolves closed tickets from the PR title (ATLAS-NN key pattern) with --tickets ATLAS-a,ATLAS-b as an override.
  - evaluate_pr is called with the resolved tickets, head commit, and evidence from the store.
  - Results are persisted as append-only VerificationCheck rows (one per check per ticket).
  - The report prints the PR verdict, per-ticket verdict, and per-check breakdown (check_type, required, status, reason, evidence IDs).
  - --json emits the serialised PRVerification for automation.
  - Exit code is 0 for PASSED, PENDING, and FAILED verdicts; non-zero only for precondition failures (unknown PR, missing token, cold database, malformed --repo).
  non_goals:
  - Interactive operator confirmation capture (writing MANUAL_APPROVAL evidence records) — that is a separate follow-on.
  - A --strict mode that exits non-zero on FAILED — explicitly deferred.
  - A dashboard or web UI.
  - Making the command block a merge — it is advisory only in v1.
  implementation_notes:
  - Wire into atlas/cli.py as `atlas verify` subcommand using Typer.
  - Reuse the GitHub client from Phase 6 (atlas.github) for PR metadata.
  - 'PR title parsing: extract the first ATLAS-\d+ pattern from the title.'
  - The command is the only place that calls both evaluate_pr and VerificationCheckRepo.add in sequence.
  test_requirements:
  - 'Integration test with a mocked GitHub client: PR head commit and file list resolved correctly.'
  - 'Test: PR title with ATLAS-NN key → correct ticket resolved.'
  - 'Test: --tickets override takes precedence over PR title parsing.'
  - 'Test: VerificationCheck rows are persisted after a successful run.'
  - 'Test: cold database (missing schema) → non-zero exit with a clear precondition error message.'
  - 'Test: --json output is valid JSON matching the PRVerification schema.'
  documentation_requirements:
  - CLI help text for atlas verify explaining the exit-code contract and the non-interactive nature.
  definition_of_done:
  - atlas verify command implemented and wired into the CLI.
  - All integration and unit tests pass in CI.
  - 'Exit-code contract verified: PASSED/PENDING/FAILED all exit 0; precondition failures exit non-zero.'
  - No interactive evidence-writing present in this ticket's scope.
