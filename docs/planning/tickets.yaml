  key: ATLAS-45
  title: Linear integration with ADR-0006 field ownership boundary
  objective: 'Implement the atlas.linear boundary layer: LinearClient with create/update/fetch operations, field-ownership allow-list enforcing definitions Atlas→Linear and status Linear→Atlas, LinearStatusMap with operator-configured state-id mapping, and the InMemoryLinearClient fake for contract testing.'
  context: 'ADR-0006 establishes strict field ownership: ticket definitions (title, description) flow Atlas→Linear; ticket status flows Linear→Atlas; nothing else crosses. The atlas.linear package is the Phase 4 provider boundary that enforces this mechanically. LinearClient must reject any attempt to push status fields, and status mapping must use stable Linear state IDs (not rename-fragile names). The LinearStatusMap is sourced from the LINEAR_STATE_MAP env var. Secrets (LINEAR_API_KEY, LINEAR_TEAM_ID, LINEAR_PROJECT_ID, LINEAR_STATE_MAP) are read only at this boundary and never logged.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 100
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/decisions/0006-source-of-truth-hierarchy.md
  - ARCHITECTURE.md
  acceptance_criteria:
  - LinearClient exposes create_issue, update_issue, fetch_issue, fetch_workflow_states, set_state, and fetch_comments; returns LinearIssue DTOs.
  - definition_payload(ticket) is built only from OWNED_DEFINITION_FIELDS (title, description summary); the client rejects any key outside OWNED_LINEAR_INPUT_KEYS, making status push mechanically impossible.
  - LinearStatusMap is loaded from LINEAR_STATE_MAP env var (JSON dict of linear_state_id→TicketStatus); a missing or empty map raises LinearStatusMapError on the live path.
  - status_from_issue(issue, status_map) returns the mapped TicketStatus or None for unmapped ids; never guesses.
  - validate_against_states confirms each configured state id exists in the workspace and rejects type-contradictory mappings; stale UUIDs fail loudly.
  - InMemoryLinearClient implements the same protocol as LinearClient and is used in all unit/contract tests; CI runs with no network and no secrets.
  - An opt-in live smoke test (ATLAS_LIVE_TESTS=1) exercises the real workspace and is skipped in default CI.
  non_goals:
  - The sync loop that calls this client on a cadence (that is the scheduler ticket).
  - Webhook-based transport (pull-only per ADR-0008).
  - Labels and priority sync (deferred; tracked in debt register).
  - Epic↔Linear project mapping.
  implementation_notes:
  - Use stdlib urllib or httpx for GraphQL transport; no webhooks.
  - LINEAR_PROJECT_ID is the project UUID (not slugId); scope issue creation to the project so Symphony's poll sees it.
  - The real client and the fake share a Protocol/ABC so tests inject either transparently.
  - state_id_for(status) inverts the configured map; exactly one state must map to ready_for_agent and needs_human_decision, validated at load.
  test_requirements:
  - 'Unit tests for definition_payload: verify no state key is ever included.'
  - 'Unit tests for status_from_issue: mapped id returns correct status, unmapped returns None.'
  - Contract tests against InMemoryLinearClient covering create, update, fetch, set_state, fetch_comments.
  - Test that validate_against_states raises on a stale or type-contradictory mapping.
  - Test that a missing LINEAR_STATE_MAP raises LinearStatusMapError.
  - 'import-linter check: atlas.linear imports nothing from atlas.pm or higher layers.'
  documentation_requirements:
  - Inline docstrings on LinearClient methods documenting field-ownership constraints.
  - Comment in client.py referencing ADR-0006 field-ownership table.
  definition_of_done:
  - All unit and contract tests pass in CI with no network calls.
  - import-linter layers contract passes (atlas.linear below atlas.pm).
  - Live smoke test documented and skipped by default in CI.
  estimated_effort: null
