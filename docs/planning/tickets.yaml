  - Do not implement staged multi-call prompt templates (those are a separate ticket per ADR-0010).
  - Do not implement prompt versioning beyond filename/front-matter convention.
  implementation_notes:
  - Use jinja2.Environment(undefined=StrictUndefined).
  - Front matter can be a YAML block at the top of the template file listing required variables.
  - Return a RenderedPrompt dataclass carrying rendered_text, prompt_hash, and prompt_version.
  test_requirements:
  - Unit test that a template with a missing variable raises a Jinja2 UndefinedError.
  - Unit test that front-matter validation rejects a template missing a required variable declaration.
  - Unit test that the same inputs produce the same hash on repeated calls.
  - Unit test that the version parameter selects the correct template file.
  documentation_requirements:
  - README or docstring in atlas/planning/prompts/ explaining the versioning convention and required front-matter fields.
  definition_of_done:
  - All unit tests pass in CI.
  - A rendered prompt for a fixture document set produces a stable hash.
  - The prompt_version and prompt_hash are accessible for PlanRun recording.
