  key: ATLAS-171
  title: 'An agent can complete verified work and lose it at the push: probe GitHub write access in before_run'
  objective: A dispatched agent's attempt aborts in seconds when its session cannot push to the repository, instead of building for an hour and stranding verified work in a workspace behind a 403.
  context: 'Live incident, 2026-07-16, ATLAS-102. The agent rebased onto current main, resolved a duplicate-delivery conflict correctly, ran the full gate sweep green (1869 passed), and then could not hand off: `git push --force-with-lease` returned HTTP 403 `Permission to derekrivers/atlas.git denied to derekrivers`, and `gh` PR-body updates returned 403 `Resource not accessible by personal access token`. An hour of correct, verified work existed only as commit 286dc9a in `~/code/atlas-workspaces/ATL-250`, recoverable only because `workspace.before_remove: true` and the root is not `/tmp`. The agent handled it as well as the contract allows — it reported precisely, named the commit, and asked for a human — but the contract has no defined behaviour for ''work done, push denied'', and ATLAS-168''s ordering (rebase -> push -> CI -> Review Required) assumes the push succeeds. Root cause is structural, not accidental: WORKFLOW.md dispatches Codex with `shell_environment_policy.inherit=core`, which strips the operator''s exported `GITHUB_TOKEN`; the session therefore authenticates with whatever on-disk git credential the sandbox can reach, which is a DIFFERENT token from the operator''s and may carry different scopes. The operator''s own `atlas preflight` cannot detect this — it would probe the operator''s token, not the agent''s. The check must run inside the agent''s session, which means the hook. Pre-ruled decisions: D-1 `hooks.before_run` gains a write-access probe that runs in the agent''s own environment, after the existing `git fetch origin main` freshness step (ATLAS-168). Symphony''s `before_run` failure aborts the attempt — that is exactly the desired semantic, and it costs seconds. D-2 the probe is read-only and non-mutating: `git push --dry-run` against the current HEAD (or an equivalent that exercises the credential without creating a ref). It must not create branches, tags, or refs on the remote. D-3 the failure message names the cause in the agent''s transcript — no write credential for `<repo>`, session env is `inherit=core`, the operator''s exported GITHUB_TOKEN is not visible here — so the operator diagnoses in one read instead of an hour. D-4 no token, credential, or secret value appears in WORKFLOW.md, in any committed file, or in the probe''s output; WORKFLOW.md is public. Injecting a token via `shell_environment_policy.set` is REJECTED for exactly this reason. D-5 this is a contract change (WORKFLOW.md front matter + symphony-integration.md), delivered as a normal PR against this repository; NO Symphony code changes (the ATLAS-168 D-1 precedent). D-6 the operator-side credential facts (two auth channels: Atlas reads `GITHUB_TOKEN`; agents use on-disk credentials via the gh credential helper) belong in `operator-environment.md`, not the repository — out of scope here, recorded as an operator action.'
  status: done
  ticket_type: infrastructure
  risk_level: low
  priority: 50
  relevant_docs:
  - docs/planning/inbox/processed/inbox-stub-github-write-preflight.md
  acceptance_criteria:
  - WORKFLOW.md `hooks.before_run` contains a non-mutating write-access probe that runs after the origin/main fetch; the front matter remains parseable by `yaml.safe_load` and existing workflow-contract assertions pass unmodified.
  - 'The probe creates no remote ref: a documented probe or fixture demonstrates it exercises the credential without writing (seed the probe with `assert 1 == 2`, B011).'
  - 'The failure path is documented in symphony-integration.md: what the message says, why `inherit=core` means the agent''s credential differs from the operator''s, and that a failed probe aborts the attempt before any work is done.'
  - symphony-integration.md records the stranded-work incident as the motivating evidence trail (ATLAS-102 / commit 286dc9a, 2026-07-16) and states that a failed handoff leaves work only in the workspace.
  - 'Negative: no token or credential value appears anywhere in WORKFLOW.md or any committed file; the two per-product knobs remain the only per-product values per the canonical-contract header.'
  non_goals:
  - No Symphony code changes. No token injection into the agent environment via shell_environment_policy.set or any other mechanism. No change to the rebase/push/CI ordering (ATLAS-168 stands). No new atlas CLI check — the operator's token is not the agent's token, so an atlas-side probe would prove the wrong thing. No workspace-recovery automation.
  implementation_notes: []
  test_requirements:
  - WORKFLOW.md front matter parses; existing workflow-contract tests pass unmodified; `ATLAS_LIVE_TESTS=0`; seeded defects use `assert 1 == 2` (B011).
  documentation_requirements: []
  definition_of_done:
  - All acceptance criteria evidenced by named tests or named doc anchors; the probe is exercised by at least one real dispatch and the operator records the result on the ticket; full gate sweep green; PR title carries the minted key.
