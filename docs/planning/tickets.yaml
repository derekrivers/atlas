  key: ATLAS-55
  title: Tick-failure record model (TickFailure) and recorded_since predicate
  objective: 'Implement the TickFailure append-only model and migration: one row per tick-level crash, system-attributed, with a failure_signature (exception type FQCN) and detail field; and the DebtItemRepo.recorded_since(signature, since) query-time dedup predicate used by the scheduler''s create-on-crash logic.'
  context: 'ATLAS-125 in the roadmap. TickFailure is a separate model from DebtItem (no ticket_id; it is tick-level). The scheduler (ATLAS-50) is the sole writer: when sync_tick raises, the scheduler records one TickFailure and continues. The dedup predicate recorded_since(signature, since) returns True if a TickFailure with that signature exists since the given timestamp, enabling the scheduler to bound row volume (default 1-hour window). The count surfaces in the delivery report.'
  status: done
  ticket_type: infrastructure
  risk_level: medium
  priority: 82
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - 'TickFailure Pydantic and SQLAlchemy models exist with fields: id, failure_signature (exception FQCN), detail (text), recorded_at.'
  - Alembic migration creates the tick_failures table; migration is reversible.
  - TickFailureRepo.add persists a new row; rows are append-only (no update or delete).
  - TickFailureRepo.recorded_since(signature, since) returns True if any row with that signature has recorded_at >= since.
  - JSON schema is regenerated from the updated Pydantic models.
  - TickFailure count (total and within the dedup window) is accessible for the delivery report.
  non_goals:
  - The scheduler that calls TickFailureRepo.add (that is the PM scheduler ticket).
  - Surfacing TickFailure in the delivery report (that is the delivery metrics ticket).
  - Any mutable lifecycle on TickFailure rows.
  - Per-ticket crash records (TickFailure is tick-level, not ticket-level).
  implementation_notes:
  - failure_signature is the caught exception's fully-qualified type name (e.g. requests.exceptions.ConnectionError).
  - recorded_at is set by the repository at insert time.
  - The dedup window is supplied by the caller (the scheduler); the model and repo carry no default window.
  test_requirements:
  - 'Unit test: TickFailureRepo.add persists a row; a second call creates a second row.'
  - 'Unit test: recorded_since returns True when a matching row exists within the window, False otherwise.'
  - 'Unit test: the migration applies and rolls back cleanly.'
  - 'Unit test: TickFailure round-trips through the database.'
  documentation_requirements:
  - Docstring on TickFailure documenting tick-level scope and separation from DebtItem.
  - Docstring on recorded_since documenting the windowed dedup contract.
  definition_of_done:
  - Migration applies and rolls back cleanly in CI.
  - All unit tests pass.
  - JSON schema regenerated and committed.
  estimated_effort: null
