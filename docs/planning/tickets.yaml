  key: ATLAS-106
  title: Continuous learning scheduler (`atlas lessons schedule`)
  objective: Implement the continuous learning scheduler that periodically triggers lesson extraction for recently completed and failed tickets, ensuring the learning loop runs without manual operator invocation.
  context: The implementation roadmap lists ATLAS-100 as 'Continuous learning scheduler'. The learning-system.md extraction triggers specify that extraction fires on ticket reaching done or rejected, and on PM failure-analysis events. The scheduler is the recurring loop that ensures these triggers are not missed — analogous to the PM Engine scheduler (ATLAS-50) but scoped to the learning system. It polls for recently completed/failed tickets that have not yet had extraction attempted and fires the extractor. Per ADR-0005, the scheduler logic is deterministic; only the extractor makes LLM calls.
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 85
  relevant_docs:
  - docs/atlas/learning-system.md
  - docs/atlas/implementation-roadmap.md
  - docs/atlas/pm-engine-and-linear-sync.md
  acceptance_criteria:
  - '`atlas lessons schedule` runs a recurring loop that polls for tickets in `done` or `rejected` status that have no extraction attempt recorded, and fires the extractor for each.'
  - The scheduler also fires extraction for tickets that have a PM failure-analysis DebtItem (DWELL_BREACH or REVIEW_CYCLE) recorded since the last extraction attempt.
  - The polling interval is configurable via `--interval` (default 300s).
  - '`--once` runs exactly one poll cycle and exits.'
  - A failed extraction for one ticket is logged and does not stop the scheduler from processing other tickets.
  - The scheduler records an extraction attempt timestamp per ticket to prevent re-extraction on every tick.
  non_goals:
  - Distributed job scheduling — a plain loop is sufficient per the PM Engine precedent.
  - Extraction triggered by events other than done, rejected, and PM failure-analysis.
  - Operator-requested extraction (handled by `atlas lessons extract <KEY>`).
  - Lesson promotion — the scheduler only triggers extraction, not promotion.
  implementation_notes:
  - Implement in `atlas/learning/scheduler.py`; follow the PM Engine scheduler pattern (ATLAS-50).
  - Record extraction attempts in a `lesson_extraction_attempts` table or as a field on the ticket record — choose the simpler option.
  - 'Graceful shutdown on SIGTERM/SIGINT: finish the in-flight cycle then stop.'
  - The scheduler is the sole writer of extraction attempt records.
  test_requirements:
  - 'Unit test: the scheduler identifies tickets needing extraction (done/rejected with no prior attempt).'
  - 'Unit test: tickets with a prior extraction attempt are skipped.'
  - 'Unit test: a failed extraction for one ticket does not prevent processing of others.'
  - 'Unit test: `--once` exits after one cycle.'
  - 'Integration test: `atlas lessons schedule --once` against fixture tickets triggers extraction for eligible tickets.'
  documentation_requirements:
  - CLI help text for `atlas lessons schedule`.
  - Docstrings on the scheduler module.
  definition_of_done:
  - Scheduler correctly identifies and processes eligible tickets in all tests.
  - Failed extractions are logged and do not crash the scheduler.
  - '`--once` and `--interval` flags work correctly.'
  - All tests pass in CI.
  estimated_effort: null
