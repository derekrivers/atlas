  - 'Fixture: a graph with a dangling target; assert DanglingTargetError and DANGLING_TARGET not-ready reason.'
  - 'Fixture: a branching graph; assert the correct branch is the critical path.'
  - All fixtures are pure in-memory (no DB, no I/O).
  documentation_requirements:
