  key: ATLAS-52
  title: Dwell-breach logging (ATLAS-119)
  objective: 'Implement the dwell-breach detection pass (step 5 of the sync loop): for tickets in in_progress, pr_open, or review_required that have exceeded their configured dwell horizon, append one DWELL_BREACH DebtItem per episode, deduped by Ticket.status_entered_at.'
  context: 'Dwell horizons (defaults: in_progress 24h, pr_open 48h, review_required 7d) are configurable. The detection is report-only: it never changes ticket state. Per-episode dedup is enforced by status_entered_at: one DWELL_BREACH row per episode (since the ticket entered its current status). A NULL status_entered_at is skipped. status_entered_at is stamped by apply_linear_status (the sole post-creation status writer) on every real status change. This pass requires the status_entered_at field on Ticket, which must be added via migration if not already present.'
  status: done
  ticket_type: feature
  risk_level: medium
  priority: 75
  relevant_docs:
  - docs/atlas/pm-engine-and-linear-sync.md
  - docs/decisions/0011-debtitem-denotes-delivery-anomalies.md
  acceptance_criteria:
  - _detect_dwell iterates tickets in in_progress, pr_open, and review_required; for each ticket past its horizon with no DWELL_BREACH row since status_entered_at, appends one DWELL_BREACH DebtItem.
  - 'Dwell horizons are configurable (defaults: in_progress 24h, pr_open 48h, review_required 7d).'
  - 'Per-episode dedup: a ticket past its horizon across multiple ticks produces exactly one DWELL_BREACH row per episode.'
  - A ticket with NULL status_entered_at is skipped (never logged).
  - _detect_dwell never calls set_state or changes any ticket status.
  - DWELL_BREACH items appear in the delivery report output.
  non_goals:
  - Automatically routing dwell-breached tickets to a different status (report-only).
  - Dwell detection for the blocked status (no horizon for blocked by design).
  - Review-cycle detection (separate ticket).
  implementation_notes:
  - status_entered_at is a nullable datetime column on Ticket; add via Alembic migration if not already present (coordinate with ATLAS-118/120 which also need it).
  - 'The dedup query: no DWELL_BREACH row with observed_at >= ticket.status_entered_at for this ticket.'
  - now is taken fresh per tick by the scheduler; _detect_dwell receives it as a parameter for testability.
  test_requirements:
  - 'Unit test: a ticket in in_progress past 24h with no prior DWELL_BREACH since status_entered_at produces one DebtItem.'
  - 'Unit test: calling _detect_dwell twice in the same episode produces exactly one DebtItem.'
  - 'Unit test: a ticket with NULL status_entered_at is skipped.'
  - 'Unit test: a ticket not past its horizon produces no DebtItem.'
  - 'Unit test: _detect_dwell makes no set_state calls.'
  - 'Unit test: configurable horizons are respected (override defaults in test).'
  documentation_requirements:
  - Docstring on _detect_dwell documenting report-only contract, configurable horizons, and per-episode dedup.
  definition_of_done:
  - Alembic migration for status_entered_at applies and rolls back cleanly (if not already added).
  - All unit tests pass in CI.
  - No set_state call reachable from _detect_dwell.
  - DWELL_BREACH items visible in atlas pm report output.
  estimated_effort: null
