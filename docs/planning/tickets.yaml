  key: ATLAS-87
  title: Ticket-level verdict composition
  objective: Implement the verify(ticket) function that composes per-check evaluations into a single ticket verdict using the required-check matrix, applying fail-precedence over gating checks and returning PASSED only when every required check is PASSED.
  context: 'The verdict composer takes a ticket, its PR head commit, and the evidence records, runs each required evaluator, and folds the results: FAILED if any required check is FAILED (fail precedence), PASSED if all required checks are PASSED, otherwise PENDING. Non-required checks (like the deferred SECURITY surface) appear in the breakdown but do not gate. A required check with no wired evaluator holds the verdict at PENDING rather than silently passing.'
  status: done
  ticket_type: feature
  risk_level: high
  priority: 70
  relevant_docs:
  - docs/atlas/verification-engine.md
  - docs/atlas/implementation-roadmap.md
  acceptance_criteria:
  - verify(ticket, head_commit, evidence_records) calls the required evaluators determined by the rules resolver and returns a TicketVerification object carrying the overall verdict and a per-check breakdown.
  - The verdict is PASSED only when every required check (required=True) returns PASSED.
  - The verdict is FAILED if any required check returns FAILED (fail precedence over PENDING).
  - The verdict is PENDING if no required check is FAILED and at least one required check is not PASSED.
  - Non-required checks appear in the breakdown with their evaluation result but do not affect the verdict.
  - A required check type with no wired evaluator returns PENDING (not PASSED) — it holds the verdict at PENDING.
  - 'Unit tests cover: all required checks PASSED, one required check FAILED, mixed PENDING/PASSED, non-required check FAILED does not sink verdict.'
  non_goals:
  - Persisting VerificationCheck records — that is the CLI/persistence ticket.
  - PR-level aggregation — that is a separate ticket.
  - Implementing any individual evaluator — those are separate tickets.
  implementation_notes:
  - Implement in atlas/verification/verdict.py.
  - 'The fold is: collect required evaluations; if any FAILED → FAILED; if all PASSED → PASSED; else PENDING.'
  - The evaluator registry maps VerificationCheckType to evaluator function; an absent entry returns a PENDING CheckEvaluation.
  test_requirements:
  - 'Unit test: all required checks PASSED → PASSED verdict.'
  - 'Unit test: one required check FAILED → FAILED verdict regardless of others.'
  - 'Unit test: one required check PENDING, rest PASSED → PENDING verdict.'
  - 'Unit test: non-required check FAILED → verdict unaffected (PASSED if required checks pass).'
  - 'Unit test: required check type with no evaluator wired → PENDING verdict.'
  - 'Unit test: TicketVerification breakdown contains entries for all checks including non-required.'
  documentation_requirements: []
  definition_of_done:
  - verify(ticket, ...) implemented and type-annotated.
  - Fail-precedence and PENDING-hold behaviours verified in tests.
  - All unit tests pass in CI.
  - No persistence logic present.
