[project]
name = "atlas"
description = "Stateful organisational operating system for autonomous software delivery, planning, evidence tracking, and knowledge accumulation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.40",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260518",
    "hypothesis>=6.100",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: atlas/__init__.py.__version__.
[tool.hatch.version]
path = "atlas/__init__.py"

[tool.hatch.build.targets.wheel]
# Flat layout: the atlas/ directory is the package. Hatchling includes all
# files under it, so atlas/planning/prompts/*.j2 and its README ship as
# package data.
packages = ["atlas"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
# Relaxation: untyped third-party packages (e.g. networkx has no stubs)
# would otherwise block every import; per-module overrides below keep the
# rest of strict mode intact.
[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

# The Anthropic SDK ships types but is imported lazily inside the concrete
# client only (atlas/planning/client.py); the override keeps strict mode
# intact if a build lacks the stubs.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Architecture-fitness sensor (ATLAS-114): the layer spine is executable.
# Layers run high -> low; a lower layer may never import a higher one
# (e.g. dependencies -> planning, the edge ATLAS-113 removed). atlas.cli is
# a module, the rest packages; both are valid layer names. atlas.tools and
# atlas.__main__ are consumers outside the spine and are intentionally
# unconstrained. The canonical order is mirrored in ARCHITECTURE.md.
[tool.importlinter]
root_package = "atlas"

[[tool.importlinter.contracts]]
name = "Atlas layer spine"
type = "layers"
layers = [
    "atlas.cli",
    "atlas.planning",
    "atlas.dependencies",
    "atlas.storage",
    "atlas.linear",
    "atlas.core",
]
